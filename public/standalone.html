const DATA={"story":{"start":{"title":"序 · 落雪长安","art":"w_sc_winter_road","text":["大业十三年，冬。长安城落了七日的雪。","你醒来时，身上只有一件破棉袄，和一枚不知道来路的青玉坠。","城南破庙的老乞丐说，你被人放在庙门口，襁褓里塞着这枚坠子。","“孩子，江湖这条路，跨出去就回不了头了。”"],"choices":[{"text":"我出身书香门第，家中遭难，流落至此","eff":{"wuxing":15,"fame":5,"note":"悟性 +15 · 名望 +5"},"next":"origin_scholar"},{"text":"我自小在市井长大，偷鸡摸狗，活得比谁都结实","eff":{"money":30,"hp":10,"note":"银两 +30 · 气血 +10"},"next":"origin_street"},{"text":"我父亲曾是边军武将，我身上流着军人的血","eff":{"hp":20,"neili":5,"note":"气血 +20 · 内力 +5"},"next":"origin_general"},{"text":"我不记得了。我只想知道那枚玉坠从哪来","eff":{"wuxing":8,"note":"悟性 +8 · 获得「青玉坠」","items":["青玉坠"]},"next":"origin_unknown"}]},"origin_scholar":{"title":"序 · 旧宅残卷","art":"w_sc_inn_room","text":["你记得家里的书房。父亲是翰林院的编修，母亲会弹《平沙落雁》。","那年秋天，一队黑衣人烧了宅子。你被奶娘塞进枯井，听着上面的惨叫。","井底有一卷被水泡烂的帛书，只余半页字迹：“……气行周天，意守紫府……”"],"choices":[{"text":"背下这半页心法，日夜默诵","eff":{"wuxing":10,"neili":8,"note":"悟性 +10 · 内力 +8","items":["残帛心法"]},"next":"ch1_blood"},{"text":"先把父母的名字刻在井壁上，记住仇人的刀","eff":{"karma":-5,"fame":3,"note":"善恶 -5 · 名望 +3"},"next":"ch1_blood"}]},"origin_street":{"title":"序 · 城西赌坊","art":"w_sc_market","text":["城西的赌坊、当铺、勾栏，你都熟。","十二岁那年，你从镖局偷了半包银锭，被追了三条街，翻墙时摔断了腿。","后来没人追你了——因为追的人都被你摸清了底细，反过来被你敲了一笔。"],"choices":[{"text":"这世道，活着比什么都强","eff":{"money":50,"karma":-5,"note":"银两 +50 · 善恶 -5"},"next":"ch1_blood"},{"text":"偷归偷，可我从没害过人命","eff":{"karma":5,"fame":2,"note":"善恶 +5 · 名望 +2"},"next":"ch1_blood"}]},"origin_general":{"title":"序 · 边关旧甲","art":"w_sc_mountain_pass","text":["你父亲守雁门十年，最后一战，三千人只回来十七个。","朝廷说他通敌。抄家那日，你从后墙翻出，怀里抱着一柄断了半截的横刀。","刀柄上缠着的布条已经磨烂，露出两个字：不退。"],"choices":[{"text":"带着断刀上路，去找当年的监军问个明白","eff":{"hp":15,"fame":8,"note":"气血 +15 · 名望 +8","items":["断刀·不退"]},"next":"ch1_blood"},{"text":"先把父亲的旧部一个个找回来","eff":{"fame":5,"money":20,"note":"名望 +5 · 银两 +20"},"next":"ch1_blood"}]},"origin_unknown":{"title":"序 · 青玉坠","art":"w_sc_temple_night","text":["老乞丐盯着那枚玉坠看了很久，忽然跪下来磕了三个头。","“这东西……二十年前我见过。在一个死人的手里。”","他没再多说，只把一枚铜钱塞给你：“去终南山，找一个姓沈的瞎子。”"],"choices":[{"text":"收下铜钱，即刻动身去终南山","eff":{"wuxing":5,"note":"悟性 +5 · 得到「引路铜钱」","items":["引路铜钱"]},"next":"ch1_blood"},{"text":"先问清楚：那死人是谁？","eff":{"fame":4,"karma":-3,"note":"名望 +4 · 善恶 -3"},"next":"ch1_blood"}]},"ch1_blood":{"title":"第一章 · 血夜","art":"w_ruined_temple","text":["这一夜，破庙外来了七个人。","黑衣，软底靴，腰间挂着同一枚铁牌——是江湖上出了名的“追魂七煞”。","为首者掀开庙门，看了一眼你胸前的玉坠，笑了：“找了你十六年。”","老乞丐抄起一根木棍，挡在你身前：“娃，跑。”"],"choices":[{"text":"跑。跑得越快越好，别回头","eff":{"hp":-10,"karma":-2,"note":"气血 -10 · 善恶 -2"},"next":"ch1_snow"},{"text":"抄起庙里的香炉，砸向最近的那张脸","eff":{"hp":-20,"fame":6,"karma":5,"note":"气血 -20 · 名望 +6 · 善恶 +5"},"next":"ch1_fight"},{"text":"把玉坠扔出去，趁他们抢的时候从后窗走","eff":{"wuxing":8,"karma":-5,"note":"悟性 +8 · 善恶 -5 · 失去青玉坠"},"next":"ch1_snow"},{"text":"抓过老乞丐的刀，和最近的杀手拼了","eff":{"fame":10,"note":"名望 +10"},"battle":{"name":"追魂七煞·老三","art":"w_villain","hp":60,"atk":12,"def":2,"fleeOk":true,"win":"ch1_fight","lose":"ch1_flee","reward":{"fame":8,"neili":5}}}]},"ch1_flee":{"title":"第一章 · 雪地","art":"w_sc_river_dock","text":["你跌进一条结冰的水沟，听见身后木棍断裂的声音，和一声闷哼。","天快亮时，沟边来了个背药篓的老人。他把手按在你脉上，皱眉：“经脉尽断，还能撑到现在，命硬。”","“跟我走吧。我教你活下去的法子。”"],"choices":[{"text":"拜他为师，学剑","eff":{"neili":15,"wuxing":8,"note":"内力 +15 · 悟性 +8","flags":{"master":"剑"}},"next":"ch1_teach_sword"},{"text":"拜他为师，学毒","eff":{"neili":10,"wuxing":12,"karma":-5,"note":"内力 +10 · 悟性 +12 · 善恶 -5","flags":{"master":"毒"}},"next":"ch1_teach_poison"},{"text":"先问他：昨夜那些人是什么来路？","eff":{"fame":3,"note":"名望 +3","flags":{"know_trail":true}},"next":"ch1_teach_sword"}]},"ch1_fight":{"title":"第一章 · 一炉之勇","art":"w_monk","text":["香炉砸中一人面门，血溅在庙里的泥像上。","你被一脚踹翻，肋骨断了三根。但老乞丐趁机撞开庙门，把我拖进了雪里。","“傻娃，”他咳着血笑，“有时候人得先学会不要命。”"],"choices":[{"text":"背起他往城外走","eff":{"hp":-10,"karma":8,"fame":5,"note":"气血 -10 · 善恶 +8 · 名望 +5","flags":{"saved_beggar":true}},"next":"ch1_teach_sword"},{"text":"把他放下，先去找援兵","eff":{"hp":-5,"karma":-3,"note":"气血 -5 · 善恶 -3"},"next":"ch1_teach_sword"}]},"ch1_teach_sword":{"title":"第一章 · 三年","art":"w_loc_luoyang","text":["师父姓沈，是个瞎子。他说他年轻时也用过剑，后来觉得剑太吵，就改用药了。","三年里，你在竹屋后的溪水里练剑。水不流，剑不动，你就不能停。","第三年冬，师父咳血。他把你叫到床前：“追魂七煞是别人的刀。真正杀你全家的，是‘玄阴教’。”"],"choices":[{"text":"“我去杀了他们。”","eff":{"karma":-5,"fame":8,"note":"善恶 -5 · 名望 +8","flags":{"path":"revenge"}},"next":"ch1_lesson_1"},{"text":"“先查清楚，谁下的令。”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"path":"truth"}},"next":"ch1_lesson_1"},{"text":"“师父，您还没教我最后那一剑。”","eff":{"neili":20,"wuxing":5,"note":"内力 +20 · 悟性 +5","items":["沈氏剑谱"]},"next":"ch1_lesson_1"},{"text":"先去投个门派，挂个名头","eff":{"fame":4,"note":"名望 +4"},"next":"sect_choose"}]},"ch1_teach_poison":{"title":"第一章 · 百草","art":"w_sc_battlefield","text":["师父的药篓里，一半是救人的，一半是杀人的。","“分不清这两样的人，不适合学毒。”他说。","你学会了用七种草木配一味无色无味的药，也学会了解它。","三年后的雪夜，师父死在灶前，手里攥着一张纸：“玄阴教。”"],"choices":[{"text":"把那张纸烧了，从此只信自己的手","eff":{"wuxing":10,"karma":-8,"note":"悟性 +10 · 善恶 -8","items":["七草散"]},"next":"ch1_lesson_poison"},{"text":"把纸收好，去查这条线的尽头","eff":{"karma":5,"fame":3,"note":"善恶 +5 · 名望 +3","items":["玄阴教线索"]},"next":"ch1_lesson_poison"},{"text":"去投个门派，先学一身本事","eff":{"fame":4,"note":"名望 +4"},"next":"sect_choose"}]},"ch2_inn":{"title":"第二章 · 悦来客栈","art":"w_inn","text":["下山第七日，你在悦来客栈遇见了一桩事。","邻桌三个汉子围着一个说书先生，逼他交出什么“残卷”。","说书先生咳得厉害，袖口露出半截绷带，血已经渗出来。","店里其他人低头吃饭，没有一个人抬眼。"],"choices":[{"text":"出手，把那三个人赶出去","eff":{"hp":-15,"fame":10,"karma":6,"note":"气血 -15 · 名望 +10 · 善恶 +6"},"next":"ch2_inn_room"},{"text":"装作醉酒，把说书先生撞出后门","eff":{"wuxing":8,"karma":3,"note":"悟性 +8 · 善恶 +3"},"next":"ch2_inn_room"},{"text":"不动。江湖事，江湖了","eff":{"karma":-6,"note":"善恶 -6","flags":{"cold":true}},"next":"ch2_cult"}]},"ch2_escort":{"title":"第二章 · 一趟镖","art":"w_sc_city_wall","text":["说书先生姓柳，是漕帮的旧人。他托你把一只木匣送到洛阳，交给“镇远镖局”的总镖头。","“匣子里不是金银，”他说，“是三十年前一份名单。”","出了城，你发现身后跟了两拨人：一拨是官府差役，一拨蒙面。"],"choices":[{"text":"走官道，迎着差役去","eff":{"fame":8,"karma":4,"note":"名望 +8 · 善恶 +4"},"next":"ch2_escort_road"},{"text":"绕山路，甩开两拨人","eff":{"hp":-10,"wuxing":6,"note":"气血 -10 · 悟性 +6"},"next":"ch2_mountain_rain"},{"text":"把匣子打开看一眼","eff":{"wuxing":12,"karma":-4,"note":"悟性 +12 · 善恶 -4","items":["名单抄本"]},"next":"ch2_mountain_rain"}]},"ch2_checkpoint":{"title":"第二章 · 关隘","art":"w_loc_changan","text":["关隘的差役验了木匣，忽然抬头看你：“这东西，你从哪儿得的？”","他的手已经按在刀柄上。","身后，那队蒙面人也到了，堵住了退路。"],"choices":[{"text":"先动手，夺刀","eff":{"hp":-25,"fame":12,"karma":-4,"note":"气血 -25 · 名望 +12 · 善恶 -4"},"next":"ch2_cult"},{"text":"高喊“玄阴教杀人灭口”，把水搅浑","eff":{"wuxing":10,"fame":6,"note":"悟性 +10 · 名望 +6"},"next":"ch2_cult"},{"text":"把匣子丢给蒙面人，趁乱走","eff":{"karma":-8,"hp":-5,"note":"善恶 -8 · 气血 -5"},"next":"ch2_cult_gate"}]},"ch2_mountain":{"title":"第二章 · 山雨","art":"w_sc_temple_night","text":["山路走到半夜，雨落下来。你在一处破山神庙躲雨。","庙里已经有个人：一身白衣，抱着剑，正在火上烤一只野兔。","“坐。”她说，“匣子给我，我保你活着到洛阳。”"],"choices":[{"text":"把匣子交给她，问她要什么价","eff":{"karma":-3,"fame":4,"note":"善恶 -3 · 名望 +4","flags":{"ally_white":true}},"next":"ch2_ally"},{"text":"把匣子抱紧：“我自己能送。”","eff":{"hp":-8,"fame":8,"note":"气血 -8 · 名望 +8","flags":{"ally_white":false}},"next":"ch2_mountain_fight"},{"text":"先问她是谁","eff":{"wuxing":8,"note":"悟性 +8","flags":{"ally_white":true}},"next":"ch2_ally"}]},"ch2_mountain_fight":{"title":"第二章 · 一剑","art":"w_heroine","text":["她拔剑的速度比雨快。","你只挡了三招，剑就停在喉前一寸。","“不错，”她收剑，“三年能挡我三招的，不多。我叫苏凝，玄阴教外堂。”"],"choices":[{"text":"“玄阴教？”你握紧了剑","eff":{"fame":6,"karma":2,"note":"名望 +6 · 善恶 +2","flags":{"enemy_cult":true}},"next":"ch2_ally_days"},{"text":"“那你为什么帮我？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"doubt_cult":true}},"next":"ch2_ally_days"}]},"ch2_ally":{"title":"第二章 · 同行","art":"w_snow_city","text":["接下来的七天，你们同行。她话很少，但会在你伤口上换药。","第八天夜里，她忽然说：“名单上的第一个名字，是我父亲。”","火堆噼啪响。你没有接话。"],"choices":[{"text":"“那我该不该杀他？”","eff":{"wuxing":8,"karma":5,"note":"悟性 +8 · 善恶 +5","flags":{"trust_su":true}},"next":"ch2_ally_days"},{"text":"什么都不说，把最后半块饼分给她","eff":{"karma":8,"fame":2,"note":"善恶 +8 · 名望 +2","flags":{"trust_su":true}},"next":"ch2_ally_days"},{"text":"半夜悄悄离开","eff":{"karma":-6,"note":"善恶 -6","flags":{"trust_su":false}},"next":"ch2_ally_days"},{"text":"（信任她）约她洛阳断桥见","cond":{"flags":{"trust_su":true}},"eff":{},"next":"romance_1"}]},"ch2_cult":{"title":"第二章 · 玄阴","art":"w_sc_river_dock","text":["玄阴教的总坛在邙山半腰，说是总坛，其实是一座废弃的道观。","你混进去的时候，正赶上一场“收徒”仪式：新入教的人要在一碗血水里按下手印。","道观深处的殿门半开着，里面有人在念一份名单。"],"choices":[{"text":"闯进殿去，看看谁在念","eff":{"hp":-20,"fame":10,"note":"气血 -20 · 名望 +10","flags":{"heard_truth":true}},"next":"ch3_eve"},{"text":"混在队伍里，按下手印","eff":{"karma":-10,"wuxing":10,"note":"善恶 -10 · 悟性 +10","flags":{"infiltrate":true}},"next":"ch2_inner_ritual"},{"text":"放火，把仪式搅乱","eff":{"hp":-15,"fame":8,"karma":3,"note":"气血 -15 · 名望 +8 · 善恶 +3"},"next":"ch2_escape"}]},"ch2_inner":{"title":"第二章 · 血手印","art":"w_loc_luoyang","text":["血水按上手印的一刻，殿里所有人都转头看你。","“新人，”一个老者说，“去把那件事办了。”","他递给你一张纸，上面写着一个名字：镇远镖局，总镖头，柳长庚。"],"choices":[{"text":"领命，去杀","eff":{"karma":-15,"fame":8,"money":100,"note":"善恶 -15 · 名望 +8 · 银两 +100"},"next":"ch3_tournament"},{"text":"领命，但打算反水","eff":{"wuxing":12,"karma":3,"note":"悟性 +12 · 善恶 +3","flags":{"double_agent":true}},"next":"ch3_tournament"}]},"ch3_tournament":{"title":"第三章 · 嵩山论剑","art":"w_sc_forest_path","text":["三年一次的嵩山论剑，天下人都来了。","你站在人群里，看见台上那个白发老者——玄阴教教主，也是当年下令的人。","抽签的结果：你的第一个对手，是苏凝。"],"choices":[{"text":"上台，全力以赴","eff":{"hp":-20,"fame":20,"note":"气血 -20 · 名望 +20","flags":{"beat_su":true}},"next":"ch3_round1"},{"text":"上台，但故意输给她","eff":{"fame":-5,"karma":8,"note":"名望 -5 · 善恶 +8","flags":{"lose_su":true}},"next":"ch3_round1"},{"text":"放弃比赛，直接去找教主","eff":{"fame":-10,"wuxing":8,"note":"名望 -10 · 悟性 +8","flags":{"skip_tournament":true}},"next":"ch3_eve"}]},"ch3_betray":{"title":"第三章 · 背叛","art":"w_snow_city","text":["你赢了，或者你输了——江湖第二天传的却是另一件事：","镇远镖局一夜之间被灭门，柳长庚的尸体挂在城门上，胸口插着一柄剑。","那柄剑，是你的。"],"choices":[{"text":"回城，当众洗清自己","eff":{"hp":-15,"fame":12,"note":"气血 -15 · 名望 +12"},"next":"ch3_witness"},{"text":"不辩解，去找真凶","eff":{"wuxing":12,"karma":3,"note":"悟性 +12 · 善恶 +3"},"next":"ch3_witness"},{"text":"趁乱吞并镖局的势力","eff":{"karma":-12,"money":200,"fame":8,"note":"善恶 -12 · 银两 +200 · 名望 +8","flags":{"ambitious":true}},"next":"ch3_truth"}]},"ch3_truth":{"title":"第三章 · 殿中真相","art":"w_sc_court_hall","text":["道观深处的殿里，挂着一幅画。画上的人，和你很像。","“你父亲，”教主说，“是我的师兄。他带走了玄阴令，还带走了……你。”","“当年那场火，是正道六派放的。我救不了他，只能救你。”","他把一柄剑放在桌上：“现在，你选。”"],"choices":[{"text":"接剑，跪下认他做师父","eff":{"karma":-12,"neili":25,"fame":10,"note":"善恶 -12 · 内力 +25 · 名望 +10","flags":{"side":"cult"}},"event":"在玄阴教总坛跪拜教主，江湖震动。","next":"ch3_truth_detail"},{"text":"把剑打落，转身就走","eff":{"karma":10,"wuxing":10,"note":"善恶 +10 · 悟性 +10","flags":{"side":"free"}},"next":"ch4_final"},{"text":"问他：“那六派的人，现在在哪？”","eff":{"fame":6,"karma":4,"note":"名望 +6 · 善恶 +4","flags":{"side":"justice","know_six":true}},"next":"ch4_six"},{"text":"不接剑。先参悟手里这些残卷","cond":{"wuxing":25},"eff":{},"next":"manual_1"}]},"ch4_six":{"title":"第四章 · 六派","art":"w_sc_city_wall","text":["六派掌门齐聚洛阳，为的是分玄阴教留下的东西。","他们不知道，你已经把名单背下来了。","你可以当众念出来，也可以一个个找上门。"],"choices":[{"text":"在英雄大会上当众念出名单","eff":{"fame":25,"karma":6,"hp":-20,"note":"名望 +25 · 善恶 +6 · 气血 -20","flags":{"public":true}},"event":"在英雄大会当众念出名单，六派哗然。","next":"ch4_final"},{"text":"夜里一个个找上门","eff":{"karma":-8,"fame":12,"hp":-25,"note":"善恶 -8 · 名望 +12 · 气血 -25","flags":{"assassin":true}},"next":"ch4_final"},{"text":"把名单交给朝廷，借刀杀人","eff":{"money":300,"fame":10,"karma":-10,"note":"银两 +300 · 名望 +10 · 善恶 -10","flags":{"court":true}},"next":"ch4_final"},{"text":"顺着名单继续往下查——渡口、落雁村、那八个人","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch5_road"}]},"ch4_final":{"title":"第四章 · 雪落","art":"w_sc_market","text":["又是一年冬。长安的雪比十六年前更大。","你站在城楼上，看着城下的人间。","名单摊在手里，可这世上的事，从来不是杀几个人就能了断的。","该往下走了。"],"choices":[{"text":"顺着名单往下查——渡口、落雁村、那八个人","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch5_road"},{"text":"先把名单摊到六派面前","eff":{"fame":6,"note":"名望 +6"},"next":"ch5_sect_war"},{"text":"带着名册进京，把十七年前的案子翻出来","eff":{"wuxing":8,"fame":6,"note":"悟性 +8 · 名望 +6"},"next":"court_1"},{"text":"铁牌的事还没了。去见该见的人","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch13_start"}]},"end_king":{"title":"结局 · 盟主","art":"w_songshan","text":["嵩山之巅，三十六派掌门齐齐抱拳。","你接过盟主令，看见台下黑压压的人群，忽然想起破庙里那个雪夜。","老乞丐没能看见这一天。师父也没有。","从今往后，江湖的规矩，由你来定。","【结局 · 武林盟主】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"end_hermit":{"title":"结局 · 归山","art":"w_bamboo_hut","text":["终南山的竹屋还在，溪水照旧不流。","你把师父的坟修好，在旁边种了一株梅。","偶尔有江湖人上山求剑，你只泡一壶茶，说：“剑在心里，不在山上。”","后来有人说，那山上的瞎子教出了天下第一的剑客，也教出了个不问世事的人。","【结局 · 归隐山林】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"end_demon":{"title":"结局 · 玄阴","art":"w_villain","text":["你坐上玄阴教主的位子那天，邙山下了三天的雨。","正道六派的讨伐檄文贴满城门，你却只是把那幅旧画收进匣子。","“名门正派，”你对着画像说，“杀人也杀人，只是杀得好看些。”","从此江湖上再无人敢提你的名字，只在夜里说“那位”。","【结局 · 魔道之主】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"end_martyr":{"title":"结局 · 一剑","art":"w_sc_battlefield","text":["六派总坛前，你一人一剑。","你没有说话，也没有退。剑断了，就用拳；拳断了，就用牙。","天亮时，雪把血盖住了。有人在城墙上刻了一行字：不知名者，死于义。","江湖记得你的剑，却不记得你的名字。","【结局 · 殉道者】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"end_official":{"title":"结局 · 官身","art":"w_sc_court_hall","text":["天子看了那份名单，沉默很久，赐了你一个五品官身。","你穿着不合身的官服，站在衙门口，看差役押着昔日的掌门走过。","有人骂你卖江湖。你没反驳。","夜深时你摸出那枚青玉坠——它在灯下泛着冷冷的光。","【结局 · 锦衣官身】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"sect_choose":{"title":"番外 · 择门","art":"w_sect_shaolin","text":["师父走后，你在竹屋住了半年。","山下来的江湖人带来消息：少林、武当、峨眉、血刀门，都在收徒。","“选一个能护住你的地方。”师父的遗书上只有这一句。"],"choices":[{"text":"少林 · 学的是不动如山","eff":{"hp":30,"neili":10,"karma":8,"note":"气血 +30 · 善恶 +8","flags":{"sect":"少林"}},"next":"sect_shaolin"},{"text":"武当 · 学的是以柔克刚","eff":{"wuxing":15,"neili":12,"note":"悟性 +15 · 内力 +12","flags":{"sect":"武当"}},"next":"sect_wudang"},{"text":"峨眉 · 学的是心剑合一","eff":{"wuxing":12,"fame":8,"note":"悟性 +12 · 名望 +8","flags":{"sect":"峨眉"}},"next":"sect_emei"},{"text":"血刀门 · 学的是杀人技","eff":{"neili":15,"karma":-12,"fame":6,"note":"内力 +15 · 善恶 -12","flags":{"sect":"血刀"}},"next":"sect_blood"}]},"sect_shaolin":{"title":"门派 · 木人巷","art":"w_sc_sect_hall","text":["木人巷三十六关，你在第十八关被打断了肋骨。","守巷的老僧递来一碗药：“疼，说明还活着。”","三年后你出巷，身上多了十道疤，心里的火却熄了一半。"],"choices":[{"text":"留在寺里做守巷人","eff":{"hp":25,"karma":10,"note":"气血 +25 · 善恶 +10"},"next":"sect_shaolin_day"},{"text":"下山，去找玄阴教","eff":{"fame":8,"karma":-3,"note":"名望 +8 · 善恶 -3"},"next":"sect_after"}]},"sect_wudang":{"title":"门派 · 太极","art":"w_sc_forest_path","text":["道长的剑很慢，慢到你能看清每一寸剑身上的雨。","“快是杀人的法子，”他说，“慢是活下去的法子。”","你在丹房抄了三年经，抄到某一日，忽然懂了什么叫“后发先至”。"],"choices":[{"text":"把太极剑理写成一册，留给自己","eff":{"wuxing":18,"neili":10,"note":"悟性 +18 · 内力 +10","items":["太极剑理"]},"next":"sect_wudang_day"},{"text":"背剑下山，试一试这剑到底快不快","eff":{"fame":10,"hp":-10,"note":"名望 +10 · 气血 -10"},"next":"sect_after"}]},"sect_emei":{"title":"门派 · 心剑","art":"w_sect_emei","text":["峨眉的师太收徒不看出身，只看“心里有没有一把剑”。","她让你在瀑布下站了七天，第八天问：“剑在哪？”","你说：“在水里。”她笑了：“那你去把它捞上来。”"],"choices":[{"text":"跳进潭里，摸了整整一夜","eff":{"wuxing":16,"neili":14,"note":"悟性 +16 · 内力 +14","items":["心剑诀"]},"next":"sect_emei_day"},{"text":"跪下来，说“剑在心里”","eff":{"karma":8,"wuxing":10,"note":"善恶 +8 · 悟性 +10"},"next":"sect_after"}]},"sect_blood":{"title":"门派 · 血刀","art":"w_sect_blood","text":["血刀门的入门礼，是杀一个“该杀的人”。","门主把人带到地牢，指着里面一个断手的汉子：“他杀了自己一家七口。”","你握着刀，站了很久。"],"choices":[{"text":"一刀下去，从此不再回头","eff":{"karma":-18,"fame":12,"neili":18,"note":"善恶 -18 · 名望 +12 · 内力 +18","items":["血刀"]},"next":"sect_blood_day"},{"text":"把刀扔了，转身就走","eff":{"karma":12,"fame":-6,"hp":-20,"note":"善恶 +12 · 名望 -6 · 气血 -20","flags":{"left_blood":true}},"next":"sect_after"},{"text":"放了那人，反手砍向门主","eff":{"hp":-35,"fame":18,"karma":10,"note":"气血 -35 · 名望 +18 · 善恶 +10","flags":{"blood_enemy":true}},"next":"sect_after"}]},"sect_after":{"title":"门派 · 试炼","art":"w_sc_sect_hall","text":["入门第三年，门派要选一个人去参加嵩山论剑。","同门师兄在背后做了手脚：你的剑被磨钝了半分。","试炼场上，你握着一柄钝剑。"],"choices":[{"text":"用钝剑，也赢下来","eff":{"hp":-25,"fame":20,"note":"气血 -25 · 名望 +20","flags":{"sect_champion":true}},"next":"ch3_tournament"},{"text":"当场揭穿师兄","eff":{"fame":10,"karma":6,"note":"名望 +10 · 善恶 +6","flags":{"sect_champion":true}},"next":"ch3_tournament"},{"text":"弃权，把这口气咽下去","eff":{"wuxing":12,"karma":4,"note":"悟性 +12 · 善恶 +4"},"next":"ch3_tournament"}]},"romance_1":{"title":"情 · 断桥","art":"w_sc_inn_room","text":["洛阳的断桥边，你又一次遇见苏凝。","她换了身素衣，没带剑，手里提着两坛酒。","“我退出玄阴教了。”她说，“但我爹还在里面。”"],"choices":[{"text":"陪她喝完这两坛","eff":{"karma" nic_qi":true}},"next":"ch4_final"}]},"merchant_1":{"title":"商 · 盘口","art":"w_sc_river_dock","text":["镇远镖局倒了之后，洛阳的漕运空出一大块。","商会的人找上门：“三百两，这个盘口归你。”","你看着账册，忽然想起破庙里的雪。"],"choices":[{"text":"盘下来，做正经生意","eff":{"money":-300,"fame":12,"karma":6,"note":"银两 -300 · 名望 +12 · 善恶 +6","flags":{"merchant":true}},"next":"merchant_2"},{"text":"盘下来，顺便做点不正经的","eff":{"money":-300,"fame":8,"karma":-8,"note":"银两 -300 · 名望 +8 · 善恶 -8","flags":{"merchant":true,"shady":true}},"next":"merchant_2"},{"text":"不碰。钱是身外物","eff":{"karma":5,"wuxing":5,"note":"善恶 +5 · 悟性 +5"},"next":"ch4_final"}]},"merchant_2":{"title":"商 · 行会","art":"w_loc_luoyang","text":["三年后，你的船队从洛阳排到扬州。","行会推你做会首，条件是“以后江湖上的事，你别管”。","可偏偏这时候，玄阴教的人在码头上杀了人。"],"choices":[{"text":"管。散尽家财也要管","eff":{"money":-200,"fame":20,"karma":12,"note":"银两 -200 · 名望 +20 · 善恶 +12"},"next":"merchant_3"},{"text":"不管。生意要紧","eff":{"money":200,"karma":-12,"note":"银两 +200 · 善恶 -12","flags":{"cold_merchant":true}},"next":"end_merchant"}]},"end_love":{"title":"结局 · 江湖远","art":"w_sc_river_dock","text":["你们在江南买了一处小院，院里有棵老梅。","她不再提剑，你也不再提仇。","有年冬天，路过一个说书人，讲嵩山论剑那场大雪。","她笑着问你：“那位少侠，最后怎么了？”","你说：“他死了。江湖里的那个，早就死了。”","【结局 · 江湖远】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"end_sect":{"title":"结局 · 掌门","art":"w_sc_sect_hall","text":["你回到门派，接下了掌门印。","开山门那日，山下的雪还没化。","你在祖师堂前站了很久，忽然想起自己刚入门时那柄钝剑。","“从今天起，这门里不许再有钝剑。”你说。","【结局 · 一派掌门】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"end_grandmaster":{"title":"结局 · 宗师","art":"w_sc_temple_night","text":["三卷合一那夜，天上落了雪，也落了整整一夜的剑鸣。","你没有开宗立派，只把心得抄了三份，挂在路边的茶棚里。","后来江湖上多了一句口头禅：“不知道的，去看茶棚。”","百年后有人考证，那三卷东西的作者，写的是“无名”。","【结局 · 一代宗师】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"end_demonform":{"title":"结局 · 成鬼","art":"w_villain","text":["魔气顺着经脉一路烧上来，你听见自己骨头里的风声越来越大。","最后那点人的神智，是看着苏凝的脸散掉的。","三年后，江湖上多了一个传说：有个影子在夜里杀人，杀完会站很久。","有人说他在等一个人。","【结局 · 走火入魔】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"end_merchant":{"title":"结局 · 富甲","art":"w_loc_luoyang","text":["你的船队从洛阳排到扬州，又从扬州排到泉州。","行会会首的位子坐久了，连刀都不太会握。","有年冬天，你在码头看见一个逃难的少年，怀里抱着一柄断刀。","你让人给了他二十两银子，什么也没问。","【结局 · 富甲一方】"],"choices":[{"text":"—— 故事没有在这里结束。继续在这江湖里活下去","eff":{"karma":2},"next":"free_roam"}]},"ch5_road":{"title":"第五章 · 雨夜追踪","art":"w_sc_river_dock","text":["线索断在洛阳城外的渡口。","船家的尸体浮在水面，手里攥着半张船票，票上写着\"邙山\"。","你在渡口的棚子下避雨，雨声里混进了一点不该有的声音——靴底踩过湿泥的声音。","不是一个人。至少五个。","你把手按在剑柄上，忽然想起师父说过：江湖上最危险的，从来不是正面来的刀。"],"choices":[{"text":"先下手，冲进雨里","eff":{"hp":-8,"fame":6,"note":"气血 -8 · 名望 +6"},"battle":{"name":"渡口杀手","art":"w_villain","hp":90,"atk":16,"def":3,"fleeOk":false,"win":"ch5_ambush_win","lose":"ch5_ambush_lose","reward":{"fame":10,"money":30}}},{"text":"不动，等他们先进棚子","eff":{"wuxing":8,"note":"悟性 +8"},"battle":{"name":"渡口杀手","art":"w_villain","hp":90,"atk":16,"def":3,"fleeOk":false,"win":"ch5_ambush_win","lose":"ch5_ambush_lose","reward":{"fame":12,"neili":6}}},{"text":"把船票扔进火堆，从水路走","eff":{"karma":-4,"wuxing":5,"note":"善恶 -4 · 悟性 +5"},"next":"ch5_ferry_rain"}]},"ch5_ambush_win":{"title":"第五章 · 雨停","art":"w_loc_luoyang","text":["雨停的时候，渡口的泥地上躺着五个人。","你搜出了三样东西：一枚六派共用的信物、一包没用完的毒粉、还有一张写了地名的纸条。","地名是“落雁村”。","你忽然明白，追魂七煞只是刀。刀后面握着刀柄的人，一直站得比你想象中更近。"],"choices":[{"text":"连夜赶去落雁村","eff":{"hp":-5,"note":"气血 -5"},"next":"ch5_ferry_rain"},{"text":"先把毒粉收起来，或许用得上","eff":{"wuxing":6,"note":"悟性 +6","items":["无名毒粉"]},"next":"ch5_ferry_rain"}]},"ch5_ambush_lose":{"title":"第五章 · 河底","art":"w_sc_river_dock","text":["你被打落水中，呛了好几口。","醒来时躺在一艘小船的舱里，一个老渔夫在船头补网。","“年轻人，命硬。”他说，“可命硬的人，往往死得更快。”","他把船靠岸，指了个方向：“落雁村。你要找的人，都在那儿。”"],"choices":[{"text":"谢过他，往落雁村去","eff":{"karma":4,"hp":10,"note":"善恶 +4 · 气血 +10"},"next":"ch5_ferry_rain"},{"text":"问他知不知道为什么这些人要杀我","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch5_ferry_rain"}]},"ch5_village":{"title":"第五章 · 落雁村","art":"w_sc_snow_village","text":["落雁村只剩下一片焦黑的房梁。","村里的井被填了，祠堂被烧了，墙上还留着刀砍的痕迹。","在祠堂的废墟里，你找到一个还没断气的老人。他抓住你的袖子：","“他们说……名单上的人，都要死。可是名单上第一个名字，是你啊。”","老人说完这句，手就松了。你在废墟里站了很久，风把灰吹到你的衣领里。"],"choices":[{"text":"替他合上眼，然后把村子里的尸体一个个埋了","eff":{"karma":12,"fame":6,"hp":-10,"note":"善恶 +12 · 名望 +6 · 气血 -10"},"next":"ch5_clue"},{"text":"先翻找祠堂，看看有没有留下什么","eff":{"wuxing":10,"money":40,"note":"悟性 +10 · 银两 +40","items":["半页名册"]},"next":"ch5_clue"},{"text":"放火烧了村子，让这里彻底消失","eff":{"karma":-12,"note":"善恶 -12","flags":{"burned_village":true}},"next":"ch5_clue"}]},"ch5_clue":{"title":"第五章 · 名册","art":"w_sc_cliff","text":["名册上只有十九个名字，最上面一个被朱砂划掉了。","被划掉的那个名字，是你父亲。","第十九个名字下面，有一行小字：“持青玉坠者，续。”","你终于明白，为什么追魂七煞找了你十六年。","你不是幸存者，你是这份名册上，唯一还活着的那一笔。"],"choices":[{"text":"把名册收好，去找名册上还活着的八个人","eff":{"fame":10,"wuxing":8,"note":"名望 +10 · 悟性 +8"},"next":"ch5_hunt"},{"text":"把名册的每一页都烧了，从此谁也不知道","eff":{"karma":6,"note":"善恶 +6","flags":{"burned_list":true}},"next":"ch5_confront"},{"text":"带着名册去六派总坛，当面对质","eff":{"fame":14,"hp":-10,"note":"名望 +14 · 气血 -10"},"next":"ch5_sect_war"}]},"ch5_hunt":{"title":"第五章 · 八个人","art":"w_ruined_temple","text":["接下来的两个月，你走了三千里路，见了名册上还活着的八个人里的五个。","三个人在见到你之前就死了。剩下两个，一个疯了，一个在寺庙里扫了二十年的落叶。","扫地的老僧认出青玉坠，手抖得几乎握不住扫帚：","“当年那一夜，我们……都在场。”"],"choices":[{"text":"杀了他","eff":{"karma":-15,"fame":8,"note":"善恶 -15 · 名望 +8","flags":{"killed_monk":true}},"next":"ch5_confront"},{"text":"听他讲完那一夜","eff":{"wuxing":14,"karma":8,"note":"悟性 +14 · 善恶 +8","flags":{"heard_night":true}},"next":"ch5_night2"},{"text":"什么也不说，转身离开","eff":{"karma":4,"wuxing":6,"note":"善恶 +4 · 悟性 +6"},"next":"ch5_confront"}]},"ch5_night":{"title":"第五章 · 那一夜","art":"w_monk","text":["老僧讲了整整一夜。","十六年前，六派围攻玄阴教，你父亲是玄阴教的护法，也是唯一主张“放下刀”的人。","他带着玄阴令和你，从后山走了。六派追上来的时候，他把你放在庙门口，然后回身迎了上去。","“他不是被追魂七煞杀的，”老僧说，“是我们。是六派。是我。”","天快亮的时候，老僧把扫帚放下，跪在雪里。"],"choices":[{"text":"扶他起来","eff":{"karma":16,"wuxing":10,"note":"善恶 +16 · 悟性 +10","flags":{"forgave":true}},"next":"ch5_confront"},{"text":"把剑留在他面前，让他自己选","eff":{"karma":6,"fame":6,"note":"善恶 +6 · 名望 +6"},"next":"ch5_confront"},{"text":"告诉他：六派，一个都别想活","eff":{"karma":-10,"fame":10,"note":"善恶 -10 · 名望 +10","flags":{"vengeance":true}},"next":"ch5_sect_war"}]},"ch5_confront":{"title":"第五章 · 对峙","art":"w_ruined_temple","text":["六派掌门在落雁村外的破庙里等你。","为首的那个，是当年亲手放火的人。他已经老了，老到握剑的手都在抖。","“你父亲把玄阴令交给你了吗？”他问。","“交给了他不想再杀人的心。”你说。","老人笑了一下，然后拔出了剑。"],"choices":[{"text":"接剑","eff":{"fame":12,"hp":-10,"note":"名望 +12 · 气血 -10"},"event":"在破庙与六派掌门拔剑相向。","battle":{"name":"六派掌门","art":"w_taoist","hp":150,"atk":22,"def":5,"fleeOk":true,"win":"ch5_after","lose":"ch5_defeat","reward":{"fame":20,"neili":10}}},{"text":"不出剑，把名册放在他面前","eff":{"wuxing":12,"karma":10,"note":"悟性 +12 · 善恶 +10"},"next":"ch5_after"},{"text":"转身就走，让他这一剑落空","eff":{"wuxing":8,"karma":5,"note":"悟性 +8 · 善恶 +5"},"next":"ch4_final"}]},"ch5_after":{"title":"第五章 · 血退","art":"w_monk","text":["老人倒下去的时候，没有闭眼。","他说：“你父亲……当年也是这么站着的。”","破庙外的雪越下越大。你忽然觉得很累，累得像已经过完了一辈子。","剩下的五个掌门站在雪里，没有人再拔剑。"],"choices":[{"text":"把剑插进雪里，说“到此为止”","eff":{"karma":14,"fame":10,"note":"善恶 +14 · 名望 +10","flags":{"ended_feud":true}},"next":"ch4_final"},{"text":"一个个问过去：你们谁还想动手","eff":{"fame":16,"karma":-4,"note":"名望 +16 · 善恶 -4"},"next":"ch4_final"},{"text":"把名册交给他们，让他们自己处理","eff":{"wuxing":10,"karma":6,"note":"悟性 +10 · 善恶 +6"},"next":"ch4_final"},{"text":"带着名册进京，把十七年前的案子翻出来","eff":{"wuxing":8,"fame":6,"note":"悟性 +8 · 名望 +6"},"next":"court_1"},{"text":"跟着独眼老人，去一趟雁门关","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch6_start"}]},"ch5_defeat":{"title":"第五章 · 败","art":"w_sc_winter_road","text":["你输了一招。只是一招，但足够了。","老人的剑停在你喉前一寸，很久没有动。","最后他收了剑，说：“你父亲当年也这样，输了一招，却让我这辈子都睡不安稳。”","他转身走了。雪地上留着一行脚印，很快被雪盖住。"],"choices":[{"text":"疗好伤，再去找他一次","eff":{"hp":60,"money":-20,"note":"气血 +60 · 银两 -20","flags":{"retried":true}},"next":"ch5_confront"},{"text":"追上去，问他最后一句话","eff":{"hp":20,"fame":8,"wuxing":8,"note":"名望 +8 · 悟性 +8"},"next":"ch5_after"},{"text":"先回去养伤，改日再来（进日常）","eff":{"hp":40,"note":"气血 +40"},"next":"free_roam"}]},"ch5_sect_war":{"title":"第五章 · 六派围攻","art":"w_sc_temple_night","text":["你把名册摊在六派总坛的香案上。","没有人看。他们只看你腰间的剑。","钟声响了三下，山门关上了。三十六个人，三十六个方向。","你忽然笑了——这大概就是父亲当年看到的景象。"],"choices":[{"text":"一个人，一把剑，杀出去","eff":{"fame":25,"hp":-40,"karma":-6,"note":"名望 +25 · 气血 -40 · 善恶 -6"},"event":"一人一剑闯六派总坛。","battle":{"name":"六派长老","art":"w_monk","hp":200,"atk":26,"def":7,"fleeOk":false,"win":"ch5_after","lose":"ch5_defeat","reward":{"fame":30,"neili":15}}},{"text":"把名册撕了，当众认下父亲的罪","eff":{"karma":12,"fame":-10,"note":"善恶 +12 · 名望 -10"},"next":"ch5_after"},{"text":"退到香案后，用他们的规矩说话","eff":{"wuxing":14,"fame":8,"note":"悟性 +14 · 名望 +8"},"next":"ch5_confront"}]},"court_1":{"title":"朝堂 · 名册入京","art":"w_loc_yanmen","text":["名册送到了刑部。三天后，刑部侍郎亲自登门。","“这份名册，牵涉到十七年前的雁门旧案。”他把茶推到你面前，“你父亲不是通敌，是奉命。”","“奉命做什么？”","“奉命守住玄阴令。那东西不是武功秘籍，是一份边军调动的凭信。”","窗外的雪落得很轻，你听见自己的心跳。"],"choices":[{"text":"问他要证据","eff":{"wuxing":10,"note":"悟性 +10"},"next":"court_2"},{"text":"问他：谁下的令","eff":{"fame":8,"note":"名望 +8","flags":{"know_order":true}},"next":"court_2"},{"text":"什么也不问，起身就走","eff":{"karma":4,"note":"善恶 +4"},"next":"ch4_final"}]},"court_2":{"title":"朝堂 · 兵部","art":"w_sc_mountain_pass","text":["刑部侍郎带你进了兵部的库房。","一排排铁柜里，是十七年前边军的粮册、调令、阵亡名册。","你翻到最后一页，看见父亲的名字后面写着一行小字：“守令而死，不入罪。”","“入罪的是下命令的人。”侍郎说，“而那个人，现在坐在龙椅上。”"],"choices":[{"text":"把名册留在兵部，让他去查","eff":{"karma":10,"fame":6,"note":"善恶 +10 · 名望 +6"},"next":"court_3"},{"text":"把名册带走，自己去问龙椅上的人","eff":{"fame":14,"hp":-10,"note":"名望 +14 · 气血 -10","flags":{"confront_emperor":true}},"next":"court_3"},{"text":"烧了它。这件事到此为止","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6"},"next":"ch4_final"}]},"court_3":{"title":"朝堂 · 宫门","art":"w_loc_changan","text":["宫门在子时关。你到的时候，还差一刻。","守门的禁军统领认得青玉坠：“你父亲当年也是从这里出去的。”","他没有拦你，只是把佩刀解下来，放在你手里。","“宫里的人，不一定会听你说话。”"],"choices":[{"text":"进去","eff":{"fame":10,"note":"名望 +10"},"next":"court_4"},{"text":"在宫门外等天亮","eff":{"wuxing":8,"karma":4,"note":"悟性 +8 · 善恶 +4"},"next":"court_4"},{"text":"转身回江湖。宫里的事，与我无关","eff":{"karma":4,"note":"善恶 +4"},"next":"ch4_final"}]},"court_4":{"title":"朝堂 · 殿上","art":"w_loc_yanmen","text":["殿上很冷。龙椅上的人比传说中更老。","“你父亲是朕的旧部。”他说，“他死的时候，朕在批折子。”","“那这道令呢？”你把名册举起来。","“令是朕下的。”他咳了两声，“可你知道为什么吗？玄阴令能调动边军。边军能拥立新主。”","“所以你先杀了他，再把这笔账记在他头上。”"],"choices":[{"text":"把名册扔在他脚下，转身离开","eff":{"karma":12,"fame":12,"note":"善恶 +12 · 名望 +12"},"next":"court_5"},{"text":"问他：现在呢？还想杀谁","eff":{"wuxing":10,"fame":8,"note":"悟性 +10 · 名望 +8"},"next":"court_5"},{"text":"拔剑","eff":{"hp":-15,"fame":16,"karma":-6,"note":"气血 -15 · 名望 +16 · 善恶 -6"},"event":"在皇宫大殿上拔了剑。","battle":{"name":"大内侍卫","art":"w_monk","hp":180,"atk":24,"def":6,"fleeOk":true,"win":"court_5","lose":"ch5_defeat","reward":{"fame":20}}}]},"court_5":{"title":"朝堂 · 雪尽","art":"w_sc_mountain_pass","text":["出宫的时候，天已经亮了。","雪停了，宫墙上的红在晨光里显得很旧。","你忽然想起父亲留给你的那两个字：不退。","原来他守的从来不是皇帝，也不是玄阴令，是雁门关里的三千个人。"],"choices":[{"text":"回雁门，看看那些人的坟","eff":{"karma":10,"fame":8,"note":"善恶 +10 · 名望 +8","flags":{"back_yangmen":true}},"next":"ch4_final"},{"text":"把父亲的旧部一个个找回来","eff":{"fame":12,"money":80,"note":"名望 +12 · 银两 +80"},"next":"ch4_final"}]},"free_roam":{"title":"江湖 · 无所事事","art":"w_loc_luoyang","text":["故事讲到这里，按理该有个结局了。","可你没有走。你还在这个世道里，天亮要吃饭，天黑要投店，剑要磨，马要喂。","长安城的清晨有卖胡饼的吆喝，洛阳的渡口一到晌午就开始吵。","江湖不是一场接一场的厮杀，江湖是这些没完没了的日子。","你可以去哪儿都行。"],"choices":[{"text":"去客栈喝一壶酒","eff":{},"next":"daily_inn"},{"text":"到市集上逛逛","eff":{},"next":"daily_market"},{"text":"在茶馆听一段书","eff":{},"next":"daily_teahouse"},{"text":"到江边练剑","eff":{},"next":"daily_river"},{"text":"去庙里上炷香","eff":{},"next":"daily_temple"},{"text":"打听打听旧案的下落","eff":{},"next":"daily_rumor"},{"text":"去门派上早课","eff":{},"next":"daily_sect"},{"text":"到当铺换点盘缠","eff":{},"next":"daily_pawnshop"},{"text":"去药铺抓副药","eff":{},"next":"daily_clinic"},{"text":"去看人打铁","eff":{},"next":"daily_forge_visit"},{"text":"去少林禅房坐坐","eff":{},"next":"daily_shaolin_court"},{"text":"去武当丹房看火","eff":{},"next":"daily_wudang_pill"},{"text":"去峨眉剑潭","eff":{},"next":"daily_emei_pond"},{"text":"去血刀门刀冢","eff":{},"next":"daily_bloodgate_tomb"},{"text":"上邙山找猎户","eff":{},"next":"daily_mangshan_hut"},{"text":"去雁门关下人家","eff":{},"next":"daily_yanmen_vet"},{"text":"去剑冢找铸剑人","eff":{},"next":"daily_swordtomb_smith"},{"text":"去庙里与僧人闲话","eff":{},"next":"daily_monk_chat"},{"text":"夜里去街上走走","eff":{},"next":"daily_night"},{"text":"去铁匠铺看看兵器","eff":{},"next":"daily_armory"},{"text":"赶一场庙会","eff":{},"next":"daily_temple_fair"},{"text":"去平康坊听一支曲子","eff":{},"next":"daily_brothel"},{"text":"回门派看看","eff":{},"next":"ch3_tournament"},{"text":"回去办正事（回到主线）","eff":{},"backStory":true}]},"daily_inn":{"title":"日常 · 半壶浊酒","art":"w_inn","text":["客栈的堂里坐了七桌人。跑堂的小二把抹布搭在肩上，从这桌窜到那桌，嘴里不停。","你要了半壶酒、一碟茴香豆。酒是劣酒，入口有点冲，咽下去却暖。","邻桌两个贩布的商人在吵，说今年的运费又涨了；柜台后头的老板娘在算账，算盘打得噼啪响。","隔壁的角落里坐着个瘦削的中年人，独自喝闷酒，桌上放着一把用布包着的刀。","过了半晌，那中年人忽然抬头看你：“兄台这手，是练过的。”"],"choices":[{"text":"“混口饭吃罢了。”——继续喝自己的酒","eff":{"hp":8,"karma":2,"note":"气血 +8"},"next":"free_roam"},{"text":"请他过来同坐，问他那把刀","eff":{"wuxing":6,"fame":3,"note":"悟性 +6 · 名望 +3"},"next":"daily_inn_talk"},{"text":"结账走人，不惹事","eff":{},"next":"free_roam"}]},"daily_inn_talk":{"title":"日常 · 刀上的旧账","art":"w_inn","text":["中年人姓何，原是个镖师。刀是二十年前的老刀，刀鞘上刻着一个“镇”字。","“镇远镖局，”他说，“倒了以后，我就没再押过镖。”","他喝了一口酒，忽然问你：“你说，人这一辈子，值不值得为一口饭把命押上？”","堂里很吵，跑堂的撞了一下他的椅子，他也没动。"],"choices":[{"text":"“值。人总得吃饭。”","eff":{"karma":4,"money":10,"note":"善恶 +4 · 银两 +10"},"next":"free_roam"},{"text":"“不值。命比饭贵。”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"free_roam"},{"text":"不说话，替他把酒满上","eff":{"karma":6,"fame":2,"note":"善恶 +6 · 名望 +2"},"next":"free_roam"}]},"daily_market":{"title":"日常 · 西市","art":"w_sc_market","text":["西市从辰时开到日落。卖布的、卖药的、卖刀的、卖艺的，挤在一条街上。","有个胡商在卖一种会发光的石头，说是从西域带回来的，夜里能照见鬼。","还有个卖艺的小姑娘在耍一条白蛇，围观的人往铜盘里扔钱。","你走过去的时候，小姑娘忽然抬头看了你一眼——那一眼不像一个孩子该有的。"],"choices":[{"text":"往铜盘里放两文钱","eff":{"money":-2,"karma":3,"note":"善恶 +3"},"next":"free_roam"},{"text":"买下那块会发光的石头","eff":{"money":-30,"wuxing":5,"note":"悟性 +5","items":["夜光石"]},"next":"free_roam"},{"text":"跟着那小姑娘，看她去哪儿","eff":{"wuxing":8,"note":"悟性 +8"},"next":"daily_girl"},{"text":"进赌坊玩两把","eff":{},"next":"daily_teahouse_gamble"}]},"daily_girl":{"title":"日常 · 白蛇","art":"w_sc_city_wall","text":["小姑娘收摊后往城南走，进了一条很窄的巷子。","巷子尽头是座塌了一半的土地庙，庙里坐着三个同样瘦小的孩子。","她把铜盘里的钱倒出来，一枚一枚数，然后分成四份。","“看什么看？”她抬头瞪你，“我们又不偷。”"],"choices":[{"text":"把钱袋里的一半给她","eff":{"money":-40,"karma":10,"note":"善恶 +10"},"next":"free_roam"},{"text":"问她那条白蛇是哪来的","eff":{"wuxing":6,"note":"悟性 +6"},"next":"free_roam"},{"text":"什么也不说，转身走了","eff":{},"next":"free_roam"}]},"daily_teahouse":{"title":"日常 · 茶馆听书","art":"w_sc_inn_room","text":["茶博士提着长嘴铜壶，隔着一丈远把水注进碗里，一滴不溅。","说书先生一拍醒木：“各位客官，今日讲的是——十七年前，雁门关那一场雪。”","满堂安静下来。你握着茶碗的手，停在了半空。","他说得绘声绘色，只是说到那场追杀时，把死的名字、活的名字，全说反了。"],"choices":[{"text":"起身，替他把那一夜说对","eff":{"fame":12,"karma":4,"note":"名望 +12 · 善恶 +4"},"next":"daily_tale"},{"text":"什么都不说，喝完茶走","eff":{"wuxing":4,"note":"悟性 +4"},"next":"free_roam"},{"text":"掷下银子，请他改个讲法","eff":{"money":-20,"fame":6,"note":"名望 +6"},"next":"daily_tale"}]},"daily_tale":{"title":"日常 · 说书人","art":"w_sc_inn_room","text":["散场后，说书先生请你到后台坐。","“客官对那段旧事这么熟，想必是知道内情的。”他给你倒了碗粗茶，“我讲书四十年，最怕的不是没人听，是讲错了，还讲得比真的像。”","他从箱底摸出一卷发黄的手抄：“这是我年轻时抄的，据说出自当年一个幸存者。”"],"choices":[{"text":"接过来看","eff":{"wuxing":12,"note":"悟性 +12","items":["说书旧抄"]},"next":"free_roam"},{"text":"告诉他：那个幸存者，就是我","eff":{"fame":10,"karma":6,"note":"名望 +10 · 善恶 +6"},"next":"free_roam"},{"text":"让他别再讲这段了","eff":{"karma":4,"note":"善恶 +4"},"next":"free_roam"}]},"daily_river":{"title":"日常 · 江边","art":"w_sc_river_dock","text":["江边的风比城里大。你脱了外袍，把剑横在膝上坐着。","水面上有渔船，船头的灯还没点。有个老人蹲在石头上钓鱼，钓了半天，篓子里还是空的。","“年轻人，”他开口，“你这一身杀气，钓不上鱼的。”","“我不钓鱼。”","“那你坐在这儿做什么？”"],"choices":[{"text":"“想点事情。”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"daily_river_talk"},{"text":"拔剑，在江边练一遍","eff":{"neili":6,"hp":-5,"note":"内力 +6 · 气血 -5"},"next":"free_roam"},{"text":"帮他把鱼篓提回去","eff":{"karma":6,"note":"善恶 +6"},"next":"free_roam"}]},"daily_river_talk":{"title":"日常 · 钓鱼人","art":"w_sc_river_dock","text":["老人收了竿，说他不钓鱼，钓的是一份清静。","“我年轻时也拿剑。后来发现，杀一个人容易，难的是第二天还敢看自己洗剑的水。”","他把鱼竿递给你：“试试。坐一个时辰，什么也别想。”","你在江边坐了一个时辰。什么也没想成，倒是风把脑子里那些东西吹散了些。"],"choices":[{"text":"谢过他","eff":{"wuxing":8,"karma":4,"note":"悟性 +8 · 善恶 +4"},"next":"free_roam"},{"text":"问他叫什么","eff":{"wuxing":4,"fame":2,"note":"悟性 +4 · 名望 +2"},"next":"free_roam"}]},"daily_temple":{"title":"日常 · 破庙","art":"w_sc_temple_night","text":["这座庙比你当年待过的那个还破。泥像塌了半边脸，香炉里积着雨水。","你在像前站了一会儿，没上香——你也不知道该求什么。","庙后头传来咳嗽声。一个老和尚坐在墙根下晒太阳，膝上摊着一本烂了角的经。","“施主，”他闭着眼说，“你不是来上香的。你是来问一件事的。”"],"choices":[{"text":"“我该不该继续查下去？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"daily_monk"},{"text":"往香炉里放一根香，什么也不说","eff":{"karma":5,"note":"善恶 +5"},"next":"free_roam"},{"text":"给他留点干粮","eff":{"money":-5,"karma":8,"note":"善恶 +8"},"next":"free_roam"}]},"daily_monk":{"title":"日常 · 老僧","art":"w_monk","text":["老和尚睁开眼，看了你很久。","“你要查的那件事，查清了，你就活不成了；查不清，你也活不好。”","他把经书合上：“所以别问该不该。问你想不想。”","“想清楚了，就去。想不清楚，也去。人这辈子，哪有想清楚了才动身的事。”"],"choices":[{"text":"给他磕个头","eff":{"karma":10,"wuxing":6,"note":"善恶 +10 · 悟性 +6"},"next":"free_roam"},{"text":"把身上最后一点钱留给他","eff":{"money":-20,"karma":12,"note":"善恶 +12"},"next":"free_roam"},{"text":"转身出庙，心里有了计较","eff":{"wuxing":8,"note":"悟性 +8"},"next":"free_roam"}]},"daily_rumor":{"title":"日常 · 街头消息","art":"w_sect_blood","text":["消息这东西，在酒肆里最便宜。","你花了几文钱，听来三件不相干的事：","其一，漕运上最近多了几条没旗号的船；其二，血刀门封了山；其三，有人在城外见过一个独眼的老人，见人就问“青玉坠”。","第三件让你把碗放下了。"],"choices":[{"text":"去城外找那个独眼老人","eff":{"wuxing":6,"note":"悟性 +6"},"next":"daily_oneeye"},{"text":"先查漕运上那些没旗号的船","eff":{"money":10,"note":"银两 +10"},"next":"free_roam"},{"text":"记在心里，回去睡一觉","eff":{"hp":10,"note":"气血 +10"},"next":"free_roam"}]},"daily_oneeye":{"title":"日常 · 独眼","art":"w_loc_changan","text":["城外的破驿站里，确实坐着一个独眼老人。","他看见你，先看的不是脸，是腰间。","“坠子呢？”他问。","“什么坠子？”","他盯了你很久，忽然笑了：“你父亲当年也是这么装傻的。”"],"choices":[{"text":"“你认识我父亲？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"daily_oneeye_talk"},{"text":"不理他，转身走","eff":{},"next":"free_roam"},{"text":"把剑按在桌上","eff":{"karma":-4,"fame":4,"note":"善恶 -4 · 名望 +4"},"next":"daily_oneeye_talk"}]},"daily_oneeye_talk":{"title":"日常 · 旧人","art":"w_snow_city","text":["老人从怀里摸出一块残破的布，上面是半个“雁”字。","“我是你父亲帐下的斥候。那一夜，我替他挡了三刀，丢了一只眼。”","“他没死在那里。”老人顿了顿，“他死在后头。死在自家人手里。”","他抬头看你：“所以你要查的，不该是六派。是朝廷。”"],"choices":[{"text":"“带我去见还活着的人。”","eff":{"fame":8,"wuxing":8,"note":"名望 +8 · 悟性 +8","flags":{"met_scout":true}},"next":"ch6_start"},{"text":"把这些记下来，日后再说","eff":{"wuxing":6,"note":"悟性 +6"},"next":"free_roam"},{"text":"给他一些银两","eff":{"money":-30,"karma":8,"note":"善恶 +8"},"next":"free_roam"}]},"daily_night":{"title":"长安 · 夜禁之前","art":"w_loc_changan","text":["戌时三刻，鼓声从朱雀门一路敲过来。","长安的夜禁是死的规矩：鼓声一停，坊门落锁，街上除了巡夜的武侯，谁走谁犯法。","你站在十字街口，看最后几个赶路的人小跑着往坊里钻。卖汤饼的摊子正在收，炉子里的炭还红着，摊主把最后一碗面推给了一个衣衫褴褛的老兵。","“不收钱了，”摊主说，“天冷。”","老兵捧着碗，没说话，只是把腰里的酒葫芦解下来，放在摊子上。","鼓声停了。街面一下子空了，只剩风卷着纸钱一样的雪，从这条街滚到那条街。"],"choices":[{"text":"找家客栈歇下","eff":{"hp":12,"money":-5,"note":"气血 +12 · 银两 -5"},"next":"daily_inn"},{"text":"翻墙去西市，看看夜里的市面","eff":{"wuxing":6,"note":"悟性 +6"},"next":"daily_nightmarket"},{"text":"沿着墙根，去看一眼当年的破庙","eff":{"karma":4,"wuxing":4,"note":"善恶 +4 · 悟性 +4"},"next":"daily_temple"}]},"daily_nightmarket":{"title":"长安 · 鬼市","art":"w_sc_market","text":["夜里的西市不叫西市，叫鬼市。","没有灯，没有招牌，买卖的人都不问来路。有人卖从坟里刨出来的玉，有人卖不知道从哪座宅子里顺出来的字画，也有人卖消息。","一个裹着斗篷的人拦住你，只露出一双眼睛：“要刀吗？好刀。杀过人的。”","你还没答话，旁边又有人低声道：“要命吗？也不要紧，价钱好说。”","鬼市里最贵的从来不是东西，是别人不想让人知道的事。"],"choices":[{"text":"买那把刀","eff":{"money":-80,"neili":6,"note":"银两 -80 · 内力 +6","items":["鬼市旧刀"]},"next":"free_roam"},{"text":"买一条消息","eff":{"money":-40,"wuxing":10,"note":"悟性 +10"},"next":"daily_rumor"},{"text":"什么也不买，看一圈就走","eff":{"wuxing":4,"note":"悟性 +4"},"next":"free_roam"}]},"daily_armory":{"title":"长安 · 铁匠铺","art":"w_sc_sect_hall","text":["铁匠铺的门脸不大，炉子却烧得很旺。","老铁匠赤着上身，胳膊上全是旧疤，抡锤的节奏稳得像更漏。他瞥了你一眼，又低头去敲。","“剑不好。”他忽然说。","“哪不好？”","“太干净。”他把锤子放下，拿过你的剑在手里掂了掂，“好剑该有缺口。没有缺口的剑，说明没真打过。”","他转身从架上取下一柄满是崩口的旧剑：“试试这个。它的主人死在雁门。”"],"choices":[{"text":"接过来，试一招","eff":{"neili":8,"hp":-5,"note":"内力 +8 · 气血 -5"},"next":"free_roam"},{"text":"请他给我的剑开个刃","eff":{"money":-40,"neili":4,"note":"银两 -40 · 内力 +4"},"next":"free_roam"},{"text":"问他那把剑的主人是谁","eff":{"wuxing":8,"note":"悟性 +8"},"next":"daily_armory_talk"}]},"daily_armory_talk":{"title":"长安 · 旧剑主人","art":"w_sc_city_wall","text":["老铁匠沉默了很久，才说：“姓沈。”","你手里的剑差点没握住。","“他是个瞎子，来我这儿打过三次剑。最后一次，他说他收了个徒弟，脾气倔，将来一定会来找我。”","老人抬头看你：“你就是那个徒弟吧。”","炉火噼啪响了一声。你忽然明白，师父那些年并不是什么都没做。"],"choices":[{"text":"“他在你这儿留了什么？”","eff":{"wuxing":10,"note":"悟性 +10","items":["沈氏遗物"]},"next":"free_roam"},{"text":"把剑留给他，让他修好","eff":{"money":-20,"neili":6,"note":"内力 +6"},"next":"free_roam"},{"text":"什么也不说，转身出去","eff":{"karma":4,"note":"善恶 +4"},"next":"free_roam"}]},"daily_temple_fair":{"title":"长安 · 庙会","art":"w_sc_court_hall","text":["十五这天，城东的寺庙开庙会。","香客从山门一直排到街口，卖糖人的、卖面具的、算命的、耍猴的，挤得走不动路。","大殿里香烟缭绕，功德箱前跪满了人。有人求子，有人求财，有人求平安。","你站在殿外，看见一个穿孝服的妇人，跪在最角落的位置，一遍一遍磕头，嘴里念着一个名字。","磕到第十七下，她站起来，把头上最后一支银钗摘下来，放进功德箱，走了。"],"choices":[{"text":"跟上去，问问她求的是谁","eff":{"wuxing":6,"note":"悟性 +6"},"next":"daily_widow"},{"text":"进殿上一炷香","eff":{"karma":5,"note":"善恶 +5"},"next":"free_roam"},{"text":"在庙会上买点吃的","eff":{"money":-3,"hp":8,"note":"气血 +8"},"next":"free_roam"}]},"daily_widow":{"title":"长安 · 孝服","art":"w_ruined_temple","text":["妇人走到庙后的放生池边，蹲下去洗手。","你隔着几步远站住，问她：“求的是谁？”","她抬头看你，眼睛是干的：“我男人。镇远镖局的。他们说他通匪。”","“你也信？”","她笑了一下，那个笑比哭难看：“我信不信有什么用。人已经吊在城门上三天了。”"],"choices":[{"text":"“我去把他放下来。”","eff":{"karma":12,"fame":6,"note":"善恶 +12 · 名望 +6","flags":{"promised_widow":true}},"next":"free_roam"},{"text":"给她一些银两","eff":{"money":-20,"karma":8,"note":"善恶 +8"},"next":"free_roam"},{"text":"什么也做不了，转身走开","eff":{"karma":-4,"note":"善恶 -4"},"next":"free_roam"}]},"daily_brothel":{"title":"长安 · 平康坊","art":"w_sc_inn_room","text":["平康坊的灯是整条街最亮的。","楼上的姑娘抱着琵琶，唱一支很旧的曲子，唱到“雁门关外雪如席”时，声音低了半拍。","老鸨笑着迎上来，你摆摆手，只要了一壶茶，坐在角落里听。","唱曲的姑娘唱完，从楼上下来，径直走到你桌前：“客官，这曲子，您听得懂？”"],"choices":[{"text":"“听不太懂，但好听。”","eff":{"fame":3,"hp":6,"note":"名望 +3 · 气血 +6"},"next":"free_roam"},{"text":"“雁门关那一段，你从哪学的？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"daily_singer"},{"text":"放下一锭银子就走","eff":{"money":-30,"karma":3,"note":"善恶 +3"},"next":"free_roam"}]},"daily_singer":{"title":"长安 · 曲子","art":"w_sc_inn_room","text":["姑娘姓柳，父亲是当年雁门关的一名文书。","“他死前给我娘写了一封信，”她说，“信上说，他不是逃兵。可那封信没有送到。”","她把手按在琵琶上：“这些年我一直想不通，为什么一封信能走丢。”","“信和人一样，”你说，“有人不想它送到。”"],"choices":[{"text":"“把信的事交给我。”","eff":{"karma":10,"fame":6,"note":"善恶 +10 · 名望 +6","flags":{"met_singer":true}},"next":"court_1"},{"text":"请她再唱一遍那支曲子","eff":{"wuxing":6,"hp":6,"note":"悟性 +6 · 气血 +6"},"next":"free_roam"},{"text":"什么也没说，起身离开","eff":{},"next":"free_roam"}]},"daily_sect":{"title":"门派 · 早课","art":"w_sc_sect_hall","text":["天还没亮，钟已经敲过三遍。","院子里站满了人，谁也不说话。晨风从山门那边灌进来，把衣角吹得猎猎响。","掌教站在阶上，闭着眼，一句一句念门下规矩：不得欺师，不得淫掠，不得以武犯禁，不得见死不救。","念到最后一条时，他睁开眼，看了你一眼：“最后这条，最难的。”","早课散后，师兄弟各自散去。有人去挑水，有人去劈柴，有人绕到后山去偷懒。"],"choices":[{"text":"跟着去挑水","eff":{"hp":8,"karma":6,"note":"气血 +8 · 善恶 +6"},"next":"free_roam"},{"text":"留在阶前，问掌教那句“最难的”是什么意思","eff":{"wuxing":10,"note":"悟性 +10"},"next":"daily_sect_talk"},{"text":"去后山练一套拳","eff":{"neili":6,"hp":-3,"note":"内力 +6"},"next":"free_roam"},{"text":"去演武场找师弟对练","eff":{},"next":"daily_sect_drill"}]},"daily_sect_talk":{"title":"门派 · 最难的一条","art":"w_sc_forest_path","text":["掌教没有直接回答。他让你跟着他绕到后山。","后山有一片乱葬岗，坟头大多没有碑。","“这些是三十年来，死在门规下的人。”他说，“有欺师的，有犯禁的。有的是真该杀，有的是被冤枉的。”","“门规是刀，握着它的人，得知道什么时候不下刀。”","他停了停：“这一条，我到现在也没学会。”"],"choices":[{"text":"“那要学到什么时候？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"free_roam"},{"text":"给那些无名的坟各添一把土","eff":{"karma":12,"note":"善恶 +12"},"next":"free_roam"},{"text":"沉默着离开","eff":{"wuxing":4,"note":"悟性 +4"},"next":"free_roam"}]},"daily_sect_drill":{"title":"门派 · 对练","art":"w_sc_sect_hall","text":["午后，演武场上对练。","对手是个比你小三岁的师弟，出手急，收势慢，三招之后破绽露得明明白白。","教习在场边喊：“点到为止！”","师弟红着脸，还是要再攻。他的剑在你肩前三寸停住——是你让了他半招。","他愣在那儿，忽然把剑扔了：“我不练了。反正怎么练都赢不了你。”"],"choices":[{"text":"“我赢你，是因为我多练了三年。”","eff":{"fame":4,"karma":4,"note":"名望 +4 · 善恶 +4"},"next":"free_roam"},{"text":"把刚才那半招拆给他看","eff":{"wuxing":8,"karma":6,"note":"悟性 +8 · 善恶 +6"},"next":"free_roam"},{"text":"不理他，收剑走了","eff":{"karma":-3,"note":"善恶 -3"},"next":"free_roam"}]},"daily_pawnshop":{"title":"市井 · 当铺","art":"w_sc_market","text":["当铺的柜台很高，高到要仰头才能看见里面的人。","掌柜是个精瘦的老头，眼睛只扫了一眼你手里的东西，就报了个价——低得离谱。","“死当还是活当？”","你还在犹豫，柜台后面忽然有人说话：“这东西，我出三倍。”","回头一看，是个穿绸衫的胖子，笑得一团和气。"],"choices":[{"text":"不理他，按原价当掉","eff":{"money":40,"note":"银两 +40"},"next":"free_roam"},{"text":"问他为什么出三倍","eff":{"wuxing":8,"note":"悟性 +8"},"next":"daily_pawn_talk"},{"text":"收回东西，转身就走","eff":{"wuxing":4,"karma":2,"note":"善恶 +2"},"next":"free_roam"}]},"daily_pawn_talk":{"title":"市井 · 绸衫","art":"w_loc_mangshan","text":["胖子的笑一直没变，只是眼神收了一下。","“这东西，是我家老爷丢的。”","“哦？什么时候丢的？”","“三天前。”","“可这件东西，我十年前就带在身上了。”","铺子里安静下来。胖子身后的两个家丁，慢慢往前挪了半步。"],"choices":[{"text":"把东西放回怀里，走出去","eff":{"wuxing":6,"fame":4,"note":"悟性 +6 · 名望 +4"},"next":"free_roam"},{"text":"把东西拍在柜台上：“那你家老爷，怕是认错了。”","eff":{"fame":8,"karma":-2,"note":"名望 +8 · 善恶 -2"},"next":"free_roam"},{"text":"动手","eff":{"karma":-8,"fame":6,"note":"善恶 -8 · 名望 +6"},"battle":{"name":"绸衫家丁","art":"w_villain","hp":70,"atk":14,"def":2,"fleeOk":true,"win":null,"lose":null,"reward":{"money":30}}}]},"daily_teahouse_gamble":{"title":"市井 · 赌坊","art":"w_sc_market","text":["赌坊的门帘是厚的，掀开时一股热气和汗味扑面而来。","骰子在碗里滚，声音脆得让人心慌。有人赢红了眼，有人输得只剩一身衣。","庄家抬头看了你一眼，笑着推过一副骰子：“客官，玩一把？”","你身上还有几两银子。"],"choices":[{"text":"押一把","eff":{"money":30,"note":"运气不错，银两 +30"},"next":"free_roam"},{"text":"小赌怡情，押一文","eff":{"money":1,"note":"银两 +1"},"next":"free_roam"},{"text":"不赌，站着看","eff":{"wuxing":6,"note":"悟性 +6"},"next":"free_roam"}]},"daily_clinic":{"title":"市井 · 药铺","art":"w_sc_market","text":["药铺里有一股很浓的苦味。","老大夫正在给一个孩子看伤，孩子腿上有一条很深的刀口，不像是摔的。","旁边站着的男人一直低着头，手上有茧，是握刀的手。","老大夫什么也没问，只是上药、包扎，最后收了十文钱。","“下次别这样了。”他说。","男人抱着孩子走了，走到门口，回身深深一揖。"],"choices":[{"text":"问大夫，为什么不多收些","eff":{"wuxing":6,"note":"悟性 +6"},"next":"daily_clinic_talk"},{"text":"帮他把药柜上的药材摆好","eff":{"karma":6,"hp":4,"note":"善恶 +6"},"next":"free_roam"},{"text":"买一副伤药带在身上","eff":{"money":-15,"hp":20,"note":"气血 +20","items":["金疮药"]},"next":"free_roam"}]},"daily_clinic_talk":{"title":"市井 · 十文钱","art":"w_sc_city_wall","text":["老大夫把药杵放下：“这城里，十文钱能买一碗面。”","“他要是付得起更多，就不会抱着孩子走三条街来找我。”","“我若多收，他下次就不来了。不来，孩子就烂一条腿。”","他说得很平，像在说今天的天气。","“医者这行，治的是病，也是穷。”"],"choices":[{"text":"“我学过一点毒理，能不能帮忙？”","eff":{"wuxing":10,"karma":6,"note":"悟性 +10 · 善恶 +6"},"next":"free_roam"},{"text":"留下一些银子","eff":{"money":-20,"karma":8,"note":"善恶 +8"},"next":"free_roam"},{"text":"谢过他，离开","eff":{},"next":"free_roam"}]},"ch6_start":{"title":"第六章 · 北行","art":"w_loc_yanmen","text":["从长安到雁门，要走二十七天。","出北门那日，天是灰的，风里带着沙。独眼老人走在前头，一条腿有些跛，走一步，肩就沉一下。他不要你扶，也不肯坐车。","“走惯了。”他说，“当年从雁门撤下来，也是这么走的。三千人出去，十七个人回来，还都是走回来的。”","一路上他不怎么说话，只在过驿站的时候，会盯着墙上的告示看很久。那些告示上写着通缉的名字，有的名字他认得，有的他不认得。","第十七天，你看见了第一座烽燧。它塌了一半，孤零零地立在黄土坡上，像一个没埋好的坟。","老人停下脚步，看了很久，忽然说：“到了。”"],"choices":[{"text":"“这里离关还有多远？”","eff":{"wuxing":4,"note":"悟性 +4"},"next":"ch6_pass"},{"text":"陪他在烽燧下坐一会儿","eff":{"karma":6,"hp":6,"note":"善恶 +6 · 气血 +6"},"next":"ch6_pass"},{"text":"问他：那十七个人，还剩几个","eff":{"wuxing":8,"note":"悟性 +8","flags":{"asked_survivors":true}},"next":"ch6_pass"}]},"ch6_pass":{"title":"第六章 · 雁门关","art":"w_sc_battlefield","text":["雁门关的关门只剩一扇。另一扇倒在雪里，断口已经锈成了黑色。","守关的兵换过三茬，如今这茬兵是朝廷新派的，见了你们，先把枪横过来。","“什么人？”","独眼老人从怀里摸出一块铜牌，牌上刻着一个“雁”字。那兵接过去看了看，脸色变了一下，把枪收了。","“你们是……守令营的？”他声音低下去，“营里还有活人？”","老人没答，只问：“关上的老营，还在么。”","“在。没人敢动。”"],"choices":[{"text":"问那兵：为什么没人敢动","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch6_pass_talk"},{"text":"在关门前站一会儿，看看那些弹痕","eff":{"karma":4,"wuxing":4,"note":"善恶 +4 · 悟性 +4"},"next":"ch6_camp"}]},"ch6_pass_talk":{"title":"第六章 · 守关人","art":"w_ruined_temple","text":["“动它的人，死过一个。”那兵压着声音说，“三年前，兵部派来一个主簿，说要清点旧营，进去当夜就没出来。”","“后来呢？”","“后来兵部又派了一个。那个学聪明了，只在门口站了半炷香，回去写了八个字：‘营中无物，不必再查。’”","兵说完，自己先打了个寒战，抬头看了看关楼。","“其实谁都知道，那营里不是没东西。是东西太沉，沉得人不敢碰。”"],"choices":[{"text":"“我去碰。”","eff":{"fame":8,"karma":4,"note":"名望 +8 · 善恶 +4"},"next":"ch6_camp"},{"text":"问他那主簿叫什么名字","eff":{"wuxing":6,"note":"悟性 +6","items":["主簿姓名"]},"next":"ch6_camp"},{"text":"沉默，跟着老人走","eff":{},"next":"ch6_camp"}]},"ch6_camp":{"title":"第六章 · 守令营","art":"w_loc_changan","text":["守令营在关西，一溜土坯房，塌的塌，空的空。","营门歪着，门楣上那块匾还在，字已经淡得快看不见了：守令。","里面是一排排的兵器架，架子上的枪没撤，枪头都朝下——这是当年撤营时的规矩，枪头朝下，表示“不打了”。","老人走到最里面那间屋子前，站住，没有推门。","“你父亲住这间。”他说，“门上那道刀痕，是他自己砍的。那天他说，等打赢了，就把门卸了烧火做饭。”"],"choices":[{"text":"推开门","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch6_room"},{"text":"先问老人：当年到底发生了什么","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch6_old_story"},{"text":"在营里走一圈，看那些枪","eff":{"karma":6,"hp":4,"note":"善恶 +6"},"next":"ch6_room"}]},"ch6_room":{"title":"第六章 · 父亲的屋子","art":"w_loc_luoyang","text":["屋里很干净，干净得不像没人住过十七年。","一张床，一张桌，一个旧木箱。桌上放着一只裂了的瓷碗，碗底还有半圈干涸的水痕。","木箱没锁。里面是几件旧衣、一封没有封口的信、一枚断了绳的铜钱，还有一张纸——纸上画着一份地图，图上一处被朱砂圈了起来，旁边写着两个字：","“别去。”","字是父亲的笔迹。和那半页残帛心法上的字，一模一样。"],"choices":[{"text":"打开那封信","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch6_letter"},{"text":"把地图收起来","eff":{"wuxing":6,"note":"悟性 +6","items":["雁门旧图"]},"next":"ch6_letter"},{"text":"什么都先不动，在床沿坐下","eff":{"hp":10,"karma":4,"note":"气血 +10 · 善恶 +4"},"next":"ch6_letter"}]},"ch6_letter":{"title":"第六章 · 未寄出的信","art":"w_loc_luoyan","text":["信纸很脆，展开时掉了一点纸屑。","“吾儿：见字如面。","若你看到这封信，为父多半已经不在了。莫要寻仇，也莫要问为什么——问了，你便也活不成了。","守令营三千人，不是在打仗，是在守一样东西。那东西不该落在任何一方手里，包括朝廷。","我把它藏了。藏在只有守令营的人才找得到的地方。","你若不想要这身本事，就把信烧了，去江南种地，娶个媳妇，好好活着。","你若想要，地图在你脚下。别去。”","信到这里断了。最后两个字写得很重，墨透了三层纸。"],"choices":[{"text":"把信折好，收进怀里","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6","items":["父亲遗信"]},"next":"ch6_old_story"},{"text":"把信烧了，照他说的去江南","eff":{"karma":10,"hp":10,"note":"善恶 +10 · 气血 +10","flags":{"burned_letter":true}},"next":"ch6_road"},{"text":"拿起地图，去找那个圈起来的地方","eff":{"wuxing":10,"hp":-10,"note":"悟性 +10 · 气血 -10"},"next":"ch6_cave"}]},"ch6_old_story":{"title":"第六章 · 十七人","art":"w_loc_yanmen","text":["老人在营门口坐下，从怀里摸出那只旧酒葫芦，喝了一口，递给你。","“那天夜里，朝廷的令到了。说守令营私藏军械，图谋不轨，着即缴械。”","“你父亲没交。他说，交了，雁门就空了。”","“天亮的时候，来的是六派和禁军。他们没打旗，也没喊话，进营就杀。我们三千人，一半是伤兵，一半是粮夫。真正能拔刀的，不到八百。”","老人喝了第二口酒：“你父亲把我推上马，说‘带人走’。我带到第十七个人的时候，回头看了一眼。”","“他还站着。”"],"choices":[{"text":"“那三千人的名字，还有么？”","eff":{"wuxing":8,"note":"悟性 +8","flags":{"want_names":true}},"next":"ch6_names"},{"text":"什么也不问，把酒葫芦接过来喝一口","eff":{"karma":8,"hp":8,"note":"善恶 +8 · 气血 +8"},"next":"ch6_cave"},{"text":"“六派的人，还认得你么？”","eff":{"fame":6,"wuxing":4,"note":"名望 +6 · 悟性 +4"},"next":"ch6_names"}]},"ch6_names":{"title":"第六章 · 石碑","art":"w_sc_grave","text":["营后有块石碑，一人多高，正面刻满了名字。","不是三千个——只有八百多个。老人说，剩下的两千多人，连名字都没来得及记，只记了个数。","你从头往下找，找到中间偏上的位置，看见父亲的名字，被凿掉了一半。凿痕很新，边缘还带着石屑。","“去年有人来过。”老人说，“凿完就走，一句话没留。”","你伸手摸了摸那道凿痕，石头是凉的。"],"choices":[{"text":"把凿痕里的石屑收起来","eff":{"wuxing":6,"note":"悟性 +6","items":["石碑石屑"]},"next":"ch6_ambush"},{"text":"在碑前跪下，磕三个头","eff":{"karma":12,"hp":6,"note":"善恶 +12 · 气血 +6"},"next":"ch6_ambush"},{"text":"问老人：是谁凿的","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch6_ambush"}]},"ch6_ambush":{"title":"第六章 · 关外夜袭","art":"w_sc_mountain_pass","text":["当夜，营外响起了马蹄。","不是守关的兵——守关的兵不会在夜里出关，更不会熄了火把。","老人把酒葫芦一扔，抄起一根断枪杆：“来了。”","你听见营门被人从外面撞了一下，土墙簌簌地掉灰。第二下，门闩裂了。"],"choices":[{"text":"顶上去，把门抵住","eff":{"hp":-20,"fame":10,"note":"气血 -20 · 名望 +10"},"battle":{"name":"关外夜骑","art":"w_villain","hp":120,"atk":20,"def":4,"fleeOk":false,"win":"ch6_after_night","lose":"ch6_wounded","reward":{"fame":12,"money":40}}},{"text":"从后墙翻出去，抄他们后路","eff":{"wuxing":8,"note":"悟性 +8"},"battle":{"name":"夜骑领队","art":"w_villain","hp":100,"atk":18,"def":3,"fleeOk":true,"win":"ch6_after_night","lose":"ch6_wounded","reward":{"fame":10,"neili":8}}},{"text":"护着老人先走","eff":{"karma":10,"hp":-10,"note":"善恶 +10 · 气血 -10"},"next":"ch6_wounded"}]},"ch6_after_night":{"title":"第六章 · 天亮","art":"w_sc_court_hall","text":["天亮的时候，营门口横着七个人。都是黑衣，腰上没有牌。","老人翻检了一遍，从其中一个腰间摸出一张对折的纸。纸上是调的兵符草样，盖的却不是兵部的印。","“是宫里的。”老人说。","你看着那枚印，忽然觉得这二十七天的路，全都走偏了。","这盘棋，从头到尾都不在江湖上。"],"choices":[{"text":"“我进京。”","eff":{"fame":12,"wuxing":8,"note":"名望 +12 · 悟性 +8"},"next":"court_1"},{"text":"“先把这张兵符送去六派，让他们看看。”","eff":{"wuxing":10,"karma":4,"note":"悟性 +10 · 善恶 +4","items":["宫中兵符"]},"next":"ch5_sect_war"},{"text":"把兵符烧了，陪老人把营里的人埋了","eff":{"karma":14,"hp":8,"note":"善恶 +14 · 气血 +8","flags":{"buried_camp":true}},"next":"ch6_road"}]},"ch6_wounded":{"title":"第六章 · 雪里","art":"w_sc_battlefield","text":["你醒来时躺在营后的雪地里，半边身子冻得没有知觉。","老人守在一旁，手里攥着那根断枪，枪尖上还挂着血。","“你昏了两个时辰。”他说，“他们没追进来。可能是怕营里的东西。”","你撑着坐起来，看见营门口的地上有许多凌乱的脚印，往关外的方向。"],"choices":[{"text":"“他们怕什么？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch6_cave"},{"text":"先把伤处理了再说","eff":{"hp":30,"money":-20,"note":"气血 +30 · 银两 -20"},"next":"ch6_road"},{"text":"咬牙站起来，继续查","eff":{"hp":-5,"fame":8,"note":"名望 +8"},"next":"ch6_cave"}]},"ch6_cave":{"title":"第六章 · 地图上的红圈","art":"w_loc_yanmen","text":["红圈在烽燧东边的一道山坳里。","那里看起来什么都没有，只有一棵半死的歪脖子树。老人说树底下有一口枯井，井壁上有暗门。","你顺着枯井下去，井底有一条向里挖的土道，越走越宽。墙上每隔几步就有一盏油灯，灯油居然还是新的。","土道尽头是一间石室。石室中间放着一只铁箱。","箱子没有锁，只是沉。沉得一个人抬不动。"],"choices":[{"text":"打开箱子","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch6_box"},{"text":"先看石室的墙","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch6_wall"},{"text":"把箱子原样放下，退出去","eff":{"karma":8,"wuxing":4,"note":"善恶 +8"},"next":"ch6_road"}]},"ch6_wall":{"title":"第六章 · 墙上的字","art":"w_loc_swordtomb","text":["石室的墙上刻满了字，一行一行，从地面一直刻到头顶。","那是三千个名字。刻得很浅，有些已经模糊，但每一个都还在。","在名字的最后，有一句话：“守令营三千人，非死于敌，死于令。”","你站在墙前，很久没有动。独眼老人在你身后，一直没出声。","“他们……都记着自己。”你听见自己的声音有点哑。"],"choices":[{"text":"把墙上的名字抄下来","eff":{"wuxing":12,"karma":6,"note":"悟性 +12 · 善恶 +6","items":["三千人名单"]},"next":"ch6_box"},{"text":"在墙前跪下","eff":{"karma":10,"hp":6,"note":"善恶 +10 · 气血 +6"},"next":"ch6_box"},{"text":"问老人：你名字也在上面么","eff":{"wuxing":6,"karma":4,"note":"悟性 +6 · 善恶 +4"},"next":"ch6_box"}]},"ch6_box":{"title":"第六章 · 玄阴令","art":"w_sc_mountain_pass","text":["箱子里没有金银，也没有兵器。","只有一块半尺长的铁牌，牌上刻着一个“令”字，背面是密密麻麻的边军番号。","还有一份名册——不是江湖上的名册，是边军的调令簿。哪一年、哪一营、多少人、调往哪里，一笔一笔，清清楚楚。","老人看着那块铁牌，忽然坐倒在地：“就为这个……三千人。”","你握着那块铁牌，它的分量比看起来重得多。"],"choices":[{"text":"收好，带回中原","eff":{"wuxing":8,"fame":6,"note":"悟性 +8 · 名望 +6","items":["玄阴令"]},"next":"ch6_road"},{"text":"就在这里，把铁牌砸了","eff":{"karma":12,"wuxing":6,"note":"善恶 +12 · 悟性 +6","flags":{"broke_token":true}},"next":"ch6_road"},{"text":"问老人：这东西该交给谁","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch6_road"}]},"ch6_road":{"title":"第六章 · 归途","art":"w_sc_battlefield","text":["回去的路比来时慢。雪化了，路泥了，马蹄陷得很深。","老人在半路上病倒，走了七天，在第七天夜里没了。","他没留什么话，只把那只酒葫芦塞给你，葫芦底刻着两个小字：不退。","你把他埋在路边的一处高坡上，能看见雁门关的地方。","然后你一个人往南走。走了很久，才开始想：接下来要做什么。"],"choices":[{"text":"回长安，把这件事从头理一遍","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch7_start"},{"text":"去洛阳，找那个说书人","eff":{"wuxing":8,"note":"悟性 +8"},"next":"daily_tale"},{"text":"找个地方，先睡一觉（日常）","eff":{"hp":20,"note":"气血 +20"},"next":"free_roam"}]},"ch7_start":{"title":"第七章 · 回京","art":"w_sc_inn_room","text":["回到长安是二月。城门口的积雪化成了泥，泥里混着去岁的落叶。","你在城门口被拦了一次。守门的兵翻了你的行囊，看见了那块玄阴令，脸色变了一变，却没有声张，只把行囊还给你，低声说：“往东走，别走朱雀大街。”","你往东走。东边是条小巷，巷口有个卖馄饨的摊子，热气腾腾。摊主抬头看你一眼：“回来了？”","你愣住。你不认识他。","“三年前你从这儿走的时候，也是这个天。”他把一碗馄饨推过来，“吃吧，不收钱。”"],"choices":[{"text":"坐下吃，顺便问他怎么认得你","eff":{"hp":10,"wuxing":6,"note":"气血 +10 · 悟性 +6"},"next":"ch7_inn2"},{"text":"不吃，直接往刑部去","eff":{"fame":4,"note":"名望 +4"},"next":"ch7_letters"},{"text":"把碗端起来，先看看四周有没有人跟着","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch7_inn2"}]},"ch7_talk":{"title":"第七章 · 馄饨摊","art":"w_sc_market","text":["“这条街上的人都认得你。”摊主一边包馄饨一边说，“你走的那年，城西的人都在传，说沈家的儿子没死。”","“谁传的？”","“一个瞎眼的药郎。”他抬头，“后来他也没再来过。”","你握着碗，手指有点发凉。师父来过长安。"],"choices":[{"text":"“他往哪边去了？”","eff":{"wuxing":8,"note":"悟性 +8","flags":{"know_master_came":true}},"next":"ch7_letters"},{"text":"“他还说了什么？”","eff":{"wuxing":6,"karma":4,"note":"悟性 +6 · 善恶 +4"},"next":"ch7_letters"}]},"ch7_police":{"title":"第七章 · 刑部","art":"w_loc_yanmen","text":["刑部的门槛很高，衙门口的鼓蒙着灰。","你把宫中兵符的拓本递上去，值班的主事看了一眼，手就抖了。他没敢收，只把你引到后堂，请出一位穿常服的老者。","“这东西你从哪得的？”老者问。","“雁门，守令营。”","堂里静了很久。老者把拓本折好，放进袖子：“你今日没来过刑部。记着这句话。”"],"choices":[{"text":"“记不住。我要一个说法。”","eff":{"fame":10,"karma":4,"note":"名望 +10 · 善恶 +4"},"next":"ch7_faction"},{"text":"“我可以不说，但你得告诉我，谁在护着他。”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch7_faction"},{"text":"起身告退，暗中查这个老者","eff":{"wuxing":8,"note":"悟性 +8","flags":{"tail_judge":true}},"next":"ch7_faction"}]},"ch7_faction":{"title":"第七章 · 三派","art":"w_sc_mountain_pass","text":["老者姓崔，任刑部左侍郎，管的是陈案。","“朝中如今分三派。”他在茶凉了之后才开口，“一派是清流，讲的是祖制，其实是想把兵权从宫里拿回来；一派是内廷，权阉当道，什么事都要经他们的手；还有一派是边将，雁门关那位总兵，手握八万边军。”","“这三派里，谁最怕这枚兵符？”","“内廷。”崔侍郎说，“因为那枚兵符，能绕过他们调兵。”","他顿了顿：“也可能不止内廷。”"],"choices":[{"text":"“那清流呢？他们怕不怕？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch7_clean"},{"text":"“内廷里，谁管兵符？”","eff":{"wuxing":8,"note":"悟性 +8","flags":{"know_eunuch":true}},"next":"ch7_eunuch2"},{"text":"“我要见边将。”","eff":{"fame":8,"note":"名望 +8"},"next":"ch7_general_camp"}]},"ch7_clean":{"title":"第七章 · 清流","art":"w_sc_battlefield","text":["清流的头儿是御史中丞韩肃，一个瘦得像竹竿的老人，见人先笑，笑起来牙是黄的。","“你要翻雁门的案子？”他笑，“翻了，对你有好处么？”","“对我没好处。可那三千个人得有个说法。”","韩肃的笑收了一半：“说法这东西，是活人给的。死人要不了。”","“所以你们不打算给。”","“我们打算给，但要等。”他伸出一根手指，“等到内廷倒了，说法自然就有了。”"],"choices":[{"text":"“等多久？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch7_clean_room"},{"text":"“死人不该等。”——起身就走","eff":{"fame":8,"karma":6,"note":"名望 +8 · 善恶 +6"},"next":"ch7_eunuch"},{"text":"答应合作，但要他先给一样东西","eff":{"wuxing":6,"money":60,"note":"银两 +60","items":["韩府名帖"]},"next":"ch7_choice"}]},"ch7_eunuch":{"title":"第七章 · 内廷","art":"w_loc_yanmen","text":["管兵符的太监姓梁，人称梁公公，五十来岁，皮肉白得不像活人。","他在宫墙下的一间直房里见你，屋里摆着一尊铜炉，炉里烧的是龙涎香，浓得人喉咙发涩。","“你要查雁门？”他慢慢地说，“查了十七年了，还没查够？”","“不够。”","梁公公笑了，笑声像指甲刮过瓷面：“好。那我告诉你一件事——那夜下旨的不是咱家。旨是御笔，印是兵部，送旨的是六派。”","“咱家只是，没拦。”"],"choices":[{"text":"“为什么没拦？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch7_choice"},{"text":"“那现在呢？你拦不拦？”","eff":{"fame":10,"note":"名望 +10"},"next":"ch7_choice"},{"text":"把玄阴令放在他面前","eff":{"wuxing":6,"karma":-4,"note":"善恶 -4"},"next":"ch7_offer"}]},"ch7_offer":{"title":"第七章 · 交换","art":"w_bamboo_hut","text":["梁公公盯着那块铁牌，眼睛第一次有了光。","“这东西给咱家，你要什么？”","“我要那三千人的名字，进正史。”","他嘶了一声，像是牙疼：“正史是翰林院写的，不是咱家写的。”","“你能让他们写。”","他沉默了很久，终于把铁牌推回来：“咱家不做这个买卖。这牌子邪性，谁拿了谁死。”"],"choices":[{"text":"把铁牌收回来","eff":{"karma":4,"wuxing":6,"note":"善恶 +4 · 悟性 +6"},"next":"ch7_choice"},{"text":"“那你帮我个别的忙。”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch7_general"},{"text":"“你怕它。”——盯着他看","eff":{"fame":6,"wuxing":8,"note":"名望 +6 · 悟性 +8"},"next":"ch7_choice"}]},"ch7_general":{"title":"第七章 · 边将","art":"w_sc_mountain_pass","text":["边将不在京城，在城外的军营里。你等了六天，才等到他回京述职。","总兵姓顾，四十来岁，脸被风沙磨得像块旧皮子。他见你，第一句话是：“你父亲的刀，我给他收着。”","他让人把刀拿来。刀鞘裂了，刀身上有一道深痕。","“那年我在雁门，是个千总。”他说，“我看着他一个人挡在营门口，挡了半个时辰。”","“我为什么不上去？”他自己答了，“因为他说，走，把人带走。我走了。”"],"choices":[{"text":"“那三千人，你记得多少名字？”","eff":{"wuxing":8,"note":"悟性 +8","flags":{"asked_general_names":true}},"next":"ch7_general_talk"},{"text":"把刀接过来","eff":{"fame":6,"neili":6,"note":"名望 +6 · 内力 +6","items":["父亲的刀"]},"next":"ch7_choice"},{"text":"告诉他：玄阴令在你手里","eff":{"wuxing":6,"karma":-2,"note":"善恶 -2","flags":{"told_general":true}},"next":"ch7_general_offer"}]},"ch7_general_talk":{"title":"第七章 · 刀与名","art":"w_sc_battlefield","text":["顾总兵从怀里摸出一卷手抄，纸边都烂了。","“八百一十二个名字，我记了十七年。”他说，“剩下的两千多人，我只记得他们是从哪几个县来的。”","他把手抄递给你：“你在雁门石碑上也抄了？那加上这份，能凑齐一千多人。”","“不够。”","“不够。”他承认，“但总比没有强。”"],"choices":[{"text":"把两份名单合在一起","eff":{"wuxing":10,"karma":8,"note":"悟性 +10 · 善恶 +8","items":["一千一百人名单"]},"next":"ch7_choice"},{"text":"“剩下的人，我一个个去问。”","eff":{"fame":10,"wuxing":6,"note":"名望 +10 · 悟性 +6"},"next":"ch7_choice"}]},"ch7_general_offer":{"title":"第七章 · 交易","art":"w_loc_yanmen","text":["顾总兵听完，很久没说话。","“你知道这东西能干什么。”他说，“八万边军，认令不认人。拿着它，我能进京。”","“然后呢？”","“然后这天下就换个人坐。”他盯着你，“你要不要？”","帐外的风卷着军旗响。你忽然明白，来的路上想的每一件事，都不如这一句重。"],"choices":[{"text":"“不要。它不是用来换皇帝的。”","eff":{"karma":14,"fame":10,"note":"善恶 +14 · 名望 +10"},"next":"ch7_choice"},{"text":"“要。但进京之后，先给三千人立碑。”","eff":{"fame":16,"karma":4,"note":"名望 +16 · 善恶 +4","flags":{"allied_general":true}},"next":"ch7_choice"},{"text":"把铁牌收回，转身出帐","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch7_choice"}]},"ch7_choice":{"title":"第七章 · 棋局","art":"w_inn","text":["回到城里，天色已经暗了。","你在客栈的窗前坐了一夜。桌上有三样东西：一块玄阴令，一卷名单，一封没写完的信。","窗外传来更鼓。三更了。","你忽然想起父亲信里那两个字——“别去”。他还是去了。","你也一样。"],"choices":[{"text":"把名单交给清流，把兵符交给边将，自己退出这场局","eff":{"karma":12,"wuxing":8,"note":"善恶 +12 · 悟性 +8"},"next":"ch8_start"},{"text":"谁都不给。自己拿着，等一个更好的时机","eff":{"wuxing":10,"fame":6,"note":"悟性 +10 · 名望 +6"},"next":"ch8_start"},{"text":"先去一趟血刀门，把六派那条线补上","eff":{"fame":6,"note":"名望 +6"},"next":"ch8_start"}]},"ch8_start":{"title":"第八章 · 黑崖","art":"w_sc_cliff","text":["血刀门在黑崖上。崖不高，但极陡，只有一条凿出来的石阶，窄得两人不能并行。","你上山的时候，正碰上门里在办丧事。白幡从山门一直挂到崖底，风一吹，整片崖都是纸响。","接你的人是个瘸腿的老仆：“门主死了。三日前，死在练功房里，刀插在自己心口。”","“自杀？”","老仆没答，只把白布掀开一角。死者的手是攥着的，指甲里嵌着木屑——那不是握刀的手势，是抓地的手势。"],"choices":[{"text":"“带我去练功房。”","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch8_gate"},{"text":"“门里现在谁做主？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch8_gate"},{"text":"先在灵前上炷香","eff":{"karma":6,"note":"善恶 +6"},"next":"ch8_gate"}]},"ch8_who":{"title":"第八章 · 二门主","art":"w_bamboo_hut","text":["“二门主袁九刀做主。”老仆压低声音，“门主一死，他就把门里的账、库、刀谱全接了。”","“门主有子女么？”","“有个女儿，叫袁——”老仆顿住，改了口，“叫殷小满。是门主捡回来的，从母姓。”","“她在哪？”","“被关在后山。二门主说她与外人有私，坏了门规。”"],"choices":[{"text":"“先带我去见她。”","eff":{"wuxing":8,"karma":4,"note":"悟性 +8 · 善恶 +4"},"next":"ch8_daughter"},{"text":"先去练功房看现场","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch8_room"},{"text":"去会会二门主","eff":{"fame":6,"note":"名望 +6"},"next":"ch8_yuan"}]},"ch8_room":{"title":"第八章 · 练功房","art":"w_villain","text":["练功房里还留着血味。地上的血被擦过，但砖缝里渗进去的擦不掉。","刀插在墙上的刀架上，刀尖朝下，深进木头三寸。如果人真是自己捅自己，刀该在地上。","墙边有一块地板颜色略新，敲上去是空的。","你蹲下去，用刀鞘把它撬开。下面是一个尺方的暗格，里面只剩一层绒布——原本放着的东西，被人拿走了。"],"choices":[{"text":"把暗格的样子记下来","eff":{"wuxing":8,"note":"悟性 +8","flags":{"saw_hollow":true}},"next":"ch8_daughter"},{"text":"问老仆：暗格里原本放什么","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch8_blade_room"},{"text":"去质问二门主","eff":{"fame":8,"hp":-5,"note":"名望 +8"},"next":"ch8_yuan"}]},"ch8_daughter":{"title":"第八章 · 殷小满","art":"w_sc_battlefield","text":["后山的小屋没有窗，门是从外面锁的。","门开了，里头坐着一个二十出头的姑娘，一身孝服，脸上没有表情。她的手腕上有勒痕，是被绑过的。","“你是来杀我的，还是来问我爹怎么死的？”她先开口。","“我是来看看，你爹到底想告诉谁什么。”","她盯了你很久，忽然笑了，那个笑很难看：“他死前最后一句话是：去找拿剑的人。”"],"choices":[{"text":"“什么剑？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch8_sword"},{"text":"“那暗格里的东西，你知道么？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch8_daughter_past"},{"text":"先把她的绑松了","eff":{"karma":8,"note":"善恶 +8"},"next":"ch8_sword"}]},"ch8_sword":{"title":"第八章 · 那把剑","art":"w_sc_city_wall","text":["“我爹有一把旧剑，不是我门的刀。”殷小满说，“他从京城带回来的，说是别人托他保管。”","“谁的？”","“他没说。只说，等有人拿着一把有崩口的剑来找，就把剑还给他。”","你解下自己的剑，递过去。剑身上有缺口，是那年练剑时磕的。","她看了一眼，忽然捂住嘴。"],"choices":[{"text":"“你父亲的剑呢？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch8_truth"},{"text":"“我认识你父亲的剑——那是沈瞎子的。”","eff":{"wuxing":10,"karma":4,"note":"悟性 +10 · 善恶 +4"},"next":"ch8_truth"}]},"ch8_yuan":{"title":"第八章 · 二门主","art":"w_sect_blood","text":["二门主袁九刀在正堂等你。他个子不高，肩膀很宽，坐在门主的位置上，像穿了件不合身的衣裳。","“你是来吊丧的，还是来查案的？”","“都算。”","他笑了：“查案要凭证。血刀门不讲凭证，讲刀。”","堂下的弟子把手按在了刀柄上。"],"choices":[{"text":"“那就讲刀。”","eff":{"fame":8,"hp":-10,"note":"名望 +8 · 气血 -10"},"battle":{"name":"袁九刀","art":"w_villain","hp":160,"atk":22,"def":5,"fleeOk":true,"win":"ch8_after_fight","lose":"ch8_lose","reward":{"fame":20,"money":60}}},{"text":"把暗格的木板扔到他面前","eff":{"wuxing":10,"fame":4,"note":"悟性 +10"},"next":"ch8_truth"},{"text":"“我不查你。我只想知道，东西卖给了谁。”","eff":{"wuxing":8,"karma":-2,"note":"悟性 +8"},"next":"ch8_truth"}]},"ch8_after_fight":{"title":"第八章 · 血","art":"w_villain","text":["袁九刀输了半招。","他靠在门主的椅子上喘，血从嘴角淌下来，还在笑：“你以为杀了我，门就干净了？”","“我没想杀你。”","“那你更蠢。”他咳了一声，“门里有一半人，早就是朝廷的人了。门主办的这门，早就不是江湖的门。”","他从怀里摸出一张纸条，扔在你脚下：“拿去吧。反正我也活不过今晚。”"],"choices":[{"text":"拾起纸条","eff":{"wuxing":10,"note":"悟性 +10","items":["朝廷密条"]},"next":"ch8_truth"},{"text":"“谁要杀你？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch8_truth"},{"text":"让人把他抬去治伤","eff":{"karma":10,"note":"善恶 +10"},"next":"ch8_truth"}]},"ch8_lose":{"title":"第八章 · 败在门里","art":"w_sc_prison","text":["你被刀背抽中后颈，醒来时在一间柴房里。","殷小满也在，缩在角落里。她看见你睁眼，小声说：“他们今晚就要处置我。”","“为什么？”","“因为我爹留下的东西，只有我知道在哪。”"],"choices":[{"text":"“那就先出去。”","eff":{"hp":-10,"fame":6,"note":"名望 +6"},"battle":{"name":"守门弟子","art":"w_villain","hp":80,"atk":15,"def":2,"fleeOk":true,"win":"ch8_escape","lose":"ch8_escape","reward":{}}},{"text":"“东西在哪？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch8_truth"}]},"ch8_escape":{"title":"第八章 · 后山","art":"w_sc_temple_night","text":["你们从柴房的后窗翻出去，顺着崖壁的一条窄缝往下走。","殷小满在前面带路，走得比你还稳。她一边走一边说：“我爹说，这山他留了三条退路，一条给门里，一条给自己，一条给我。”","“他早知道会有这一天。”","“他早知道。”"],"choices":[{"text":"“那第三条路通向哪？”","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch8_truth"},{"text":"一路无话，先下山","eff":{"hp":10,"note":"气血 +10"},"next":"ch8_truth"}]},"ch8_truth":{"title":"第八章 · 门主的遗物","art":"w_sc_cliff","text":["崖底有一间石屋，屋里只有一只铁匣。","匣中是一卷账册，记着十几年间血刀门替朝廷办过的事：截杀、灭口、护送、运私。每一笔后面都盖着同一个印——不是兵部，不是内廷，是“宗正寺”。","“宗正寺管皇族的事。”殷小满说，“我爹说，这卷东西能给三千个人翻案。”","你翻到最后一页，看见一行小字：雁门，守令营，三千人，令出宗正，兵出六派。"],"choices":[{"text":"把账册收好","eff":{"wuxing":10,"fame":8,"note":"悟性 +10 · 名望 +8","items":["血刀门账册"]},"next":"ch8_after"},{"text":"“宗正寺，谁在主事？”","eff":{"wuxing":8,"note":"悟性 +8","flags":{"know_zongzheng":true}},"next":"ch8_after"},{"text":"把账册交给殷小满保管","eff":{"karma":8,"note":"善恶 +8"},"next":"ch8_after"}]},"ch9_start":{"title":"第九章 · 旧教","art":"w_sect_blood","text":["血刀门的事传出去之后，江湖上有人在找你。","不是来杀你的——是来认你的。","第一个找上门的，是个卖灯的老婆子。她在你住的客栈门口摆了三夜摊，第四夜才开口：“你腰间那块铁，给我看看。”","“你是谁？”","“玄阴教，外堂，掌灯。”她说，“教里有规矩：见令如见教主。”"],"choices":[{"text":"把玄阴令拿给她看","eff":{"wuxing":8,"note":"悟性 +8","flags":{"met_cult":true}},"next":"ch9_lamps"},{"text":"“我不认这个教。”","eff":{"karma":4,"fame":4,"note":"善恶 +4 · 名望 +4"},"next":"ch9_lamps"},{"text":"问她：教里还有多少人","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch9_lamps"}]},"ch9_lamp":{"title":"第九章 · 掌灯人","art":"w_villain","text":["老婆子把铁牌捧在手里，捧了很久，像捧着一块热炭。","“教主走的时候，教里剩七百多人。如今散的散，死的死，还认这块牌子的，不到四十个。”","“他们想做什么？”","“不想做什么。”她把牌子还给你，“只是想知道，教主的话还算不算数。”","“他说过什么？”","“他说，教里不许再杀人。”"],"choices":[{"text":"“那就还作数。”","eff":{"karma":12,"fame":8,"note":"善恶 +12 · 名望 +8","flags":{"cult_promise":true}},"next":"ch9_crowd"},{"text":"“我要见他。”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch9_crowd"},{"text":"“四十个人，能做什么？”","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch9_crowd"}]},"ch9_meet":{"title":"第九章 · 四十人","art":"w_loc_changan","text":["四十个人在城外的废窑里等着。有卖菜的、有抬轿的、有教书的，没有一个像江湖人。","见面时他们不跪，只默默地看着你。","一个瘸腿的汉子先开口：“教主的令，我们认。但有一件事得问清楚——你是教主的什么人？”","你说不出话。这个问题，你自己也没想明白。"],"choices":[{"text":"“我是他侄儿。”","eff":{"fame":10,"wuxing":6,"note":"名望 +10 · 悟性 +6","flags":{"claimed_kin":true}},"next":"ch9_uncle"},{"text":"“我不知道。但我认这块牌子。”","eff":{"karma":8,"wuxing":8,"note":"善恶 +8 · 悟性 +8"},"next":"ch9_uncle"},{"text":"把牌子放在地上：“认牌不认人。”","eff":{"fame":8,"wuxing":6,"note":"名望 +8 · 悟性 +6"},"next":"ch9_uncle"}]},"ch9_uncle":{"title":"第九章 · 叔父","art":"w_sc_city_wall","text":["瘸腿汉子领你去见一个人。","在城西一条极安静的巷子里，有个院子，院里种着一株枯了的石榴树。树下坐着一个人，背对着门，正在削一根木棍。","“阿兄的儿子。”他说，没有回头，“你比我预想的，晚了三年。”","你这才看见，他的左手是空的。"],"choices":[{"text":"“你为什么不见我？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch9_room"},{"text":"“我父亲，是不是你害的？”","eff":{"fame":6,"karma":-2,"note":"名望 +6 · 善恶 -2"},"next":"ch9_talk"},{"text":"在院子门口站住，不进","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch9_room"}]},"ch9_talk":{"title":"第九章 · 削木棍的人","art":"w_sc_mountain_pass","text":["“那夜我在教里，不在雁门。”叔父把木棍放下，“等我赶到，营已经烧了。”","“你手上那半页残帛心法，是我从火里抢出来的。”","“为什么给我？”","“因为你是他儿子。”他抬起眼，“也因为——这世上只剩你能把这桩事查下去。”","他把削好的木棍递给你：棍上刻着两个名字，一个是你父亲，一个是他自己。"],"choices":[{"text":"“那玄阴令到底有什么用？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch9_token"},{"text":"“我要你亲口说：三千人是为什么死的。”","eff":{"fame":8,"karma":6,"note":"名望 +8 · 善恶 +6"},"next":"ch9_token"},{"text":"接过木棍，什么也不说","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6","items":["刻名木棍"]},"next":"ch9_token"}]},"ch9_token":{"title":"第九章 · 令的用处","art":"w_loc_yanmen","text":["“玄阴令不是用来调兵的。”叔父说，“是用来证明，兵是可以被绕过的。”","“朝廷怕的不是兵变，是有人知道边军能不听他们的。”","“所以那三千人，不是因为守不住关，是因为他们守住了。”","他咳嗽起来，咳完接着说：“你现在拿着它，就等于把这件事又捅开了一次。接下来会有人来杀你，也会有更多的人来认你。”"],"choices":[{"text":"“那就让他们来。”","eff":{"fame":14,"hp":-5,"note":"名望 +14"},"next":"ch9_memorial"},{"text":"“我要一个能护住这四十个人的法子。”","eff":{"wuxing":10,"karma":8,"note":"悟性 +10 · 善恶 +8"},"next":"ch10_start"},{"text":"把玄阴令交给叔父保管","eff":{"karma":10,"wuxing":6,"note":"善恶 +10 · 悟性 +6"},"next":"ch10_start"}]},"ch10_start":{"title":"第十章 · 漕运","art":"w_loc_luoyang","text":["洛阳的漕运，一年能过四百万石粮。","谁管着漕运，谁就管着半个天下的饭碗。今年春天，管漕运的那位漕运使死了，死在任上，死得不明不白。","你到下邳的时候，码头已经停了七天——没有官印，船不敢动；船不动，粮就烂在舱里。","码头上挤着上千个扛活的脚夫，一个个蹲在太阳底下，谁也不说话。"],"choices":[{"text":"去看漕运使的尸首","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch10_dock"},{"text":"先找码头的把头聊聊","eff":{"fame":4,"money":10,"note":"银两 +10"},"next":"ch10_dock"},{"text":"去商会问问谁在等这个位置","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch10_fan"}]},"ch10_body":{"title":"第十章 · 尸首","art":"w_sc_river_dock","text":["漕运使姓周，五十来岁，是淹死的——至少仵作是这么写的。","可他的指甲缝里没有河泥，鞋底是干的。","“他不会水？”你问。","“会。”管事低声说，“他在这条河上跑了二十年。”","尸首的衣襟里缝着一小块油纸，纸上是一列船号，最后一个船号被划掉了。"],"choices":[{"text":"去查这个船号","eff":{"wuxing":8,"note":"悟性 +8","items":["船号纸"]},"next":"ch10_boat"},{"text":"问管事：他最近得罪了谁","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch10_corpse2"},{"text":"什么都不说，先把他好好安葬","eff":{"karma":10,"money":-20,"note":"善恶 +10 · 银两 -20"},"next":"ch10_boss"}]},"ch10_boss":{"title":"第十章 · 把头","art":"w_loc_luoyang","text":["码头的把头姓陈，一手能拎起两袋米，脸上刀疤从左眉拉到下巴。","“官家的事，我们不懂。”他蹲在跳板上，“我们只管扛活。船不动，我们就没饭吃。”","“船为什么不动？”","“没印。”他把烟锅在鞋底磕了磕，“印在新来的那位手里。他要我们先把旧账清了，才给印。”","“什么旧账？”","“漕运使欠他三万石粮。”"],"choices":[{"text":"“这三万石，是不是他私吞的？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch10_guild"},{"text":"“我替他们把这三万石补上。”","eff":{"money":-100,"fame":12,"karma":8,"note":"名望 +12 · 善恶 +8"},"next":"ch10_boat"},{"text":"“新来的那位是谁？”","eff":{"wuxing":6,"note":"悟性 +6","flags":{"know_successor":true}},"next":"ch10_guild"}]},"ch10_guild":{"title":"第十章 · 商会","art":"w_sc_river_dock","text":["洛阳商会的会首是个笑面人，姓范，见谁都先递茶。","“漕运使这个位子，谁坐都一样。”他说，“只要他明白，漕运不是官家的，是大家的。”","“大家的？”","“船是谁的？粮是谁的？扛活的人是谁的？”他反问，“官家不过盖个印。印可以换，船换不了。”","他把茶推到你面前：“所以我不在乎谁来。我在乎的是，他会不会动我们的船。”"],"choices":[{"text":"“如果我要动呢？”","eff":{"fame":10,"karma":-4,"note":"名望 +10 · 善恶 -4"},"next":"ch10_river"},{"text":"“我只想查清楚一个人的死。”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch10_river"},{"text":"“你们的船，最近少了三条。”","eff":{"wuxing":12,"note":"悟性 +12","flags":{"know_three_boats":true}},"next":"ch10_river"}]},"ch10_boat":{"title":"第十章 · 无旗船","art":"w_loc_luoyang","text":["船号指向下邳下游的一处河湾。","夜里你划了条小船过去，看见三条大船泊在那里，船上没有旗，船头挂着灯，灯罩是黑的。","有人在往船上搬箱子。箱子很沉，两个人抬一个，落地时扬起的不是米糠，是铁锈味。","河风一吹，你听见箱子里有东西在响——不是谷物，是甲片的碰撞声。"],"choices":[{"text":"摸上船去看看","eff":{"wuxing":10,"hp":-10,"note":"悟性 +10 · 气血 -10"},"next":"ch10_ship_detail"},{"text":"记下船的样子，回去报官","eff":{"fame":6,"note":"名望 +6"},"next":"ch10_after2"},{"text":"放火烧了这几条船","eff":{"fame":12,"karma":-8,"hp":-15,"note":"名望 +12 · 善恶 -8","battle":{"name":"私运甲士","art":"w_villain","hp":140,"atk":21,"def":5,"fleeOk":true,"win":"ch10_after","lose":"ch10_after","reward":{"fame":15,"money":80}}},"next":"ch10_after"}]},"ch10_ship":{"title":"第十章 · 甲","art":"w_sc_mountain_pass","text":["舱里堆着两百多副甲。","不是边军的制式甲——甲片薄，样式新，领口处绣着一个记号：宗正寺的三足乌。","你在最里头的箱子上看见一封文书，封皮上写着“雁门旧部，就地安置”。","你忽然明白了：这船甲，是给雁门那些“安置”下来的老兵准备的。","有人要把那三千个死了的人，变成三千个活着的人。"],"choices":[{"text":"把文书带走","eff":{"wuxing":10,"fame":8,"note":"悟性 +10 · 名望 +8","items":["宗正寺文书"]},"next":"ch10_after2"},{"text":"把整船甲烧掉","eff":{"karma":8,"fame":6,"note":"善恶 +8 · 名望 +6","flags":{"burned_armor":true}},"next":"ch10_after2"},{"text":"什么也不动，退出去","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch10_after"}]},"ch10_after":{"title":"第十章 · 印","art":"w_sc_river_dock","text":["第二天，新漕运使到任，带着官印和三百兵。","码头上的人都去看。他站在跳板上念了半篇告示，无非是安民、复工、旧账一笔勾销。","念到一半，人群里有人喊了一句：“那漕运使怎么死的？”","念告示的人顿了一下，然后接着往下念。","船动了。粮卸了。码头上又吵起来。这城像是从来没死过人。"],"choices":[{"text":"留下来看看这批粮运去哪","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch11_start"},{"text":"带着文书回京","eff":{"fame":10,"note":"名望 +10"},"next":"ch11_start"},{"text":"什么也不做，先睡一觉","eff":{"hp":20,"note":"气血 +20"},"next":"free_roam"}]},"ch11_start":{"title":"第十一章 · 嵩山会盟","art":"w_sect_shaolin","text":["名册的事传开之后，六派坐不住了。","他们在嵩山开了一次会盟。到会的有五派掌门，第六派——那个当年下令放火的——没有来，只派了个弟子送来一封信。","信上只有一句话：“事已至此，各自珍重。”","少林的老方丈把信看完，放在桌上，谁也没说话。","堂外的风把檐角的铁马吹得叮当作响。"],"choices":[{"text":"“当年那一夜，诸位都在场么？”","eff":{"fame":8,"wuxing":6,"note":"名望 +8 · 悟性 +6"},"next":"ch11_admit"},{"text":"不开口，先听他们说","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch11_admit"},{"text":"把血刀门的账册放在桌上","eff":{"fame":10,"wuxing":4,"note":"名望 +10 · 悟性 +4"},"next":"ch11_admit"}]},"ch11_admit":{"title":"第十一章 · 认不认","art":"w_monk","text":["武当的掌教先开口：“认。”","“那一夜我们收了朝廷的令，以为是平叛。到了营里，看见的是伤兵和粮夫。可令已经接了，刀已经拔了。”","峨眉的师太闭着眼：“我派去了四十人，回来三十一个。那九个人，是死在自己人手底下的——有人不肯再杀，被同门按住了。”","少林方丈念了一声佛号。","“所以，”你问，“你们打算怎么办？”"],"choices":[{"text":"“把当年的事写下来，昭告天下。”","eff":{"fame":14,"wuxing":6,"note":"名望 +14 · 悟性 +6"},"next":"ch11_split"},{"text":"“只写下来不够。去雁门，给三千人磕头。”","eff":{"fame":10,"karma":12,"note":"名望 +10 · 善恶 +12"},"next":"ch11_split"},{"text":"“我给诸位一条路：自己认，别等人来掀。”","eff":{"wuxing":10,"fame":8,"note":"悟性 +10 · 名望 +8"},"next":"ch11_split"}]},"ch11_split":{"title":"第十一章 · 裂","art":"w_sect_shaolin","text":["会盟开到第三天，第六派的人来了。","不是掌门，是一百多个弟子，个个带着刀。为首的是个四十来岁的汉子，进门就说：“我师父说，六派的事，由六派自己了断。外人插手，就是与六派为敌。”","堂上一下子静了。","“你们要打？”少林方丈问。","“不打。”那汉子笑，“只是从今天起，六派不再是一派。”","他转身就走，走到门口，回头看了你一眼。"],"choices":[{"text":"“站住。”","eff":{"fame":10,"hp":-10,"note":"名望 +10 · 气血 -10"},"battle":{"name":"第六派首徒","art":"w_villain","hp":150,"atk":22,"def":5,"fleeOk":true,"win":"ch11_after","lose":"ch11_after","reward":{"fame":18,"neili":10}}},{"text":"任他走","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch11_after"},{"text":"问方丈：“他们师父是谁？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"know_sixth":true}},"next":"ch11_after"}]},"ch11_after":{"title":"第十一章 · 各奔前程","art":"w_monk","text":["会盟散得很快。","少林说回去闭门三年；武当说不再问江湖事；峨眉说把那九个被同门按住的人的名字，刻在自己山门上。","五派的人下山那天，山门口站了一排人，谁也不说话，只是把刀放在地上，磕了三个头。","你在山门里看着，忽然明白：一个江湖的好日子，是从认错开始的。","但第六派不会认。"],"choices":[{"text":"“那第六派，我去。”","eff":{"fame":12,"wuxing":6,"note":"名望 +12 · 悟性 +6"},"next":"ch12_start"},{"text":"先去雁门，把碑补上","eff":{"karma":12,"wuxing":8,"note":"善恶 +12 · 悟性 +8"},"next":"free_roam"},{"text":"回长安，看看朝廷那边动静","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch12_start"}]},"ch12_start":{"title":"第十二章 · 烽火","art":"w_sc_battlefield","text":["入冬前，北边的烽燧又亮了一回。","不是狼烟——是传讯的火。三座烽燧一间一间亮起来，从雁门一直传到太原。","消息传到长安的时候，朝廷已经在调兵。","你在城门口看见一队队新兵往北边去，最小的看起来不过十五六岁，背着比自己还长的枪。"],"choices":[{"text":"跟着新兵一起北上","eff":{"fame":8,"wuxing":4,"note":"名望 +8"},"next":"ch12_camp"},{"text":"先去兵部，弄清到底是谁打来了","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch12_info"},{"text":"把血刀门的账册送去兵部，借这件事逼朝廷翻案","eff":{"wuxing":10,"fame":6,"note":"悟性 +10 · 名望 +6"},"next":"ch12_info"}]},"ch12_info":{"title":"第十二章 · 谁在打","art":"w_loc_yanmen","text":["兵部的说法是：北狄南下，三万人，破了两个边堡。","可你在兵部的旧档里翻到另一份东西——那三万人里，有七千是当年雁门守令营的旧部。","他们不是打进来的。他们是“安置”之后，被推到了关外，又被当成了敌人。","账册最后一页写着：雁门旧部，安置于关外三堡，配甲、给粮、不得回关。"],"choices":[{"text":"“他们是被逼反的。”","eff":{"wuxing":12,"karma":8,"note":"悟性 +12 · 善恶 +8","flags":{"know_truth_north":true}},"next":"ch12_camp"},{"text":"把这份旧档抄一份","eff":{"wuxing":8,"note":"悟性 +8","items":["安置旧档"]},"next":"ch12_camp"},{"text":"什么都不说，先去雁门","eff":{"fame":6,"note":"名望 +6"},"next":"ch12_camp"}]},"ch12_camp":{"title":"第十二章 · 关外三堡","art":"w_sc_mountain_pass","text":["关外三堡，如今只剩一片焦土。","堡墙上还留着守军的旗，旗是旧的——不是朝廷的旗，是当年守令营的那面。","一个受伤的老兵靠在墙根，看见你腰间的牌子，忽然挣扎着要站起来。","“守令营的令……”他抓住你的手，“你们……终于来了。”"],"choices":[{"text":"蹲下去，把他扶稳","eff":{"karma":10,"hp":6,"note":"善恶 +10 · 气血 +6"},"next":"ch12_veteran"},{"text":"“这里发生了什么？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch12_veteran"},{"text":"把牌子解下来，放在他手里","eff":{"fame":10,"karma":8,"note":"名望 +10 · 善恶 +8"},"next":"ch12_veteran"}]},"ch12_veteran":{"title":"第十二章 · 老卒","art":"w_sc_battlefield","text":["老兵说，他们被安置在关外，给了甲、给了粮，却不给归籍。","“连个名字都没有。死了也没人知道。”","今年秋天，关内断了粮。堡里的人想回关，关门不开。","“我们不是要打。我们只想回家。”","他咳了几声，血从嘴角流下来：“你告诉他们——我们不是反贼。”"],"choices":[{"text":"“我去开那道关门。”","eff":{"fame":16,"karma":10,"hp":-10,"note":"名望 +16 · 善恶 +10"},"next":"ch12_gate"},{"text":"先把他送到安全的地方","eff":{"karma":12,"note":"善恶 +12"},"next":"ch12_gate"},{"text":"问他：带头的将领是谁","eff":{"wuxing":8,"note":"悟性 +8","flags":{"know_north_leader":true}},"next":"ch12_gate"}]},"ch12_gate":{"title":"第十二章 · 关门","art":"w_loc_yanmen","text":["雁门关的关门，十七年前被撞开过一次，如今又关着。","关内守军摆开了阵势，弓弩上弦。关外，七千旧部列着队，没有举旗，也没有喊话。","两边就这么对着，谁都没有动。","你站在关门中间。两边的箭都能射到你。"],"choices":[{"text":"“开门。”——对着关内喊","eff":{"fame":20,"karma":12,"hp":-20,"note":"名望 +20 · 善恶 +12 · 气血 -20"},"next":"ch12_end"},{"text":"“你们退回去，我去讨个说法。”——对着关外喊","eff":{"wuxing":12,"karma":6,"note":"悟性 +12 · 善恶 +6"},"next":"ch12_end"},{"text":"把玄阴令举起来","eff":{"fame":18,"wuxing":8,"note":"名望 +18 · 悟性 +8"},"next":"ch12_end"}]},"ch12_end":{"title":"第十二章 · 雪原","art":"w_loc_changan","text":["那一天下了很大的雪。","关门最后开了——不是因为你的喊声，是因为关内也有人想开。","七千人进了关，没有一个人拔刀。他们排着队，一队一队走过关门，走到城里，走到有饭吃的地方。","有人跪下来捧起一把关内的土，捂在脸上。","你站在城楼上，看着这七千人，忽然想起父亲信上的两个字。","——别去。"],"choices":[{"text":"这一章，就先到这里（进日常）","eff":{"karma":10,"hp":20,"note":"善恶 +10 · 气血 +20"},"next":"free_roam"},{"text":"回长安，把安置旧部的事摆到朝堂上","eff":{"fame":12,"wuxing":8,"note":"名望 +12 · 悟性 +8"},"next":"ch7_start"},{"text":"铁牌的事还没了。去见该见的人","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch13_start"}]},"birth_start":{"title":"前传 · 出生","art":"w_sc_winter_road","text":["你记事，是从一双粗糙的手开始的。","那双手把你从襁褓里抱起来，掂了掂，然后有人在你耳边笑：“是个带把的。”","屋里很暗，只有一盏油灯。灯下坐着一个女人，脸色白得像纸，她想伸手摸你，抬到一半就落了下去。","接生婆叹了口气，把一块温热的布裹紧你，交到门口那个男人手里。","那个男人低头看你，看了很久，说了一句你后来记了一辈子的话。","至于是哪句话——要看你落生在什么人家了。"],"choices":[{"text":"书香门第：父亲是翰林院的编修","eff":{"wuxing":8,"money":20,"note":"悟性 +8 · 银两 +20","flags":{"family":"scholar"}},"next":"birth_child"},{"text":"将门之后：父亲守雁门，一身旧伤","eff":{"hp":20,"fame":5,"note":"气血 +20 · 名望 +5","flags":{"family":"general"}},"next":"birth_child"},{"text":"商贾之家：父亲跑漕运，账本比人亲","eff":{"money":80,"note":"银两 +80","flags":{"family":"merchant"}},"next":"birth_child"},{"text":"医家：父亲是走街的郎中，药箱比家当重","eff":{"wuxing":4,"hp":10,"note":"悟性 +4 · 气血 +10","flags":{"family":"doctor"}},"next":"birth_child"},{"text":"江湖人家：父亲有一把不给人看的刀","eff":{"neili":6,"fame":6,"note":"内力 +6 · 名望 +6","flags":{"family":"jianghu"}},"next":"birth_child"},{"text":"无父无母：你是被人放在庙门口的","eff":{"karma":5,"wuxing":5,"note":"善恶 +5 · 悟性 +5","flags":{"family":"orphan"},"items":["青玉坠"]},"next":"birth_child"}]},"birth_child":{"title":"前传 · 五岁","art":"w_bamboo_hut","text":["五岁那年，你已经能记事。","家里的院子不大，有一棵歪脖子枣树。你每天在树下坐着，看大人来来去去。","父亲说要给你开蒙。先生来了，先问你：“你想学什么？”","你还没答，母亲在旁边说：“孩子还小。”","父亲摇头：“小也得选。人这一辈子，头一回选的路，最难改。”"],"choices":[{"text":"读书——认得字，才看得懂这世道","eff":{"wuxing":12,"money":10,"note":"悟性 +12","flags":{"growth":"literati"}},"next":"birth_youth"},{"text":"练武——手里有刀，才不怕人","eff":{"hp":15,"neili":8,"note":"气血 +15 · 内力 +8","flags":{"growth":"martial"}},"next":"birth_youth"},{"text":"学做生意——钱能通神，也能通人","eff":{"money":60,"wuxing":4,"note":"银两 +60","flags":{"growth":"merchant"}},"next":"birth_youth"},{"text":"学医术——救人一命，也算积德","eff":{"karma":10,"wuxing":6,"note":"善恶 +10 · 悟性 +6","flags":{"growth":"healer"}},"next":"birth_youth"},{"text":"什么都不学——整天在街上混","eff":{"karma":-5,"wuxing":6,"money":30,"note":"善恶 -5 · 悟性 +6 · 银两 +30","flags":{"growth":"street"}},"next":"birth_youth"}]},"birth_youth":{"title":"前传 · 十岁","art":"w_sc_market","text":["十岁那年，你第一次看见死人。","是城西巷口的一个货郎，被人用刀捅在肚子上，血把身下的土染黑了一片。","围观的人很多，没有一个人上前。衙门的人来了，看了一眼，说是“江湖仇杀”，就抬走了。","你站在人群最外面，闻到血腥味混着雨前的土腥。","那天晚上你睡不着，翻来覆去想的不是怕，而是一个问题：如果他手里也有刀，会不会就不是这个下场。"],"choices":[{"text":"去找父亲，问他为什么没人管","eff":{"wuxing":10,"karma":6,"note":"悟性 +10 · 善恶 +6"},"next":"birth_teen"},{"text":"第二天就去偷偷练刀","eff":{"neili":8,"hp":8,"note":"内力 +8 · 气血 +8"},"next":"birth_teen"},{"text":"把这件事写下来，藏在床板底下","eff":{"wuxing":8,"note":"悟性 +8","items":["童年手记"]},"next":"birth_teen"},{"text":"什么也没做，第二天照常上街","eff":{"karma":-3,"money":10,"note":"善恶 -3 · 银两 +10"},"next":"birth_teen"}]},"birth_teen":{"title":"前传 · 十三岁","art":"w_bamboo_hut","text":["十三岁那年，家里出了事。","至于出的是什么事，要看你学的是什么、走的是哪条路——","书香人家的孩子，翻到父亲藏在书箱底的半页残帛；","将门的孩子，看见父亲旧甲的胸口有一处补过的洞；","商贾的孩子，发现账本上有一笔对不上的银子；","医家的孩子，跟着父亲出诊，第一次见人死在药还没熬好的时候；","江湖人家的孩子，第一次被父亲按在院子里，教了一招不传之秘。","而那个在庙门口长大的孩子，遇见了那个瞎眼的药郎。"],"choices":[{"text":"追着这条线索查下去","eff":{"wuxing":10,"fame":4,"note":"悟性 +10 · 名望 +4","flags":{"curious":true}},"next":"birth_sixteen"},{"text":"先问父亲：家里是不是有事瞒着我","eff":{"wuxing":8,"karma":4,"note":"悟性 +8 · 善恶 +4","flags":{"asked_father":true}},"next":"birth_sixteen"},{"text":"什么也不问，装作没看见","eff":{"karma":-4,"hp":10,"note":"气血 +10"},"next":"birth_sixteen"}]},"birth_sixteen":{"title":"前传 · 十六岁","art":"w_sc_winter_road","text":["十六岁那年，长安落了七日的雪。","你记得那一夜的每一个细节：破庙的泥像、漏风的窗、门外七个黑影。","也记得那枚青玉坠贴在胸口的凉意。","后来的一切，都是从那扇被撞开的庙门开始的。","——你的故事，从这里才算真正开始。"],"choices":[{"text":"（进入正文）","eff":{},"next":"start"}]},"ch13_start":{"title":"第十三章 · 铁牌","art":"w_sc_mountain_pass","text":["铁牌在你怀里放了七天，你才摸清它的门道。","正面刻着“令”字，背面是一列边军番号。可那两个番号之间，有一条极细的缝。","用刀尖一挑，牌子从中间裂开——里面是空心的，藏着一张薄如蝉翼的帛。","帛上写着十二个字：“持此者，可废调令。非调兵，是夺兵。”","你看了很久，忽然明白为什么那三千人非死不可。"],"choices":[{"text":"把帛收好，铁牌合上","eff":{"wuxing":10,"note":"悟性 +10","items":["废令牌帛书"]},"next":"ch13_hunt"},{"text":"把这东西烧了，一了百了","eff":{"karma":10,"wuxing":6,"note":"善恶 +10 · 悟性 +6","flags":{"burned_token2":true}},"next":"ch13_after"},{"text":"先去找顾总兵，问他知道不知道","eff":{"fame":6,"wuxing":6,"note":"名望 +6 · 悟性 +6"},"next":"ch13_general"}]},"ch13_hunt":{"title":"第十三章 · 三方来抢","art":"w_loc_luoyang","text":["消息走漏得比你想象中快。","第三天，客栈的茶水里有了苦味；第五天，窗下多了一双靴印；第七天，来了三拨人。","一拨穿官服，说是兵部办案；一拨说话带着京腔的内侍；还有一拨，什么也不说，只在街对面站着。","你坐在窗边，把铁牌放在桌上，忽然觉得这块东西比一条命重。"],"choices":[{"text":"从后窗走，谁也见","eff":{"wuxing":8,"hp":-8,"note":"悟性 +8 · 气血 -8"},"next":"ch13_road"},{"text":"留下，见官服那一拨","eff":{"fame":8,"wuxing":6,"note":"名望 +8 · 悟性 +6"},"next":"ch13_office"},{"text":"把三拨人凑到一张桌上","eff":{"fame":14,"wuxing":10,"hp":-12,"note":"名望 +14 · 悟性 +10 · 气血 -12"},"next":"ch13_table"}]},"ch13_office":{"title":"第十三章 · 兵部","art":"w_sect_wudang","text":["兵部那位主事姓冯，四十岁上下，说话很客气。","“这块牌子的来历，朝廷有卷宗。”他说，“十七年前就封存了。您手上这一块，是活的。”","“活的？”","“牌子分活死。死的只能调一营，活的能废一令。”他压低声音，“所以这牌子不能留在江湖上。”","“那该在哪？”","“在兵部。或者——烧了。”"],"choices":[{"text":"“烧了它，你们就不会再杀人了？”","eff":{"karma":8,"fame":6,"note":"善恶 +8 · 名望 +6"},"next":"ch13_table"},{"text":"把牌子交给他","eff":{"karma":-6,"money":300,"note":"善恶 -6 · 银两 +300","flags":{"gave_office":true}},"next":"ch13_after"},{"text":"“我要见能做主的人。”","eff":{"fame":10,"wuxing":8,"note":"名望 +10 · 悟性 +8"},"next":"ch13_table"}]},"ch13_general":{"title":"第十三章 · 顾总兵","art":"w_sc_battlefield","text":["顾总兵在城外的营里练兵。他听完，沉默了很久。","“废令。”他重复了一遍，像是咬着这两个字，“你知道这意味着什么吗——边军八万，谁拿着它，谁就能让任何一道圣旨变成废纸。”","“所以你早就知道。”","“我猜到了。”他看着你，“这十七年，我一直没去找这块牌子。因为我怕自己找到之后，会动心。”"],"choices":[{"text":"“现在呢？动心么？”","eff":{"wuxing":10,"fame":6,"note":"悟性 +10 · 名望 +6"},"next":"ch13_table"},{"text":"把牌子交给他保管","eff":{"fame":8,"karma":4,"note":"名望 +8 · 善恶 +4","flags":{"gave_general2":true}},"next":"ch13_after"},{"text":"“我要用它，但不是为了当皇帝。”","eff":{"fame":12,"wuxing":8,"note":"名望 +12 · 悟性 +8"},"next":"ch13_road"}]},"ch13_table":{"title":"第十三章 · 一张桌","art":"w_loc_yanmen","text":["三拨人真坐在了一张桌上。","内侍捧着茶不喝，兵部主事翻着一本空册子，街对面那位黑衣人不肯坐，站在门口。","“这牌子的东西，你们都想要。”你把铁牌放在桌心，“那我说说我的条件。”","“第一，雁门三千人，名字进正史。第二，雁门旧部，回关归籍。第三，此事之后，谁都不许再拿它调兵。”","堂里静得能听见茶盏落桌的声音。"],"choices":[{"text":"把帛书当众念出来","eff":{"fame":20,"karma":10,"note":"名望 +20 · 善恶 +10","flags":{"read_aloud":true}},"next":"ch13_after"},{"text":"只给他们看，不给他们碰","eff":{"wuxing":12,"fame":8,"note":"悟性 +12 · 名望 +8"},"next":"ch13_after"},{"text":"当众把帛书烧了，只留铁牌","eff":{"karma":12,"fame":14,"hp":-10,"note":"善恶 +12 · 名望 +14 · 气血 -10","flags":{"burned_silk":true}},"next":"ch13_after"}]},"ch13_road":{"title":"第十三章 · 夜路","art":"w_snow_city","text":["出城的路不好走。","后面跟着的人很稳，不急着追，像是算准了你要去哪儿。","走到一处山坳，前面横出几道人影，后面的人也到了。","你把手按在铁牌上，忽然笑了一下——父亲当年大概也是这么站着的。"],"choices":[{"text":"拔剑，往前冲","eff":{"hp":-20,"fame":12,"note":"名望 +12 · 气血 -20"},"battle":{"name":"黑衣追兵","art":"w_villain","hp":130,"atk":22,"def":4,"fleeOk":true,"win":"ch13_after","lose":"ch13_wounded","reward":{"fame":15,"money":80}}},{"text":"退进林子，绕路走","eff":{"wuxing":10,"hp":-8,"note":"悟性 +10 · 气血 -8"},"next":"ch13_after"},{"text":"把铁牌扔进溪里，引开他们","eff":{"karma":-8,"wuxing":8,"note":"善恶 -8 · 悟性 +8","flags":{"lost_token":true}},"next":"ch13_after"}]},"ch13_wounded":{"title":"第十三章 · 血夜之后","art":"w_villain","text":["你被拖进一间破屋，血从肩上一直流到门槛。","天快亮时，一个拾柴的孩子发现了你。他没问你是谁，只是把自己的干粮掰了一半，塞进你嘴里。","“我爹说，江湖人都是坏人。”他说，“可你看着不像。”"],"choices":[{"text":"把身上最后一两银子给他","eff":{"money":-10,"karma":12,"note":"善恶 +12"},"next":"ch13_after"},{"text":"问他：这附近有没有官道","eff":{"wuxing":6,"hp":10,"note":"气血 +10"},"next":"ch13_after"}]},"ch13_after":{"title":"第十三章 · 收场","art":"w_sc_mountain_pass","text":["这件事最后没有赢家。","铁牌不见了，帛书或烧了、或散了，或落进了某一方的手里。","但有一件事变了——街上开始有人议论雁门，议论那三千个名字。","有个说书人把这段编成了书，讲到最后一句是：“他们不是反贼，他们只是想回家。”","你坐在茶馆里听着，忽然想：也许这就够了。"],"choices":[{"text":"起身，回终南山去看看师父的坟","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6"},"next":"ch14_start"},{"text":"先在茶馆坐完这一段书","eff":{"hp":12,"wuxing":6,"note":"气血 +12 · 悟性 +6"},"next":"ch14_start"}]},"ch14_start":{"title":"第十四章 · 回山","art":"w_sc_grave","text":["终南山的雪化了。","竹屋还是那间竹屋，可门是开着的，屋里的东西被翻过——不像是偷，像是找。","药篓倒了，晒药的竹匾碎了，师父那张床被掀开，床板上的灰被人抹过一遍。","屋后那座坟，被人从侧面挖开了一个洞。"],"choices":[{"text":"先看坟","eff":{"wuxing":8,"karma":4,"note":"悟性 +8 · 善恶 +4"},"next":"ch14_grave"},{"text":"先查屋子，看丢了什么","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch14_room"},{"text":"顺着脚印追出去","eff":{"wuxing":6,"hp":-5,"note":"气血 -5"},"next":"ch14_trail"}]},"ch14_room":{"title":"第十四章 · 翻过的屋子","art":"w_river_port","text":["屋子被翻得很彻底，但有几样东西没动：一柄旧剑、一只药罐、墙上挂着的那串干葫芦。","偷东西的人显然在找纸——书、信、图。","你蹲下去看床板，被抹过的那块下面，刻着一行小字：","“若有来客，勿信其言。看剑。”","你回头看那柄旧剑。剑鞘底端，比别处厚了一层。"],"choices":[{"text":"拆开剑鞘","eff":{"wu
