xing":10,"note":"悟性 +10","items":["剑鞘夹层信"]},"next":"ch14_letter"},{"text":"先去看坟","eff":{"karma":4,"wuxing":4,"note":"善恶 +4 · 悟性 +4"},"next":"ch14_grave"}]},"ch14_grave":{"title":"第十四章 · 坟","art":"w_sc_grave","text":["坟被挖开了一半，棺材露出来，盖子被撬过，又被人盖回去了。","你跳下去看——师父的遗骨还在，随葬的东西少了两样：一枚旧铜钱，一卷薄书。","挖坟的人很小心，甚至把土都填回去了一半。","这不像盗墓，像是有人急着找什么，又不敢惊动太多。"],"choices":[{"text":"重新把坟修好","eff":{"karma":12,"hp":6,"note":"善恶 +12 · 气血 +6"},"next":"ch14_letter"},{"text":"查看掘痕，看是什么工具挖的","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch14_trail"}]},"ch14_trail":{"title":"第十四章 · 脚印","art":"w_sc_inn_room","text":["脚印很浅，是布鞋，右脚比左脚深一点——那个人腿上有旧伤。","脚印下山后往东，走了半天，进了一座小镇。","镇上只有一家药铺还开着门。掌柜的看见你，先看了一眼你的剑。","“你是沈瞎子那个徒弟？”"],"choices":[{"text":"“你认识我师父？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch14_shop"},{"text":"“这几天有人来抓药么？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch14_shop"},{"text":"“挖坟的是谁？”——直接问","eff":{"fame":4,"wuxing":6,"note":"名望 +4 · 悟性 +6"},"next":"ch14_shop"}]},"ch14_shop":{"title":"第十四章 · 药铺","art":"w_sc_court_hall","text":["掌柜的姓周，是师父的旧识。","“你师父的眼睛，不是病瞎的。”他把门板上了半扇，才低声说，“是他自己弄瞎的。”","你手里的茶碗停在半空。","“三十年前，他在宫里当过差，替一位贵人看眼。那位贵人，后来死了。他看了不该看的东西，怕有人把这些东西从他眼睛里挖出来——就自己先弄瞎了。”"],"choices":[{"text":"“他看了什么？”","eff":{"wuxing":12,"note":"悟性 +12"},"next":"ch14_truth"},{"text":"“那位贵人是谁？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"know_noble":true}},"next":"ch14_truth"},{"text":"沉默很久，问他为什么现在才说","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6"},"next":"ch14_truth"}]},"ch14_truth":{"title":"第十四章 · 看见的东西","art":"w_sc_battlefield","text":["“他看见一份单子。”周掌柜说，“不是名册，是药单。一味一味药，后头跟着一个名字。”","“谁的药？”","“宫里那位贵人的。药单上最后一行写着‘雁门，三千，副将以下，尽’。”","周掌柜把一枚旧铜钱放在桌上，正是坟里少的那枚。","“他杀了人。不是用刀，是用药。他不肯认，可他一辈子都在替这件事赎——所以他才去救你。”"],"choices":[{"text":"“那卷薄书呢？是不是还在他手里？”","eff":{"wuxing":10,"note":"悟性 +10","items":["药单副本"]},"next":"ch14_final"},{"text":"把铜钱收起来","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6","items":["师父旧铜钱"]},"next":"ch14_final"},{"text":"“他为什么不早死？”——声音发抖","eff":{"karma":-4,"wuxing":8,"note":"悟性 +8"},"next":"ch14_final"}]},"ch14_letter":{"title":"第十四章 · 剑鞘里的信","art":"w_loc_yanmen","text":["剑鞘夹层里是一张极薄的纸，折成四折。","“吾徒：","若你看到这封信，说明我已经不在了，也说明你终于查到这一步。","我这一生只做过一件错事，错到我不敢告诉你。","你若恨我，就把这封信烧了，别再往下查——下头的路，比雁门冷得多。","你若还认我，就去洛阳找周掌柜。他会告诉你另一半。”"],"choices":[{"text":"去洛阳找周掌柜","eff":{"wuxing":10,"note":"悟性 +10","flags":{"read_master_letter":true}},"next":"ch14_truth"},{"text":"把信烧了，就当没看过","eff":{"karma":8,"hp":10,"note":"善恶 +8 · 气血 +10","flags":{"burned_master_letter":true}},"next":"free_roam"}]},"ch14_final":{"title":"第十四章 · 冷","art":"w_ruined_temple","text":["从药铺出来，天已经黑了。","街上的雪被人踩得很实。你想起师父教你的第一句话：“剑是护人的，不是杀人的。”","可他后来一辈子没再用剑。","你忽然明白，他教你的不是剑，是“不要再走一遍他的路”。","这一夜，你在镇外的破庙里坐到天亮。"],"choices":[{"text":"回雁门，把这件事了结","eff":{"wuxing":10,"fame":6,"note":"悟性 +10 · 名望 +6"},"next":"free_roam"},{"text":"继续往北，去找那份药单","eff":{"wuxing":8,"note":"悟性 +8"},"next":"free_roam"},{"text":"回长安。该来的会来——嵩山的帖子已经到了","eff":{"fame":8,"wuxing":6,"note":"名望 +8 · 悟性 +6"},"next":"ch15_start"}]},"ch15_start":{"title":"第十五章 · 帖子","art":"w_sc_mountain_pass","text":["帖子是六派联名发的，用的是最旧的那种红笺，字是手写。","上面写着：雁门旧案既已见天日，江湖当有一会，正本清源。地点在嵩山，日子定在三月十五。","落款处密密麻麻几十个名字，六派掌门、帮派会首、镖局总头、还有几支你没听过的宗门。","最后一枚印，是空着的。","送帖子的人说：“这一枚，等你来盖。”"],"choices":[{"text":"去。把这笔账当着天下人算清","eff":{"fame":12,"note":"名望 +12"},"next":"ch15_gather"},{"text":"先查明这帖子是谁牵的头","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch15_who"},{"text":"不去。江湖的事，跟我没关系了","eff":{"karma":6,"wuxing":4,"note":"善恶 +6 · 悟性 +4"},"next":"free_roam"}]},"ch15_who":{"title":"第十五章 · 牵头的","art":"w_sect_shaolin","text":["帖子是少林发的，可真正出力的是兵部那位冯主事。","“朝廷要一个说法。”他说，“不是给死人的，是给活人的。天下人都在看着，雁门的事得有个交代。”","“交代完了呢？”","“完了，就该轮到别的事了。”他笑了一下，“比如，谁该坐那个位子。”","你听懂了。雁门是刀，现在刀要落到别的脖子上了。"],"choices":[{"text":"“我不当你们的刀。”","eff":{"karma":10,"fame":6,"note":"善恶 +10 · 名望 +6"},"next":"ch15_gather"},{"text":"“那把刀，我来握。”","eff":{"fame":14,"wuxing":8,"note":"名望 +14 · 悟性 +8","flags":{"want_power":true}},"next":"ch15_gather"},{"text":"什么都不说，转身走了","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch15_gather"}]},"ch15_gather":{"title":"第十五章 · 嵩山之会","art":"w_sc_battlefield","text":["三月十五，嵩山来了三千多人。","山道上从早到晚都是人，有带刀的，有挑担的，有抱着孩子来看热闹的。","论剑台被改成了会台，台上摆着十九把椅子：六派掌门、玄阴余党代表、漕运商会、边军、刑部、兵部。","你被安排在最末一把椅子上——离台心最远，也离所有人最近。"],"choices":[{"text":"等他们吵完再说","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch15_debate"},{"text":"一上台就把药单拍出来","eff":{"fame":16,"karma":4,"note":"名望 +16 · 善恶 +4"},"next":"ch15_expose"},{"text":"先去找苏凝和殷小满","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6"},"next":"ch15_meet"}]},"ch15_meet":{"title":"第十五章 · 台下","art":"w_sc_cliff","text":["苏凝在台下的老松树边站着，还是那身素衣。","殷小满站在她旁边，腰间挂着血刀门的旧刀，比上次见面时瘦了。","“这台上十九把椅子，没有一把是给我们坐的。”苏凝说。","“那你们来做什么？”","“看你。”她说得很干脆，“你今天说什么，我们都站你这边。”"],"choices":[{"text":"“那就一起上台。”","eff":{"fame":12,"karma":8,"note":"名望 +12 · 善恶 +8","flags":{"allies_on_stage":true}},"next":"ch15_debate"},{"text":"“你们在台下，比台上更有用。”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch15_debate"},{"text":"什么都不说，只是点头","eff":{"hp":10,"note":"气血 +10"},"next":"ch15_debate"}]},"ch15_debate":{"title":"第十五章 · 十九把椅子","art":"w_sect_shaolin","text":["吵了整整一天。","六派说要清算玄阴余党；玄阴余党说要先还雁门公道；兵部说旧案已了不必再提；边军说关外七千人还没饭吃。","每一句话都有道理，每一句话都在推。","到黄昏时，少林方丈站起来，把手里那枚空印放在台心：“这枚印，今天总要有人盖。”","堂上安静下来。所有人都在看你。"],"choices":[{"text":"上台，盖下那枚印","eff":{"fame":24,"wuxing":10,"note":"名望 +24 · 悟性 +10","flags":{"signed_pact":true}},"next":"ch15_pact"},{"text":"把印推开：“这枚印，不该由一个江湖人来盖。”","eff":{"karma":14,"fame":10,"note":"善恶 +14 · 名望 +10"},"next":"ch15_refuse"},{"text":"说出那个名字：宗正寺","eff":{"fame":20,"wuxing":12,"note":"名望 +20 · 悟性 +12","flags":{"named_zongzheng":true}},"next":"ch15_expose"}]},"ch15_expose":{"title":"第十五章 · 药单","art":"w_loc_yanmen","text":["你把药单摊在台心。","一味药，一个名字，最后一行是“雁门，三千，副将以下，尽”。","“这不是江湖的账。”你说，“这是宫里的账。六派是刀，兵部是鞘，真正下令的人，坐在龙椅上。”","台下炸了。有人在喊“放肆”，有人在骂“血口喷人”，更多的人不说话。","崔侍郎第一个站起来，对着台心深深一揖。"],"choices":[{"text":"“所以这枚印，该盖在宫里。”","eff":{"fame":22,"karma":10,"note":"名望 +22 · 善恶 +10","flags":{"blame_court":true}},"next":"ch15_pact"},{"text":"“我不求你们信。我只求你们查。”","eff":{"wuxing":14,"fame":12,"note":"悟性 +14 · 名望 +12"},"next":"ch15_pact"},{"text":"把药单收起来，走下台","eff":{"wuxing":8,"karma":6,"note":"悟性 +8 · 善恶 +6"},"next":"ch16_start"}]},"ch15_pact":{"title":"第十五章 · 盟约","art":"w_sc_mountain_pass","text":["那枚印最后盖在了一份很短的东西上。","一共三行：","“雁门三千人，非叛，为其守令而死，入正史。”","“关外旧部，归籍安置，给田给粮。”","“此后江湖事，江湖了；朝廷事，朝廷了。两不相犯。”","三千多人在台下看着，没有欢呼，只是很多人跪下来，把头磕在石头上。"],"choices":[{"text":"在盟约上落下自己的名字","eff":{"fame":20,"karma":12,"note":"名望 +20 · 善恶 +12","flags":{"signed_name":true}},"next":"ch16_start"},{"text":"什么也不签，把位置留给下一个人","eff":{"karma":8,"wuxing":10,"note":"善恶 +8 · 悟性 +10"},"next":"ch16_start"}]},"ch15_refuse":{"title":"第十五章 · 不盖","art":"w_sc_battlefield","text":["你把印推了回去。","“这枚印，盖下去就是江湖认了朝廷的规矩。雁门那三千人，从此要靠一份恩典活着。”","“那你要什么？”方丈问。","“我要他们活着，是因为他们本来就该活着。不是因为谁开恩。”","台上安静了很久。最后方丈把手收回去，说：“那这份盟约，我们来立。”"],"choices":[{"text":"看着他们把盟约立完","eff":{"karma":14,"fame":14,"note":"善恶 +14 · 名望 +14"},"next":"ch16_start"},{"text":"提前离场","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch16_start"}]},"ch16_start":{"title":"第十六章 · 惊变","art":"w_loc_yanmen","text":["嵩山会盟之后，长安传来消息：皇帝病重。","三日后，宫门紧闭，禁军换了防。街上开始戒严，城门每天只开两个时辰。","再三日，崔侍郎的人找到你，只说了一句话：“宫里要变。你若不来，雁门那份盟约，就是一张废纸。”"],"choices":[{"text":"连夜进城","eff":{"fame":8,"wuxing":6,"note":"名望 +8 · 悟性 +6"},"next":"ch16_city"},{"text":"先去找顾总兵，问边军的立场","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch16_general"},{"text":"按兵不动，看风向","eff":{"wuxing":6,"karma":-4,"note":"悟性 +6 · 善恶 -4"},"next":"ch16_city"}]},"ch16_general":{"title":"第十六章 · 边军","art":"w_sc_mountain_pass","text":["顾总兵在营里等了你两天。","“八万边军，我按着不动。”他说，“进京，就是造反；不动，就是看着别人换皇帝。”","“你打算怎么按？”","“我在等一个人给我一个理由。”他看着你，“不是圣旨，也不是兵符——是你。”"],"choices":[{"text":"“不进京。守住边关，就是最大的理由。”","eff":{"karma":12,"fame":10,"note":"善恶 +12 · 名望 +10","flags":{"general_stand":true}},"next":"ch16_gate"},{"text":"“进京。但不是去当刀，是去救火。”","eff":{"fame":14,"wuxing":8,"note":"名望 +14 · 悟性 +8","flags":{"general_move":true}},"next":"ch16_gate"},{"text":"“我要你自己拿主意。”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch16_gate"}]},"ch16_gate":{"title":"第十六章 · 宫门","art":"w_sc_battlefield","text":["宫门前已经空了。守门的禁军不认令牌，只认人。","崔侍郎在门里等你。他瘦了一圈，袖口磨破了。","“陛下还有气。”他说，“可宫里说他已经死了。梁公公拿着兵符，要立宗正寺那位。”","“雁门的账，是他的主意？”","“是。”崔侍郎点头，“所以这份盟约，他一旦掌权，第一个要烧的就是它。”"],"choices":[{"text":"“带我进去。”","eff":{"fame":10,"wuxing":6,"note":"名望 +10 · 悟性 +6"},"next":"ch16_lamp"},{"text":"“先控制兵符。”","eff":{"wuxing":12,"note":"悟性 +12","flags":{"seize_token":true}},"next":"ch16_guard"},{"text":"“我要见梁公公。”","eff":{"fame":12,"wuxing":8,"note":"名望 +12 · 悟性 +8"},"next":"ch16_eunuch"}]},"ch16_eunuch":{"title":"第十六章 · 梁公公","art":"w_loc_yanmen","text":["梁公公还是那间直房，铜炉里的香换了更浓的。","“你来得比咱家想的快。”他捧着茶，“雁门的事，你查得不错。可惜查对了，也没用。”","“为什么？”","“因为天下人要的不是真相，是安稳。”他吹了吹茶沫，“朕——他们宁可要一个能立规矩的人，也不要一个总在翻旧账的人。”","你忽然发现，他自称已经改了。"],"choices":[{"text":"“你不是皇帝。”","eff":{"fame":14,"wuxing":8,"note":"名望 +14 · 悟性 +8"},"next":"ch16_hall_door"},{"text":"把药单放在他面前","eff":{"fame":12,"karma":6,"note":"名望 +12 · 善恶 +6"},"next":"ch16_hall_door"},{"text":"拔剑","eff":{"hp":-15,"fame":16,"karma":-4,"note":"名望 +16 · 气血 -15"},"battle":{"name":"大内高手","art":"w_monk","hp":190,"atk":24,"def":6,"fleeOk":true,"win":"ch16_hall","lose":"ch16_wounded","reward":{"fame":20}}}]},"ch16_hall":{"title":"第十六章 · 殿上","art":"w_sc_mountain_pass","text":["大殿上，帘子放下来了。","帘后有人咳嗽，咳得很轻，像是怕被人听见。","梁公公站在阶下，手里捧着那份“遗诏”。宗正寺的人站在他身后，禁军站在更后面。","崔侍郎把雁门的盟约举起来：“盟约已立，天下皆知。谁敢烧，谁就是与天下为敌。”","两边的人，手都按在了刀上。"],"choices":[{"text":"站到崔侍郎那边","eff":{"fame":16,"karma":10,"note":"名望 +16 · 善恶 +10","flags":{"side_minister":true}},"next":"ch16_end"},{"text":"站到帘子那边去，只为问一句","eff":{"wuxing":14,"fame":10,"note":"悟性 +14 · 名望 +10","flags":{"side_emperor":true}},"next":"ch16_curtain_detail"},{"text":"把药单摔在殿心，谁也别想干净","eff":{"fame":22,"karma":6,"hp":-20,"note":"名望 +22 · 善恶 +6 · 气血 -20","flags":{"chaos":true}},"next":"ch16_end"}]},"ch16_curtain":{"title":"第十六章 · 帘后","art":"w_sc_battlefield","text":["你掀开帘子走进去。","帘后那个老人比传说中更瘦，眼窝陷下去，还睁着眼。","“雁门，”他说话很慢，“朕记得。”","“记得还下令？”","“朕记得，是因为朕不能忘。”他咳了一声，“那三千人不该死。可朕若不下令，死的人会更多。”","“你现在还这么想？”","他看了你很久，忽然笑了：“不。朕快死了，才敢说——朕当年错了。”"],"choices":[{"text":"“那就把这句话，写在遗诏上。”","eff":{"fame":24,"karma":14,"note":"名望 +24 · 善恶 +14","flags":{"emperor_confess":true}},"next":"ch16_end"},{"text":"什么也不说，替他把被子掖好","eff":{"karma":12,"wuxing":10,"note":"善恶 +12 · 悟性 +10"},"next":"ch16_end"},{"text":"“这句话，救不了三千人。”——转身出去","eff":{"wuxing":12,"karma":-4,"note":"悟性 +12 · 善恶 -4"},"next":"ch16_end"}]},"ch16_wounded":{"title":"第十六章 · 血殿","art":"w_loc_yanmen","text":["你从殿里退出来时，肩上中了一刀。","宫门外的雪被踩得稀烂，禁军已经换成了宗正寺的人。","崔侍郎把你拖进一条夹道：“走。今天改不了什么了。”","“雁门那份盟约呢？”","“我烧了。”他说，“烧了，就没人能拿它当借口。”"],"choices":[{"text":"“烧了也好。”","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"ch16_end"},{"text":"“我会再立一份。”","eff":{"fame":14,"wuxing":8,"note":"名望 +14 · 悟性 +8"},"next":"ch16_end"}]},"ch16_end":{"title":"第十六章 · 天亮","art":"w_sc_mountain_pass","text":["天亮的时候，宫门开了。","新帝登基的诏书贴出来，梁公公的名字在最后一行，小得像句脚注。","雁门的盟约，有的版本说烧了，有的说还在兵部的柜子里，还有的说被某个江湖人带走了。","街上的人照常开门做生意。卖汤饼的摊主把炉子生起来，抬头看了看天。","长安又落了一场雪，不大，很快就化了。"],"choices":[{"text":"回雁门，把那块碑补完（进日常）","eff":{"karma":12,"hp":20,"note":"善恶 +12 · 气血 +20"},"next":"ch16_after_dawn"},{"text":"留在长安，看看新朝会走成什么样","eff":{"wuxing":10,"fame":8,"note":"悟性 +10 · 名望 +8"},"next":"free_roam"},{"text":"回雁门，把碑立完（第十七章）","eff":{"karma":8,"note":"善恶 +8"},"next":"ch17_start"}]},"ch17_start":{"title":"第十七章 · 回雁门","art":"w_loc_yanmen","text":["你回雁门，是入冬以后的事。","关墙上新刷了一层白灰，把旧年那些弹痕盖住了。守关的兵换了一茬，不认得你，只认得你手里的文书。","关西的守令营还是那个样子。塌的塌，空的空，营门上那块匾被人重新描过，“守令”两个字黑得发亮。","碑前摆着十几束干了的花。","有人先你一步来过。"],"choices":[{"text":"在碑前站一会儿","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"ch17_wall"},{"text":"去问守关的兵，这些花是谁放的","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch17_flowers"},{"text":"先把营里塌的屋子修一修","eff":{"karma":6,"hp":8,"note":"善恶 +6 · 气血 +8"},"next":"ch17_stone"}]},"ch17_flowers":{"title":"第十七章 · 送花的人","art":"w_sc_battlefield","text":["守关的兵说，花是附近村里的妇人放的，每年入冬都来。","“她们的男人当年在这营里。”他说，“有的连尸首都没找着。”","“她们知道这营里死了多少人么？”","“知道。”兵看着碑，“正因为知道，才不来哭。”","你沉默了很久。风从关外灌进来，把花吹得沙沙响。"],"choices":[{"text":"记下这些村子的名字","eff":{"wuxing":8,"karma":6,"note":"悟性 +8 · 善恶 +6","items":["村名册"]},"next":"ch17_stone"},{"text":"让人把碑周边收拾干净","eff":{"money":-20,"karma":8,"note":"善恶 +8 · 银两 -20"},"next":"ch17_stone"}]},"ch17_stone":{"title":"第十七章 · 碑上的名字","art":"w_sc_grave","text":["碑上原来只有八百多个名字，父亲的名字被凿掉了一半。","你带着顾总兵的手抄、石壁上抄下的三千人名单、还有周掌柜给的那一份，凑了一千一百个。","还差一千九百个。","石匠是个哑巴，蹲在碑前看了半天，用刀在石头上比划：刻不下。","确实刻不下。这块碑太小了。"],"choices":[{"text":"再立一块碑，能刻多少刻多少","eff":{"money":-100,"karma":12,"fame":8,"note":"善恶 +12 · 名望 +8"},"next":"ch17_build"},{"text":"把名字刻在营墙上，让每个来的人都能看见","eff":{"karma":14,"fame":10,"note":"善恶 +14 · 名望 +10"},"next":"ch17_build"},{"text":"只刻一句：“三千人，非叛。”","eff":{"karma":10,"wuxing":12,"note":"善恶 +10 · 悟性 +12"},"next":"ch17_build"}]},"ch17_build":{"title":"第十七章 · 立碑","art":"w_sc_grave","text":["立碑那天下了雪。","来的不只是村里的人。有从关外赶回来的旧部，有从南边一路走来的读书人，还有几个不认识的老兵，穿着补丁摞补丁的旧甲。","哑巴石匠刻了一整天。天黑时，他退后三步，把锤子放下了。","没人说话。雪落在新刻的字上，很快又化了。"],"choices":[{"text":"把父亲那半截名字亲手补上","eff":{"karma":14,"hp":10,"note":"善恶 +14 · 气血 +10"},"next":"ch17_after"},{"text":"让哑巴石匠替我刻","eff":{"karma":10,"wuxing":8,"note":"善恶 +10 · 悟性 +8"},"next":"ch17_after"},{"text":"只在碑下放一壶酒","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"ch17_after"}]},"ch17_after":{"title":"第十七章 · 老兵","art":"w_loc_yanmen","text":["夜里，营里烧起了火。","那几个老兵围着火坐，谁也没说话。过了很久，一个姓何的开口：“当年从这儿走，我以为这辈子都不敢回来。”","“为什么回来了？”","“因为有人把碑立了。”他抬起脸，火光在他脸上跳，“碑立了，就不是白死。”","你把酒葫芦传下去，传了一圈，回到手里，还是满的。"],"choices":[{"text":"“往后这儿，我常来。”","eff":{"karma":12,"fame":6,"note":"善恶 +12 · 名望 +6"},"next":"ch17_veterans"},{"text":"把酒分下去，逼着他们每人喝一口","eff":{"karma":8,"hp":12,"note":"善恶 +8 · 气血 +12"},"next":"ch17_veterans"},{"text":"什么也不说，陪着坐到天亮","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch17_morning"}]},"ch18_start":{"title":"第十八章 · 之后","art":"w_sc_mountain_pass","text":["雁门的事完了。","再往后，日子就慢下来了。长安城里没人再提那场宫变，嵩山的盟约被抄进了几本私书里，江湖上又有了新的热闹。","你忽然发现，自己不知道该去哪儿了。","该报的仇报了，该问的问清了，该刻的字也刻了。","剩下的是一整段长长的、没有事的日子。"],"choices":[{"text":"回江南，找个地方住下","eff":{"karma":8,"hp":20,"note":"善恶 +8 · 气血 +20"},"next":"ch18_rest"},{"text":"去洛阳找苏凝","eff":{"fame":4,"hp":10,"note":"气血 +10"},"next":"ch18_su"},{"text":"留在长安，看看这新朝能走多远","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch18_court"},{"text":"回门派，把门户接过来","eff":{"fame":10,"wuxing":6,"note":"名望 +10 · 悟性 +6"},"next":"ch18_sect"}]},"ch18_su":{"title":"第十八章 · 洛阳","art":"w_inn","text":["洛阳的雪比长安的小。","苏凝在城东开了间小铺子，卖药，也卖一点酒。铺子不大，门楣上没挂招牌，只挂了一盏灯。","她看见你，没说话，先给你倒了一碗酒。","“我以为你不来了。”","“我也以为。”","两个人都笑了一下。门外有人经过，灯影晃了晃。"],"choices":[{"text":"“往后我就住这儿了。”","eff":{"karma":12,"hp":20,"note":"善恶 +12 · 气血 +20","flags":{"stay_with_su":true}},"next":"ch18_end"},{"text":"“我还得走一趟。走完就回来。”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch18_rest"},{"text":"喝完这碗酒，什么也没说，走了","eff":{"karma":-4,"wuxing":8,"note":"善恶 -4 · 悟性 +8"},"next":"ch18_end"}]},"ch18_rest":{"title":"第十八章 · 江南","art":"w_sc_battlefield","text":["江南的春天来得早。","你在一个靠水的小镇上买了几间屋，屋前有一棵老梅。","每天早上起来，煮一壶茶，看一会儿水。镇上的人只知道你姓沈，会一点拳脚，不爱说话。","有几次，夜里有人翻墙进来，留下一个包裹就走。包裹里是药、是银两、有时候只是一张纸条：“雁门的事，有人记着。”","你把纸条一张张收进箱子里。"],"choices":[{"text":"把箱子埋在老梅树下","eff":{"karma":10,"wuxing":10,"note":"善恶 +10 · 悟性 +10"},"next":"ch18_end"},{"text":"给送东西的人回一封信","eff":{"karma":12,"fame":6,"note":"善恶 +12 · 名望 +6"},"next":"ch18_end"}]},"ch18_court":{"title":"第十八章 · 新朝","art":"w_sc_mountain_pass","text":["新朝改了几条律，其中一条是边军阵亡者的抚恤。","崔侍郎升了尚书，第一件事就是把雁门旧部的名册报到翰林院。","他请你去做个闲职，你推了。","“那你打算做什么？”","“在城里走走，看看。”","他笑了一下：“也好。这城里，总得有人记得从前的事。”"],"choices":[{"text":"答应做个不领俸禄的“记事人”","eff":{"fame":12,"wuxing":10,"note":"名望 +12 · 悟性 +10","flags":{"chronicler":true}},"next":"ch18_end"},{"text":"什么也不应，转身走了","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch18_end"}]},"ch18_sect":{"title":"第十八章 · 门户","art":"w_sc_forest_path","text":["门派还在山上。","你回去那天，山门口的积雪还没扫，几个新入门的弟子在阶下练拳，拳架生涩。","掌教把门户印放在你面前：“你接不接？”","你看着那枚印，忽然想起自己第一次上山时，是个连剑都拿不稳的少年。"],"choices":[{"text":"接。把门里的规矩改一改","eff":{"fame":16,"karma":10,"note":"名望 +16 · 善恶 +10","flags":{"became_master":true}},"next":"ch18_end"},{"text":"不接。只教了三个月拳就走了","eff":{"wuxing":12,"karma":6,"note":"悟性 +12 · 善恶 +6"},"next":"ch18_end"}]},"ch18_end":{"title":"第十八章 · 江湖远","art":"w_sc_battlefield","text":["很多年以后，有人说在雁门见过你，有人说在江南见过你，还有人说在长安的茶馆里见过一个很像你的人。","说书人把这段故事编成话本，讲到最后一页，写的是：","“不知其名，不知其所终。”","这世上的江湖，本来也不是一个人的事。","雪落下来的时候，先白山头，还是先白坟头——这个问题，你到最后也没想明白。","不过没关系了。"],"choices":[{"text":"去嵩山，接下武林盟主之位","cond":{"fame":60},"eff":{},"next":"end_king"},{"text":"回终南山，把师父的坟修好","cond":{"karma":10},"eff":{},"next":"end_hermit"},{"text":"执掌玄阴教，与天下为敌","cond":{"karma":-10},"eff":{},"next":"end_demon"},{"text":"一个人去六派总坛，把命留在那里","eff":{},"next":"end_martyr"},{"text":"把名单呈给天子，换一个官身","cond":{"money":200,"fame":30},"eff":{},"next":"end_official"},{"text":"（和该在一起的人，把日子过下去）","cond":{"flags":{"stay_with_su":true}},"eff":{},"next":"end_love"},{"text":"回门派，接掌门户","cond":{"flags":{"became_master":true}},"eff":{},"next":"end_sect"},{"text":"把三卷合一，开宗立派","cond":{"flags":{"grandmaster":true}},"eff":{},"next":"end_grandmaster"},{"text":"不再压制体内魔气，任它吞了自己","cond":{"flags":{"demonic_qi":true}},"eff":{},"next":"end_demonform"},{"text":"先不急着了断。去洛阳盘个盘口","cond":{"money":300},"eff":{},"next":"merchant_1"},{"text":"—— 故事到这里，也该歇一歇了（进日常）","eff":{"karma":6,"wuxing":6},"next":"free_roam"}]},"ch1_snow":{"title":"第一章 · 雪地里的两个时辰","art":"w_sc_winter_road","text":["你从破庙里爬出来的时候，天还没亮。","雪已经没到膝盖。你跑不动，只能一步一步往前挪，每挪一步，肋下的伤就抽一下。","身后没有追兵的声音——这比有声音更让人害怕。你回头看了一眼，破庙里亮着一点火光，是那七个人在烤火。","“他们不追，”你想，“是因为知道我跑不远。”","你走到一条结冰的水沟边，实在走不动了，就滚了下去。冰面裂开，冷水灌进衣领，疼得你几乎喊出来。","你咬着牙，把自己埋进沟边的雪里，只留一线缝看外面。"],"choices":[{"text":"一动不动，等天亮","eff":{"hp":-10,"wuxing":8,"note":"气血 -10 · 悟性 +8"},"next":"ch1_dawn"},{"text":"把外袍撕开，裹住伤口","eff":{"hp":-5,"karma":2,"note":"气血 -5"},"next":"ch1_dawn"},{"text":"想回头看看老乞丐还在不在庙里","eff":{"karma":6,"hp":-8,"note":"善恶 +6 · 气血 -8"},"next":"ch1_dawn"}]},"ch1_dawn":{"title":"第一章 · 天亮之前","art":"w_sc_winter_road","text":["天大亮的时候，雪停了。","你听见有人在雪上走，一步一顿，脚步很慢，还伴着竹杖点地的声音。","那声音在你上方停住，停了很久。","然后一只手伸下来，把你从雪里提了起来。那手很凉，指节粗糙，虎口上有一道旧疤。","“经脉断了三处，还能撑到天亮。”一个沙哑的声音说，“命硬。”","你抬头，看见一张瘦削的脸，两只眼睛是闭着的，眼皮陷下去，像两口枯井。"],"choices":[{"text":"“你是谁？”","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch1_master_arrive"},{"text":"“庙里……有个老乞丐……”","eff":{"karma":8,"hp":-5,"note":"善恶 +8"},"next":"ch1_master_arrive"},{"text":"什么都说不出来，只是抓住他的袖子","eff":{"karma":4,"hp":5,"note":"气血 +5"},"next":"ch1_master_arrive"}]},"ch1_master_arrive":{"title":"第一章 · 瞎子","art":"w_monk","text":["瞎子姓沈，村里人都叫他沈瞎子。","他把你背回竹屋，用三碗苦得发涩的药，把你从鬼门关拖回来。","第七天，你能坐起来了。他坐在门口削一根木棍，削得很慢。","“你的命是我捡的。”他说，“捡回来的东西，得有个去处。”","“什么去处？”","“学点本事。不然过两日他们再来，你还是得死。”"],"choices":[{"text":"“我学。”","eff":{"neili":6,"note":"内力 +6","flags":{"master":"剑"}},"next":"ch1_teach_sword"},{"text":"“我想知道他们是谁。”","eff":{"wuxing":8,"note":"悟性 +8","flags":{"know_trail":true}},"next":"ch1_teach_sword"},{"text":"“学了，然后呢？”","eff":{"wuxing":6,"karma":4,"note":"悟性 +6 · 善恶 +4"},"next":"ch1_teach_sword"}]},"ch1_lesson_1":{"title":"第一章 · 第一课：挑水","art":"w_sc_forest_path","text":["他教你的第一件事，是挑水。","两只木桶，一根扁担，从溪边挑到屋前，来回三十六趟。","挑了七天，肩膀磨破，结痂，又磨破。你忍不住问：“这跟剑有什么关系？”","他坐在门槛上，头也不抬：“剑在肩上，不在手里。挑不动水的人，挑不动剑。”","第十九天，你挑到第三十趟的时候，忽然觉得扁担轻了。","不是水少了，是你学会了在走路的时候把气沉下去。"],"choices":[{"text":"把这件事告诉他","eff":{"neili":8,"wuxing":6,"note":"内力 +8 · 悟性 +6"},"next":"ch1_lesson_2"},{"text":"什么也不说，继续挑","eff":{"neili":10,"hp":-4,"note":"内力 +10"},"next":"ch1_lesson_2"},{"text":"偷懒少挑两趟","eff":{"neili":4,"karma":-3,"note":"善恶 -3"},"next":"ch1_lesson_2"}]},"ch1_lesson_2":{"title":"第一章 · 第二课：看水","art":"w_sc_forest_path","text":["第二课，他让你坐在溪边看水。","“看什么？”","“看到水不流为止。”","你看了三天，水一直在流。你急得想发脾气，他却在旁边睡着了。","第七天，一场大雨，溪水暴涨。你看着浑浊的急流，忽然发现——急的是水，静的是水底那块石头。","晚上你跟他说了这事。他笑了一下，那是你第一次见他笑。"],"choices":[{"text":"“所以剑要像石头？”","eff":{"wuxing":10,"neili":4,"note":"悟性 +10 · 内力 +4"},"next":"ch1_lesson_3"},{"text":"“所以人要像石头？”","eff":{"wuxing":8,"karma":4,"note":"悟性 +8 · 善恶 +4"},"next":"ch1_lesson_3"},{"text":"什么都不问，回去睡了","eff":{"hp":10,"note":"气血 +10"},"next":"ch1_lesson_3"}]},"ch1_lesson_3":{"title":"第一章 · 第三课：断竹","art":"w_bamboo_hut","text":["屋后有片竹林。他让你去断竹，一刀断一根，不许回刀。","第一根，你砍了三刀。第二根，两刀。第三根，竹子弹回来，在你脸上划了一道。","“竹子有心。”他说，“顺着它的心砍，它自己就断；逆着它，它就抽你。”","你在竹林里待了整整一个月。手指上全是竹屑，虎口裂了又好。","后来有一天，你举刀，忽然觉得那根竹子“薄”了——刀落下去，一声脆响，从根断了。","那天你在竹林里站了很久，第一次觉得自己手里有东西。"],"choices":[{"text":"把刀还给他，说“我学到一点了”","eff":{"neili":8,"wuxing":8,"note":"内力 +8 · 悟性 +8"},"next":"ch1_master_ill"},{"text":"继续劈，把整片竹林劈完","eff":{"neili":12,"hp":-10,"note":"内力 +12 · 气血 -10"},"next":"ch1_master_ill"},{"text":"坐在竹林里，想起父亲","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6"},"next":"ch1_master_ill"}]},"ch1_lesson_poison":{"title":"第一章 · 认药","art":"w_sect_emei","text":["学毒的第一步，也是认药。","他把七种草木摊在桌上，要你分辨哪一种是救人的、哪一种是害人的。","七种长得几乎一样。你分错了三次，他罚你在药柜前站了一夜。","“毒师和医师，一开始学的是一样东西。”他说，“区别只在，你想让人活，还是想让人死。”","天亮时，你终于分对了。他点点头，收走了其中三味。","“这三味，先不教你。”"],"choices":[{"text":"“为什么不教？”","eff":{"wuxing":10,"karma":4,"note":"悟性 +10 · 善恶 +4"},"next":"ch1_master_ill"},{"text":"偷偷记下那三味的样子","eff":{"wuxing":8,"karma":-4,"note":"悟性 +8 · 善恶 -4","items":["三味残记"]},"next":"ch1_master_ill"},{"text":"什么也不说，继续熬药","eff":{"karma":6,"neili":4,"note":"善恶 +6 · 内力 +4"},"next":"ch1_master_ill"}]},"ch1_master_ill":{"title":"第一章 · 第三年冬","art":"w_sc_snow_village","text":["第三年的冬天来得早。","他咳血，从立冬咳到冬至。你没日没夜地熬药，药渣堆到了窗沿。","“别熬了。”他说，“我自己的脉，我摸得清。”","“你摸得清，你还让我熬？”","“我想喝。”他躺在那儿笑，“喝你熬的药，比喝我自己的有滋味。”","那年冬天，他把竹屋里能教的东西，一样一样全教给了你。教到最后一夜，他握着你手腕的脉，说了一句你听了很长时间才明白的话。","“你的脉，比你爹的稳。”"],"choices":[{"text":"“你认识我父亲？”","eff":{"wuxing":10,"fame":4,"note":"悟性 +10 · 名望 +4"},"next":"ch1_master_talk"},{"text":"什么都不问，给他再熬一碗药","eff":{"karma":10,"hp":6,"note":"善恶 +10 · 气血 +6"},"next":"ch1_master_talk"},{"text":"在他身边坐到天亮","eff":{"wuxing":6,"karma":6,"note":"悟性 +6 · 善恶 +6"},"next":"ch1_master_talk"}]},"ch1_master_talk":{"title":"第一章 · 最后一夜","art":"w_ruined_temple","text":["他没有回答“认不认识”，只是把当年的事说了一半。","“十六年前，有人抱了个孩子到我这儿，说自己活不长了，求我认下。”","“是你？”","“不是我。”他咳了两声，“我只是那个被求的人。我当时没答应，也没拒绝。第二天他就死了，孩子也不见了。”","“那个孩子……”","“你就是那个孩子。”他闭上眼，“我找了你十三年。”","屋外的风把窗纸吹得哗哗响。你想问更多，他已经睡着了——这一次，再没醒过来。"],"choices":[{"text":"把他埋在后山，坟头朝北","eff":{"karma":12,"wuxing":8,"note":"善恶 +12 · 悟性 +8","flags":{"buried_master":true}},"next":"ch2_inn"},{"text":"先在他坟前守三天","eff":{"karma":8,"hp":10,"note":"善恶 +8 · 气血 +10"},"next":"ch2_inn"},{"text":"收拾东西，当夜就下山","eff":{"fame":6,"karma":-4,"note":"名望 +6 · 善恶 -4"},"next":"ch2_inn"}]},"ch2_inn_room":{"title":"第二章 · 客栈上房","art":"w_sc_inn_room","text":["悦来客栈的上房，隔着一层薄板，能听见隔壁翻身的声音。","你睡不着。下山这么多天，第一次睡在正经床上，反倒不踏实。","隔壁有个人在咳，咳得很轻，像怕吵着谁。咳完了，又起来走动，脚步很慢，在屋里来回踱。","你听着那脚步，数到第四十七个来回的时候，停住了。","然后有人敲了敲你这边的墙，两下，很轻。"],"choices":[{"text":"也敲两下回应","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch2_inn_meet"},{"text":"装作睡着了","eff":{"wuxing":4,"hp":8,"note":"气血 +8"},"next":"ch2_inn"},{"text":"起来，去看看隔壁是谁","eff":{"hp":-5,"wuxing":8,"note":"气血 -5 · 悟性 +8"},"next":"ch2_inn_meet"}]},"ch2_inn_meet":{"title":"第二章 · 隔壁的人","art":"w_sc_inn_room","text":["隔壁是个五十来岁的男人，瘦，穿一件洗得发白的蓝布袍。","他桌上摊着一张纸，纸上画着一条路线，从洛阳一直画到雁门。","“吵着你了？”他咳了一声，“我这毛病，夜里躺不住。”","“你往雁门去？”","他抬眼看你，看了很久，把那张纸折起来：“你也往那边去？”","“我往洛阳。”","“那正好。”他说，“路上，保不齐要死一个人。”"],"choices":[{"text":"“你这话什么意思？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch2_escort"},{"text":"“我送你一程。”","eff":{"karma":8,"fame":4,"note":"善恶 +8 · 名望 +4"},"next":"ch2_escort"},{"text":"不接话，回房睡了","eff":{"hp":10,"note":"气血 +10"},"next":"ch2_inn"}]},"ch2_escort_road":{"title":"第二章 · 车辙","art":"w_sc_winter_road","text":["镖队走到第三天，天阴了。","车夫姓王，赶了二十年车，一路上话不多，只在歇脚的时候拿草料喂马，一边喂一边跟马说话。","“这条路我走过一百多回。”他说，“从前这时候，路上全是车。这两年，少了。”","“去哪了？”","“不敢走了。”他吐了口唾沫，“雁门那一夜之后，好多镖局都关了门。有人说，这路上有鬼。”","你看了看天色。前面是一段山路，两侧的坡上，长满了枯了的酸枣丛。"],"choices":[{"text":"“绕路吧。”","eff":{"hp":-5,"wuxing":6,"note":"气血 -5 · 悟性 +6"},"next":"ch2_mountain_rain"},{"text":"“走。”——让车夫加快","eff":{"fame":4,"note":"名望 +4"},"next":"ch2_checkpoint"},{"text":"自己上前，先去坡上看看","eff":{"wuxing":10,"hp":-8,"note":"悟性 +10 · 气血 -8"},"next":"ch2_checkpoint"}]},"ch2_mountain_rain":{"title":"第二章 · 山神庙的雨","art":"w_sc_temple_night","text":["雨是在半夜下的，来得又急又冷。","你们躲进那座破山神庙。庙不大，山神的脑袋滚在墙角，脸上还糊着旧年的红漆。","火生起来了，衣服挂在一根断梁上烤。车夫蹲在门口抽旱烟，烟锅一明一灭。","“你说，”他忽然问，“人死了以后，是不是就住这种庙里？”","“怎么突然问这个？”","“我弟死在雁门。”他吐了口烟，“尸首没找着。我娘说，没找着的人，魂没处去，就在野地里转。”"],"choices":[{"text":"“会找到的。”","eff":{"karma":6,"hp":6,"note":"善恶 +6 · 气血 +6"},"next":"ch2_mountain"},{"text":"什么也不说，把火拨旺一点","eff":{"karma":8,"note":"善恶 +8"},"next":"ch2_mountain"},{"text":"问他家里人现在怎么样","eff":{"wuxing":8,"karma":4,"note":"悟性 +8 · 善恶 +4"},"next":"ch2_mountain"}]},"ch2_ally_days":{"title":"第二章 · 同行七日","art":"w_heroine","text":["苏凝话少，但有她的规矩。","每天清早，她先起来把火生好；吃饭的时候，她把最好的那块肉夹给你；每到一处，她先去察看四下的路，回来才坐下。","第四天，你伤口的药用完了。她从自己包里翻出一小罐，熟门熟路地给你换药。","“你随身带这么多药？”","“带惯了。”她没抬头，“在教里做事，总有人会受伤。”","第七天夜里，她忽然问你：“你恨玄阴教吗？”"],"choices":[{"text":"“恨。可我不知道该恨谁。”","eff":{"karma":6,"wuxing":8,"note":"善恶 +6 · 悟性 +8"},"next":"ch2_cult_gate"},{"text":"“我恨的是下命令的人。”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"target_clear":true}},"next":"ch2_cult_gate"},{"text":"“你也是玄阴教的人。”","eff":{"karma":-4,"wuxing":6,"note":"善恶 -4 · 悟性 +6"},"next":"ch2_cult_gate"}]},"ch2_cult_gate":{"title":"第二章 · 山门","art":"w_cult_hall","text":["玄阴教总坛的山门，白天看着像座破道观，夜里才看得出名堂。","守门的是两个不说话的人，一左一右站在门后，像两尊泥像。","“暗号。”其中一个开口。","苏凝往前一步，说了三个字。守门人没动，只是把门推开一条缝。","你从缝里进去，回头看了一眼——那两个守门人，始终没有看你。"],"choices":[{"text":"低声问苏凝：暗号是哪三个字","eff":{"wuxing":8,"note":"悟性 +8","flags":{"know_pass":true}},"next":"ch2_cult"},{"text":"什么也不问，跟着走","eff":{"wuxing":4,"hp":6,"note":"气血 +6"},"next":"ch2_cult"},{"text":"暗中记下这两个守门人的样子","eff":{"wuxing":6,"note":"悟性 +6","flags":{"saw_guards":true}},"next":"ch2_cult"}]},"ch2_inner_ritual":{"title":"第二章 · 血手印","art":"w_cult_hall","text":["道观深处的殿里点着九盏灯，灯油发黑。","殿中摆着一只铜盆，盆里是兑了朱砂的血。新入教的人排成一列，轮流上前，把手按进去。","轮到你的时候，管事的人抬眼看了一下，说了句：“新来的，别怕。”","你把手伸进盆里。血是温的。","按下去的一瞬，你听见身后有人在低声念一个名字——是你父亲的名字。"],"choices":[{"text":"把手拿开，转过身去看是谁在念","eff":{"wuxing":10,"hp":-6,"note":"悟性 +10 · 气血 -6","flags":{"heard_father":true}},"next":"ch2_inner"},{"text":"不动声色，按下去","eff":{"karma":-6,"wuxing":6,"note":"善恶 -6 · 悟性 +6"},"next":"ch2_inner"},{"text":"低声问旁边的人：刚才谁在念","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch2_inner"}]},"ch2_escape":{"title":"第二章 · 出教","art":"w_sc_cliff","text":["总坛后山有一条窄道，是运炭的人踩出来的。","苏凝在前面带路，走得很稳。你跟在后头，脚下是松动的碎石，一步踩空就要滑下去。","走到半途，她忽然停住，回头：“出了这条道，你就不再是教里的人了。”","“本来也不是。”","她看了你一会儿，点头：“那走。”"],"choices":[{"text":"“一起走。”","eff":{"karma":10,"fame":4,"note":"善恶 +10 · 名望 +4","flags":{"su_leave":true}},"next":"ch3_tournament"},{"text":"“你留下，教里需要人。”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch3_tournament"},{"text":"什么也不说，加快脚步","eff":{"hp":8,"note":"气血 +8"},"next":"ch3_tournament"}]},"ch3_eve":{"title":"第三章 · 论剑前夜","art":"w_sc_mountain_pass","text":["嵩山下的小镇挤满了人，客栈连柴房都住满了。","你在酒摊上听见各种口音：有人说这一届论剑是六派在\"选盟主\"，有人说是要\"了结旧账\"，还有人说，玄阴教的人混进来了。","酒摊老板一边擦碗一边笑：\"每回都这么说。每回都有热闹看。\"","“热闹完了呢？”","“完了就散呗。”他把碗摆好，“江湖上的人，记性都不长。”"],"choices":[{"text":"上山，先看看论剑台","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch3_round1"},{"text":"去打听六派今年的阵势","eff":{"wuxing":10,"money":-10,"note":"悟性 +10 · 银两 -10"},"next":"ch3_round1"},{"text":"回房养精蓄锐","eff":{"hp":12,"note":"气血 +12"},"next":"ch3_round1"}]},"ch3_round1":{"title":"第三章 · 第一场","art":"w_songshan","text":["论剑台是石砌的，台边凿着历年胜者的名字。","你的第一个对手是峨眉的一个年轻弟子，姓程，剑很快，出手先笑。","“师兄，得罪了。”","话音未落，剑已到胸前。","你侧身，剑锋擦着衣角过去。台下有人喝了一声彩。"],"choices":[{"text":"稳着打，先试探","eff":{"wuxing":8,"hp":-8,"note":"悟性 +8 · 气血 -8"},"next":"ch3_round2"},{"text":"抢攻，三招内结束","eff":{"fame":10,"hp":-15,"note":"名望 +10 · 气血 -15"},"next":"ch3_round2"},{"text":"故意露破绽，看他怎么接","eff":{"wuxing":12,"hp":-12,"note":"悟性 +12 · 气血 -12"},"next":"ch3_round2"}]},"ch3_round2":{"title":"第三章 · 第二场：同门","art":"w_songshan","text":["第二场，抽签抽到了自己人。","那人比你晚入门，平时话不多，见你总是先低头。上了台，他握剑的手在抖。","“师兄，”他小声说，“我娘还等着我拿个名次回去。”","台下有人在喊\"快打\"。他咬了咬牙，先出手了。"],"choices":[{"text":"让他赢","eff":{"karma":12,"fame":-6,"note":"善恶 +12 · 名望 -6"},"next":"ch3_round3"},{"text":"认真打，不让他","eff":{"fame":8,"karma":-4,"note":"名望 +8 · 善恶 -4"},"next":"ch3_round3"},{"text":"打成平手，让裁判为难","eff":{"wuxing":10,"fame":4,"note":"悟性 +10 · 名望 +4"},"next":"ch3_round3"}]},"ch3_round3":{"title":"第三章 · 第三场：苏凝","art":"w_heroine","text":["第三场，你在台上看见了苏凝。","她换了身青色的劲装，把头发束起来，站到台中央。台下有人认出她，低声议论\"玄阴教的\"","“别让人看出你认识我。”她用只有两个人能听见的声音说。","然后她拔了剑。"],"choices":[{"text":"全力应战","eff":{"fame":12,"hp":-20,"note":"名望 +12 · 气血 -20"},"next":"ch3_betray_detail"},{"text":"输给她——她要留在教里","eff":{"karma":10,"fame":-8,"note":"善恶 +10 · 名望 -8"},"next":"ch3_betray_detail"},{"text":"拖着打成平手","eff":{"wuxing":8,"hp":-10,"note":"悟性 +8 · 气血 -10"},"next":"ch3_betray_detail"}]},"ch3_betray_detail":{"title":"第三章 · 消息","art":"w_sc_city_wall","text":["论剑第三天，镇上传来消息：镇远镖局一夜之间被灭门。","“尸体挂在城门上。”报信的人喘着气，“胸口插着一把剑，那剑……剑柄上刻着字。”","“什么字？”","“沈。”","台下一下子静了。有人开始往后退，有人伸手去摸兵器。","你站在台边，忽然想起那个咳了一路的蓝布袍男人。"],"choices":[{"text":"“我去看看。”——立刻下山","eff":{"fame":8,"hp":-10,"note":"名望 +8 · 气血 -10"},"next":"ch3_betray"},{"text":"“那剑不是我的。”——当众说明","eff":{"fame":6,"wuxing":8,"note":"名望 +6 · 悟性 +8"},"next":"ch3_betray"},{"text":"什么都不说，先走","eff":{"wuxing":10,"karma":-4,"note":"悟性 +10 · 善恶 -4"},"next":"ch3_betray"}]},"ch3_witness":{"title":"第三章 · 目击者","art":"w_sc_market","text":["洛阳城门口，尸体已经收了，只留着一摊洗不掉的血。","你找到一个卖炊饼的老妇，她说她看见了。","“杀人的人穿黑衣，蒙着脸。”她比划，“不过有个怪处——他走路是瘸的。”","“瘸的？”","“右腿，拖着走。”","你想起那个蓝布袍男人，想起他咳着在屋里踱步的样子——一步一顿，右脚总比左脚轻。"],"choices":[{"text":"“我是个瘸子。”——去追","eff":{"wuxing":10,"fame":6,"note":"悟性 +10 · 名望 +6"},"next":"ch3_truth"},{"text":"先把老妇的话记下来","eff":{"wuxing":8,"note":"悟性 +8","items":["目击笔录"]},"next":"ch3_truth"},{"text":"回论剑台，当众说出这条线索","eff":{"fame":12,"wuxing":6,"note":"名望 +12 · 悟性 +6"},"next":"ch3_truth"}]},"ch3_truth_detail":{"title":"第三章 · 殿中三日","art":"w_cult_hall","text":["你在玄阴道观里待了三天。","第一天，教主让人送来一套干净衣裳；第二天，是一壶酒；第三天，他把那幅画挂到了你房里。","画上是两个年轻人，一个持剑，一个执笔。执笔的那个，眉眼和你像。","“这是你父亲。”他说，“持剑的是我。”","“你们当年在做什么？”","“在做一件大逆不道的事。”他说，“我们想把这世上的兵，全卖光。”"],"choices":[{"text":"“卖光兵，那谁来守边？”","eff":{"wuxing":12,"note":"悟性 +12"},"next":"ch4_six"},{"text":"“所以你们失败了。”","eff":{"wuxing":8,"fame":4,"note":"悟性 +8 · 名望 +4"},"next":"ch4_six"},{"text":"“我父亲为什么死？”","eff":{"wuxing":10,"karma":4,"note":"悟性 +10 · 善恶 +4"},"next":"ch4_six"}]},"ch5_ferry_rain":{"title":"第五章 · 渡口的棚子","art":"w_sc_river_dock","text":["渡口的棚子是草搭的，四面漏风。","雨从棚顶漏下来，在地上砸出一个个小坑。棚里挤着七八个等船的人，谁也不说话。","棚角有个老汉在温酒，一壶酒放在炭火边，酒气混着雨水味飘过来。","“来一口？”他把碗递过来，“这天，不喝酒要冻坏。”"],"choices":[{"text":"接过来喝一口","eff":{"hp":10,"karma":2,"note":"气血 +10"},"next":"ch5_ferry_talk"},{"text":"“我不喝。借问一句，去落雁村怎么走？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch5_ferry_talk"},{"text":"不说话，靠着柱子闭眼","eff":{"wuxing":4,"hp":6,"note":"气血 +6"},"next":"ch5_ferry_talk"}]},"ch5_ferry_talk":{"title":"第五章 · 老汉","art":"w_sc_river_dock","text":["“落雁村？”老汉的手停了一下，“你去那儿做什么？那村子空了半年了。”","“空了？”","“一夜之间空的。”他把酒壶从火上拿下来，“说是遭了匪，可匪抢完东西就走，哪有人把井填了、把祠堂烧了的。”","“官府不管？”","“管什么。”他笑了一声，那笑很干，“来了一队人，看了一眼，说是‘江湖仇杀’，就走了。”","雨声忽然大了起来。"],"choices":[{"text":"“那队人穿的什么衣裳？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"know_officials":true}},"next":"ch5_road2"},{"text":"把碗里的酒喝完，起身","eff":{"hp":8,"note":"气血 +8"},"next":"ch5_road2"},{"text":"给老汉留几个铜钱","eff":{"money":-5,"karma":6,"note":"善恶 +6"},"next":"ch5_road2"}]},"ch5_road2":{"title":"第五章 · 去落雁村的路","art":"w_sc_winter_road","text":["从渡口到落雁村，要走三十里。","路上没有人，也没有车辙。雪把一切都盖平了，只有几行野物的脚印，从路这边穿到路那边。","走到一半，你看见路边的树上挂着一只破了的灯笼。灯笼里的火早灭了，纸壳上还留着烟熏的痕迹。","那是村里人过年挂的。"],"choices":[{"text":"把灯笼取下来，带上","eff":{"karma":4,"wuxing":6,"note":"悟性 +6","items":["破灯笼"]},"next":"ch5_village_enter"},{"text":"在灯笼下站一会儿","eff":{"karma":6,"hp":6,"note":"善恶 +6 · 气血 +6"},"next":"ch5_village_enter"},{"text":"不停，继续走","eff":{"hp":4,"note":"气血 +4"},"next":"ch5_village_enter"}]},"ch5_village_enter":{"title":"第五章 · 进村","art":"w_loc_luoyan","text":["村口有一口井，被石头和土填死了。","再往里走，是一排烧塌的房子。房梁倒下来，还保持着塌陷那一瞬间的样子。","祠堂在最里面，门楣上的匾只剩半个“氏”字。","祠堂里没有神像，只有一地碎瓦，和墙上一片暗褐色的痕——是血，被人用什么东西泼过，泼得很匀，像是要把它“洗干净”。","你在墙根看见一只小小的鞋。"],"choices":[{"text":"把那只小鞋捡起来","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"ch5_oldman"},{"text":"继续往祠堂深处走","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch5_oldman"},{"text":"退出去，喘一口气","eff":{"hp":8,"note":"气血 +8"},"next":"ch5_village"}]},"ch5_oldman":{"title":"第五章 · 还没断气的人","art":"w_sc_grave","text":["祠堂最里头的一堆碎木头下面，压着一个人。","是个老人，脸被熏黑了，胸前有一道很深的伤。他还有气，眼睛半睁着。","你把他扶起来。他抓住你的袖子，力气大得不像快死的人。","“他们说……名单上的人，都要死。”他一字一字往外挤，“可是名单上第一个名字……是你啊。”","“哪个名单？谁说的？”","他的嘴张了张，没说出声。手松开了。"],"choices":[{"text":"替他合上眼","eff":{"karma":10,"wuxing":6,"note":"善恶 +10 · 悟性 +6"},"next":"ch5_bury"},{"text":"在他身上找那名单","eff":{"wuxing":8,"karma":-2,"note":"悟性 +8","items":["半页名册"]},"next":"ch5_bury"},{"text":"把他抱到祠堂外，让他看看天","eff":{"karma":12,"hp":8,"note":"善恶 +12 · 气血 +8"},"next":"ch5_bury"}]},"ch5_bury":{"title":"第五章 · 埋人","art":"w_sc_grave","text":["你在村后挖了坑。","地冻得很硬，一铲下去只有浅浅一层。你挖了整整一个下午，手上全是血泡。","村里能找出来的人，一共二十三具。你把他们都放进坑里，一个一个摆好。","最后一个是那个老人。放他下去的时候，你想起他抓着你袖子的力气。","填上土，你从破屋里找了一块门板，立在坟前。没有笔，就用刀刻了三个字：「落雁村」。"],"choices":[{"text":"在坟前站到天黑","eff":{"karma":10,"wuxing":8,"note":"善恶 +10 · 悟性 +8"},"next":"ch5_list"},{"text":"刻完就走，不敢回头看","eff":{"hp":10,"note":"气血 +10"},"next":"ch5_list"},{"text":"把那只小鞋也埋进去","eff":{"karma":12,"note":"善恶 +12"},"next":"ch5_list"}]},"ch5_list":{"title":"第五章 · 十九个名字","art":"w_sc_grave","text":["名册是半页，纸很旧，边角被水泡过。","十九个名字，用很小的小楷写着，末尾各有一个记号。第一个名字被朱砂划掉了，划得很重，墨都透到背面。","划掉的那个名字，是你父亲。","你从上往下看，看到第八个名字时，手停住了——那是沈瞎子的字，你认得出。","第十九行没有名字，只有一行小字：「持青玉坠者，续。」"],"choices":[{"text":"把名册收进怀里","eff":{"wuxing":8,"fame":4,"note":"悟性 +8 · 名望 +4","items":["半页名册"]},"next":"ch5_clue"},{"text":"把那三个记号抄下来","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch5_eight"},{"text":"把名册烧了，就当没见过","eff":{"karma":6,"wuxing":4,"note":"善恶 +6 · 悟性 +4"},"next":"ch5_eight"}]},"ch5_eight":{"title":"第五章 · 八个人","art":"w_sc_market","text":["接下来两个月，你走了三千里路。","名册上还活着的八个人，你找到了五个。","第三个是个铁匠，见你进门就抄起了锤子；第四个是个尼姑，听完你的话，念了一声佛号，说“我等你很久了”；第五个是个瘫在床上的老人，看见青玉坠，忽然哭了。","还有三个人没找到——一个死了，一个疯了，一个“早就不在江湖上了”。","第五个人哭完，说了一句话：“当年在庙里的，不止七个。”"],"choices":[{"text":"“那还有谁？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"more_than_seven":true}},"next":"ch5_monk"},{"text":"把这句话记在心里","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch5_monk"},{"text":"问他：你后悔吗","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"ch5_monk"}]},"ch5_monk":{"title":"第五章 · 扫地的人","art":"w_monk","text":["最后一个人，在一座小庙里扫地。","他扫得很慢，一把竹帚，一片一片地扫。听见脚步声，他抬起头，看见你腰间的青玉坠，手里的帚子掉了。","“你是……沈家的孩子。”","“你认得我父亲。”","他没有答，慢慢蹲下去捡帚子，捡了两次都没捡起来。","“进来坐吧。”他说，声音抖得厉害，“我等你很多年了。”"],"choices":[{"text":"跟他进去","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch5_night2"},{"text":"先问他：那一夜，你在场么","eff":{"wuxing":10,"karma":-2,"note":"悟性 +10"},"next":"ch5_night2"},{"text":"不进去，就在门口站着","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch5_night"}]},"ch5_night2":{"title":"第五章 · 那一夜（细）","art":"w_sc_temple_night","text":["他讲了一整夜。","“那天夜里，我们六派加上禁军，一共两千人。到了营外，谁也不敢先动。”","“后来有人说了句‘奉旨平叛’，就都动了。”","“你父亲一个人挡在营门口，挡了半个时辰。他一边挡一边喊‘带人走’。”","“我那时候年轻，血冲上脑子，冲上去砍了他一刀。”","老僧把袖子撸起来，手臂上有一道很深的疤：“这一刀，是他回给我的。他本来能杀我。”"],"choices":[{"text":"“他为什么不杀你？”","eff":{"wuxing":10,"karma":6,"note":"悟性 +10 · 善恶 +6"},"next":"ch5_confront"},{"text":"沉默很久，说“我不恨你”","eff":{"karma":14,"wuxing":6,"note":"善恶 +14 · 悟性 +6","flags":{"forgave_monk":true}},"next":"ch5_confront"},{"text":"“恨”字到了嘴边，没说出口","eff":{"wuxing":8,"karma":2,"note":"悟性 +8"},"next":"ch5_confront"}]},"ch7_inn2":{"title":"第七章 · 馄饨摊","art":"w_sc_market","text":["回长安那天，城门刚开。","你在东边的小巷里吃了一碗馄饨。摊主是个寡言的人，一边下馄饨一边看街。","“这条街上，最近多了些生面孔。”他忽然说，“都是一样的靴子。”","“什么靴子？”","“黑面白底，走起来没声。”他把碗推过来，“你要找的人，大概也在找你。”"],"choices":[{"text":"“你怎么知道我要找人？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch7_talk"},{"text":"低头吃馄饨，装作没听懂","eff":{"hp":8,"wuxing":4,"note":"气血 +8"},"next":"ch7_letters"},{"text":"把碗钱放下，起身就走","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch7_letters"}]},"ch7_letters":{"title":"第七章 · 卷宗","art":"w_sc_prison","text":["刑部的后堂有一间小库，堆着十七年前的旧案。","崔侍郎让人把灯点上，自己退了出去。你在里头待了一整夜。","卷宗里的东西大多是抄件，字迹潦草。翻到第三捆，你看见一份“雁门守令营核查”的呈文，末尾批了两个字：","“速结。”","批字的人没有署名，只盖着一方小印——三足乌。"],"choices":[{"text":"把这一页抄下来","eff":{"wuxing":10,"note":"悟性 +10","items":["三足乌批文"]},"next":"ch7_faction"},{"text":"继续翻，找那份真正的旨意","eff":{"wuxing":8,"hp":-8,"note":"悟性 +8 · 气血 -8"},"next":"ch7_faction"},{"text":"把整捆卷宗带走","eff":{"wuxing":6,"karma":-4,"note":"悟性 +6 · 善恶 -4"},"next":"ch7_police"}]},"ch7_clean_room":{"title":"第七章 · 御史台","art":"w_sc_court_hall","text":["御史台的院子比刑部小，也比刑部冷。","韩肃的房里没有炭盆，只有一壶凉茶。他一面搓手一面说话，说到要紧处就停下来喝茶。","“你要翻雁门的案，我不拦。”他说，“但你要明白，翻案不是把死人翻活，是把活人翻下去。”","“我明白。”","“你不明白。”他放下茶碗，“你翻了这个案，朝上要倒三个人，下头要死几十个。你担得起么？”"],"choices":[{"text":"“担不起，也得担。”","eff":{"fame":10,"karma":8,"note":"名望 +10 · 善恶 +8"},"next":"ch7_eunuch2"},{"text":"“那三个人是谁？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"know_three":true}},"next":"ch7_eunuch2"},{"text":"“我只想给三千人一个交代。”","eff":{"karma":10,"wuxing":6,"note":"善恶 +10 · 悟性 +6"},"next":"ch7_eunuch2"}]},"ch7_eunuch2":{"title":"第七章 · 直房","art":"w_sc_court_hall","text":["梁公公的直房在宫墙下，夏天也烧着炉子。","“你来得巧。”他指了指对面的椅子，“咱家今日心情好，可以多说两句。”","“雁门的事，你打算怎么了？”","“了不了。”他笑，“那案子像口井，谁下去谁上不来。你要真想管，咱家给你指条路——去找边将。他有兵，你有理，你们两个凑一块，才凑得出一个‘势’字。”","“你为什么帮我？”","“咱家不帮你。”他把茶碗盖上，“咱家只是不想让别人赢。”"],"choices":[{"text":"“那我先谢过。”","eff":{"wuxing":8,"fame":4,"note":"悟性 +8 · 名望 +4"},"next":"ch7_general_camp"},{"text":"“你怕谁赢？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"know_eunuch_fear":true}},"next":"ch7_general_camp"},{"text":"不说话，站起来就走","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch7_general_camp"}]},"ch7_general_camp":{"title":"第七章 · 军营","art":"w_sc_mountain_pass","text":["边军的营在城外三十里，营门上的旗是旧的，边角都磨毛了。","顾总兵正在校场上看兵练队列。他看见你，把手里的令旗交给副将，走过来。","“进了两回宫？”","“进了。”","“看出什么了？”","“看出这朝廷，谁都想拿刀，谁都不想先挨刀。”","他笑了一下，那笑很短：“说得好。所以你得给他们一个先挨刀的理由。”"],"choices":[{"text":"“什么理由？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch7_general_2"},{"text":"“我不给理由。我给人。”","eff":{"fame":10,"wuxing":6,"note":"名望 +10 · 悟性 +6"},"next":"ch7_general_2"},{"text":"把三足乌批文拿出来","eff":{"wuxing":8,"fame":6,"note":"悟性 +8 · 名望 +6"},"next":"ch7_general_2"}]},"ch7_general_2":{"title":"第七章 · 校场","art":"w_sect_blood","text":["他把你带到校场中央，让正在练的兵都停下来。","“都听着！”他喊，“这位是从雁门回来的。他说雁门那三千人，不是反贼。”","校场上没人说话。半晌，前排一个老兵忽然出列，单膝跪下。","第二个、第三个……一炷香的工夫，校场上跪了一片。","顾总兵转过头，声音很低：“看见没有。这就是理由。”"],"choices":[{"text":"让他们起来","eff":{"fame":12,"karma":10,"note":"名望 +12 · 善恶 +10"},"next":"ch7_night"},{"text":"也单膝跪下，回礼","eff":{"fame":10,"karma":12,"note":"名望 +10 · 善恶 +12"},"next":"ch7_night"},{"text":"什么都不说，站着受这一礼","eff":{"fame":6,"wuxing":8,"note":"名望 +6 · 悟性 +8"},"next":"ch7_night"}]},"ch7_night":{"title":"第七章 · 长安夜","art":"w_loc_changan","text":["夜里，你没有回客栈。","你沿着城墙走了一圈，走到西门的角楼下，坐在台阶上。","有个巡夜的更夫提着灯笼过来，看见你，也不问，就在旁边坐下。","“睡不着？”他问。","“嗯。”","“这城里睡不着的人多。”他把灯笼挂在栏杆上，“打更打了三十年，我见过太多。有人是心里有事，有人是心里没人。”","“我是哪种？”","“你两种都是。”"],"choices":[{"text":"跟他一起坐到天亮","eff":{"wuxing":10,"hp":10,"note":"悟性 +10 · 气血 +10"},"next":"ch7_choice"},{"text":"问他：这城里谁最睡不着","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch7_choice"},{"text":"谢过他，起身回客栈","eff":{"hp":8,"note":"气血 +8"},"next":"ch7_choice"}]},"ch8_gate":{"title":"第八章 · 石阶","art":"w_sc_cliff","text":["黑崖只有一条路上去，三百六十级石阶，凿在崖壁上。","台阶很窄，两边没有栏杆。往下看是雾，雾下面是河，河看不太清。","你走到第一百级的时候，看见台阶边坐着个人，穿着血刀门的黑红衣裳，正在磨刀。","“上山的？”他没抬头，“门主死了，这几日不见客。”","“我不是客。”","他这才抬头，眯起眼看你：“那你是什么？”"],"choices":[{"text":"“来查他死因的人。”","eff":{"fame":6,"wuxing":6,"note":"名望 +6 · 悟性 +6"},"next":"ch8_mourn"},{"text":"“来吊丧的人。”","eff":{"karma":6,"note":"善恶 +6"},"next":"ch8_mourn"},{"text":"不说话，继续往上走","eff":{"wuxing":8,"hp":-5,"note":"悟性 +8 · 气血 -5"},"next":"ch8_mourn"}]},"ch8_mourn":{"title":"第八章 · 灵堂","art":"w_sc_sect_hall","text":["灵堂设在正堂，白幡从梁上一直挂到门口。","棺材停在正中，棺盖开着一半，让亲友看最后一眼。门主穿着一身旧甲，手边放着一把断了的刀。","守灵的是四个弟子，跪在两侧，谁也不说话。香灰落在他们手背上，也没有人弹。","你走过去的时候，其中一个忽然抬头看你，眼神很奇怪。","那不是悲伤，是警惕。"],"choices":[{"text":"上香，然后退到一边观察","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch8_who"},{"text":"直接问那个弟子：为什么看我","eff":{"fame":6,"wuxing":6,"note":"名望 +6 · 悟性 +6"},"next":"ch8_disciple"},{"text":"走近棺材，仔细看门主的脸","eff":{"wuxing":8,"hp":-4,"note":"悟性 +8 · 气血 -4"},"next":"ch8_disciple"}]},"ch8_disciple":{"title":"第八章 · 弟子","art":"w_villain","text":["那个弟子姓孙，是门主身边最近的人，替他捧了六年刀。","你把他叫到廊下。他一开始不肯说，后来听说你是从雁门那边来的，才松了口。","“门主死前那几天，见了一个人。”他低声说，“穿绸衫，很胖，笑起来眼睛眯成一条缝。”","“说了什么？”","“不知道。门主让我退出去。可我出来的时候，听见门主在里面拍桌子。”","“拍桌子？”","“拍得很重。”他顿了顿，“门主这个人，从来不拍桌子。”"],"choices":[{"text":"“那个胖子，还来过么？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"know_fat":true}},"next":"ch8_who"},{"text":"把这条记下来","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch8_who"},{"text":"问他：你怕不怕","eff":{"karma":6,"wuxing":4,"note":"善恶 +6 · 悟性 +4"},"next":"ch8_who"}]},"ch8_daughter_past":{"title":"第八章 · 捡回来的","art":"w_heroine","text":["殷小满是在柴房里跟你说的这些。","“我不是他亲生的。”她说得很平，“十六年前，他在落雁村外捡到我。”","“落雁村？”","“嗯。”她低头看着自己的手，“他说那天村里在烧，我坐在路边哭，谁也没管我。”","你忽然明白了她为什么对那村子那么熟。","“他有没有说，那天村里出了什么事？”","“他说，有三千个人，死在了一个不该死的地方。”"],"choices":[{"text":"“那三千人，我父亲也在里头。”","eff":{"wuxing":10,"karma":6,"note":"悟性 +10 · 善恶 +6","flags":{"told_manman":true}},"next":"ch8_sword"},{"text":"沉默很久，问她：你恨么","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"ch8_sword"},{"text":"什么也不说，只是把火拨旺","eff":{"hp":8,"karma":4,"note":"气血 +8 · 善恶 +4"},"next":"ch8_sword"}]},"ch8_blade_room":{"title":"第八章 · 刀冢","art":"w_sc_sword_forest","text":["门里有个刀冢，在后山。","一把一把的刀插在土里，刀柄朝上，像一片没长叶子的林。血刀门的规矩：弟子的刀断了，就埋在这儿。","“埋了多少把？”","“数不清。”带路的老仆说，“门主那把没埋。他说他的刀还没断。”","你在刀林里走了一圈，忽然看见一把刀的刀柄上刻着一个“沈”字。"],"choices":[{"text":"蹲下去，把刀拔出来","eff":{"wuxing":10,"hp":-6,"note":"悟性 +10 · 气血 -6","items":["刻沈字的旧刀"]},"next":"ch8_yuan"},{"text":"问老仆：这把刀哪来的","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch8_yuan"},{"text":"不动它，记下位置","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch8_yuan"}]},"ch8_after":{"title":"第八章 · 下山","art":"w_sc_mountain_pass","text":["账册到手，你没有在黑崖多留。","下山的时候，天还没亮。三百六十级石阶，走到一半，你回头看，崖上的白幡在风里翻。","那个磨刀的弟子站在第一百级，还是那个位置。","“喂。”他喊，“你要真查出来了——”","“怎么样？”","“托人捎个信。”他说，“我们这门的兄弟，也想知道。”"],"choices":[{"text":"“一定。”","eff":{"karma":8,"fame":4,"note":"善恶 +8 · 名望 +4"},"next":"ch9_start"},{"text":"点点头，继续下山","eff":{"wuxing":6,"hp":8,"note":"气血 +8"},"next":"ch9_start"},{"text":"把账册里的一页撕下来给他","eff":{"wuxing":8,"karma":6,"note":"悟性 +8 · 善恶 +6"},"next":"ch9_start"}]},"ch16_city":{"title":"第十六章 · 戒严","art":"w_loc_changan","text":["长安戒严的第三天，街上只剩三种人：巡街的兵、关门关得晚的铺子，和不怕死的人。","你在朱雀大街的巷口站了一会儿。卖汤饼的摊子还在，摊主把炉子生起来，自己蹲在旁边烤手。","“还卖么？”","“卖。”他抬头，“日子总要过。”","他给你盛了一碗，忽然低声说：“宫里今日不开门。您要是往里走，从西边的水门。”"],"choices":[{"text":"“你怎么知道我要进宫？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch16_entry"},{"text":"吃完这碗汤饼","eff":{"hp":12,"karma":4,"note":"气血 +12 · 善恶 +4"},"next":"ch16_entry"},{"text":"道谢，往西边去","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch16_entry"}]},"ch16_entry":{"title":"第十六章 · 水门","art":"w_sc_city_wall","text":["水门是宫墙下的一道矮闸，平日里走的是运水的车。","守闸的是两个老兵，看见你，也没问话，只是把闸门抬了起来。","“你们不问我是谁？”","“问什么。”其中一个咳了一声，“这几日进来的人，没一个活着出去的。多你一个不多。”","闸门落下的时候，你听见他们在后头低声说了句什么，像是一句佛号。"],"choices":[{"text":"回头看一眼","eff":{"wuxing":6,"karma":4,"note":"悟性 +6 · 善恶 +4"},"next":"ch16_guard"},{"text":"往前走，不回头","eff":{"hp":8,"fame":4,"note":"气血 +8 · 名望 +4"},"next":"ch16_guard"},{"text":"把身上最后一点钱留给他们","eff":{"money":-20,"karma":8,"note":"善恶 +8"},"next":"ch16_guard"}]},"ch16_guard":{"title":"第十六章 · 禁军统领","art":"w_npc_guard","text":["禁军的统领姓霍，三十多岁，甲胄穿得极整齐。","他拦在长廊口，身后的兵排成两列，手都按在刀上。","“你是宫里叫来的人？”","“宫里叫的。”","他看了你很久，忽然问：“雁门那件事，是真的？”","“真的。”","他沉默了一会儿，然后侧身让开：“走过去，别回头。你要是回头，我的兵就得动手。”"],"choices":[{"text":"走过去","eff":{"fame":8,"wuxing":6,"note":"名望 +8 · 悟性 +6"},"next":"ch16_hall"},{"text":"“你为什么信我？”","eff":{"wuxing":10,"note":"悟性 +10","flags":{"know_huo":true}},"next":"ch16_hall"},{"text":"把三足乌批文塞给他","eff":{"fame":10,"karma":6,"note":"名望 +10 · 善恶 +6"},"next":"ch16_hall"}]},"ch16_lamp":{"title":"第十六章 · 长廊","art":"w_sc_court_hall","text":["宫里的长廊点着灯，一盏接一盏，看不见尽头。","你走着走着，忽然发现灯下坐着一个人——是崔侍郎。他穿着官服，坐在地上，背靠着柱子。","“你怎么坐在这儿？”","“等。”他说，“该做的我都做了。剩下的，得等你们这些‘不该来的人’来。”","他拍了拍身边的石阶：“坐一会儿。待会儿进去，就不一定出得来了。”"],"choices":[{"text":"坐下，陪他待一会儿","eff":{"wuxing":8,"hp":10,"note":"悟性 +8 · 气血 +10"},"next":"ch16_eunuch"},{"text":"问他：宫里还有几个人站在我们这边","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch16_eunuch"},{"text":"“不坐了。进去。”","eff":{"fame":6,"note":"名望 +6"},"next":"ch16_eunuch"}]},"ch16_hall_door":{"title":"第十六章 · 殿门","art":"w_sc_court_hall","text":["殿门虚掩着，门缝里透出一线光。","门里有两种情况：一种是梁公公在里面等你；一种是他已经不在里面了。","你把手按在门上，忽然听见里面有人在说话。声音很轻，说的是：","“都退下。”","然后是一阵甲片碰撞的声响，像潮水一样退下去。"],"choices":[{"text":"推门进去","eff":{"fame":8,"wuxing":6,"note":"名望 +8 · 悟性 +6"},"next":"ch16_curtain"},{"text":"在门外等一会儿，听一听","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch16_curtain"},{"text":"退后三步，深吸一口气","eff":{"hp":10,"note":"气血 +10"},"next":"ch16_curtain"}]},"ch16_curtain_detail":{"title":"第十六章 · 帘后","art":"w_sc_court_hall","text":["帘子后面很暗，只有一盏豆大的灯。","老人半躺着，身上盖着一条旧毯子。他的手放在毯子外面，手背上的皮薄得像纸，青筋一根一根。","“朕等了很久。”他说，“等一个不为官、不为钱、不为名来的人。”","“那你怎么知道我不为这些？”","“因为你身上有股味道。”他咳了一声，“雁门的风沙味。”","你想说话，他抬手止住了：“先别说话。朕想听听，外面的人是怎么说朕的。”"],"choices":[{"text":"“说你是个昏君。”","eff":{"fame":10,"wuxing":8,"note":"名望 +10 · 悟性 +8"},"next":"ch16_end"},{"text":"“有人说你老糊涂了，有人说你是装的。”","eff":{"wuxing":10,"karma":4,"note":"悟性 +10 · 善恶 +4"},"next":"ch16_end"},{"text":"“说什么的都有。但没人知道真相。”","eff":{"karma":8,"wuxing":8,"note":"善恶 +8 · 悟性 +8","flags":{"told_emperor":true}},"next":"ch16_end"}]},"ch16_after_dawn":{"title":"第十六章 · 天亮之后","art":"w_sc_city_wall","text":["天亮的时候，城门开了。","街上的人先探出头，然后慢慢走出来，像冬天过去以后从洞里出来的虫。","有个孩子蹲在墙根啃饼，抬头看见你，问：“你是宫里出来的吗？”","“算是。”","“宫里好看吗？”","你想了想，说：“不好看。”","孩子点点头，像是明白了什么，继续啃饼。"],"choices":[{"text":"往雁门的方向看一眼","eff":{"karma":8,"wuxing":8,"note":"善恶 +8 · 悟性 +8"},"next":"ch17_ride"},{"text":"在城门口站到中午","eff":{"hp":12,"note":"气血 +12"},"next":"ch17_start"},{"text":"什么也不看，回客栈睡觉","eff":{"hp":20,"note":"气血 +20"},"next":"free_roam"}]},"ch10_dock":{"title":"第十章 · 下邳码头","art":"w_sc_river_dock","text":["下邳码头停了七天船，两岸堆着卸不下来的粮袋。","上千个脚夫蹲在堤上，谁也不说话。太阳把他们的影子压在脚下，像压着另一批人。","堤边有个孩子在捡漏下来的米粒，一颗一颗往口袋里装。他娘在旁边看着，也没拦。","“这些粮，最后会怎么样？”你问一个老兵。","“烂在舱里。”他说，“烂了，账就平了。”"],"choices":[{"text":"“账平了，人怎么办？”","eff":{"wuxing":8,"karma":6,"note":"悟性 +8 · 善恶 +6"},"next":"ch10_body"},{"text":"把孩子捡的米粒接过来帮他装","eff":{"karma":8,"hp":6,"note":"善恶 +8 · 气血 +6"},"next":"ch10_body"},{"text":"去漕运司衙门口看看","eff":{"wuxing":6,"note":"悟性 +6"},"next":"ch10_body"}]},"ch10_corpse2":{"title":"第十章 · 仵作","art":"w_sc_prison","text":["仵作姓吴，做这行三十年，看过太多“淹死”的人。","“真淹死的，指甲缝里是河泥，肚子里有水。”他一边说一边用手比划，“这位漕运使，指甲是干净的，肚子里的水……是我灌进去的。”","“为什么灌？”","“上头要一个淹死的说法。”他把手在衣襟上擦了擦，“我灌了，他家里就有一笔抚恤。”","“那你良心过得去？”","他笑了一声，那笑很累：“良心这物件，我三十年前就卖了。”"],"choices":[{"text":"给他留一些钱","eff":{"money":-20,"karma":8,"note":"善恶 +8"},"next":"ch10_guild"},{"text":"问他还记得什么别的","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch10_guild"},{"text":"“卖了的，还能买回来。”","eff":{"karma":6,"wuxing":8,"note":"善恶 +6 · 悟性 +8"},"next":"ch10_guild"}]},"ch10_fan":{"title":"第十章 · 范会首","art":"w_npc_innkeeper","text":["范会首的宅子在城东，进门先过三重影壁。","他请你喝茶，茶是三年前的，不好不坏。","“漕运这碗饭，吃的不是粮，是路。”他慢慢说，“谁管着路，谁就管着这城里一半人的口。”","“那漕运使呢？他也管着路？”","“他想全管。”范会首放下茶盏，“这就不行了。路这种东西，得分开管，大家才都有饭吃。”","“所以他死了。”","范会首笑了笑，没答。"],"choices":[{"text":"“你出的手？”","eff":{"fame":8,"wuxing":8,"note":"名望 +8 · 悟性 +8"},"next":"ch10_river"},{"text":"“我只想查清楚，不想掺和。”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch10_river"},{"text":"把茶喝完，什么也不说","eff":{"hp":8,"wuxing":6,"note":"气血 +8 · 悟性 +6"},"next":"ch10_river"}]},"ch10_river":{"title":"第十章 · 夜河","art":"w_loc_luoyang","text":["夜里你划了条小船，往下游去。","河上起了薄雾，两岸的灯影在水里拉得很长。远处有三条船，泊在河湾里，船头挂着黑罩灯。","你把桨收起来，让船顺着水漂。","漂到近处，听见船上有人在低声说话，说的是“明晚”“三百副”“别走漏”。","你把手按在船帮上，一动也不敢动。"],"choices":[{"text":"靠近些，听清楚","eff":{"wuxing":10,"hp":-6,"note":"悟性 +10 · 气血 -6"},"next":"ch10_boat"},{"text":"记下船的数目与灯的样子","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch10_ship"},{"text":"退回去，先做准备","eff":{"hp":8,"wuxing":6,"note":"气血 +8 · 悟性 +6"},"next":"ch10_boat"}]},"ch10_ship_detail":{"title":"第十章 · 舱底","art":"w_sc_prison","text":["舱底比你想的还要大。","两百多副甲分三层码好，每副都用油纸包着，甲片间塞着干草防潮。这不是临时起意，是有人认真备了很久。","最里面有张桌子，桌上压着一张图，图上标着三个渡口、两条河道，还有一行字：","“秋汛后，走水路，三百副，至雁门。”","图角盖着一方小印，三足乌。"],"choices":[{"text":"把图与文书一起带走","eff":{"wuxing":10,"fame":6,"note":"悟性 +10 · 名望 +6","items":["漕运密图"]},"next":"ch10_after"},{"text":"只撕下盖印的那一角","eff":{"wuxing":8,"note":"悟性 +8","items":["三足乌印角"]},"next":"ch10_after"},{"text":"把甲全部推进河里","eff":{"karma":8,"fame":8,"hp":-10,"note":"善恶 +8 · 名望 +8 · 气血 -10"},"next":"ch10_after"}]},"ch10_after2":{"title":"第十章 · 印","art":"w_sc_river_dock","text":["新漕运使到任那天，码头上人山人海。","他站在跳板上念告示，念到一半，人群里有人喊：“那漕运使怎么死的？”","念告示的人顿了一下，然后接着往下念，声音比刚才还稳。","船动了。粮卸了。脚夫们重新蹲回堤上，等下一批货。","你站在人群外面，忽然觉得这城里像是什么都没发生过。"],"choices":[{"text":"去问那个喊话的人是谁","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch11_start"},{"text":"看着船一只只开走","eff":{"wuxing":6,"fame":4,"note":"名望 +4"},"next":"ch11_start"},{"text":"回客栈，把这些写下来","eff":{"wuxing":10,"note":"悟性 +10","items":["漕运手记"]},"next":"ch11_start"}]},"ch9_lamps":{"title":"第九章 · 掌灯","art":"w_cult_hall","text":["掌灯婆婆的故事，是分三夜讲完的。","第一夜，她说她原来不掌灯，是教里抄经的。抄了十七年，抄到眼睛花，才换来掌灯这个差事。","“灯是给谁点的？”","“给死人。”她说，“教里死一个人，就点一盏。我最多一夜点过四十七盏。”","第二夜，她没有来。第三夜她来了，手里捧着一盏没点的灯。","“这盏是我给自己留的。”她说，“我不点了。点了，就没人记得我抄过经了。”"],"choices":[{"text":"“我替你记着。”","eff":{"karma":10,"wuxing":6,"note":"善恶 +10 · 悟性 +6"},"next":"ch9_lamp"},{"text":"“那四十七个人，都是谁？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch9_lamp"},{"text":"把那盏灯接过来","eff":{"karma":8,"wuxing":4,"note":"善恶 +8","items":["未点的灯"]},"next":"ch9_lamp"}]},"ch9_crowd":{"title":"第九章 · 四十个人","art":"w_sc_market","text":["四十个人在废窑里坐着，谁也不说话。","有人带着孩子来；有人手里还拎着没卖完的菜；有个瘸腿的汉子在角落里磨一把生了锈的刀。","“你们都在等什么？”","“等一句话。”瘸腿汉子没抬头，“教主说过，教里不许再杀人。我们就想听人再说一遍。”","废窑外头下起了小雨，雨点打在窑口，声音很轻。"],"choices":[{"text":"把这句话再说一遍","eff":{"karma":14,"fame":6,"note":"善恶 +14 · 名望 +6","flags":{"gave_word":true}},"next":"ch9_uncle"},{"text":"“说了，你们就不杀人了？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch9_uncle"},{"text":"“这话不该我说，该你们自己说。”","eff":{"wuxing":8,"karma":6,"note":"悟性 +8 · 善恶 +6"},"next":"ch9_meet"}]},"ch9_room":{"title":"第九章 · 院里的石榴树","art":"w_bamboo_hut","text":["叔父的院子很小，一株枯了的石榴树占去一半。","屋里的陈设简单得不像一个曾经的教主：一张床，一张桌，墙上挂着两把剑。","“那把剑是谁的？”","“你父亲的。”他说，“我自己的那把，这些年没再碰过。”","桌上压着一张纸，纸上是父亲的字迹：“若我不归，教我儿识字，不必学剑。”","“你违背了他的话。”","“我没有。”叔父把纸收起来，“教你剑的，是沈瞎子。不是我。”"],"choices":[{"text":"“那你教了我什么？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"ch9_talk"},{"text":"“你恨我父亲么？”","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6"},"next":"ch9_talk"},{"text":"走到墙边，取下父亲的剑","eff":{"fame":6,"neili":6,"note":"名望 +6 · 内力 +6","items":["父亲的剑"]},"next":"ch9_talk"}]},"ch9_memorial":{"title":"第九章 · 祭","art":"w_sc_grave","text":["教众们要给死在雁门的人做一场祭。","没有道士，没有和尚，只有四十个人跪在地上，一人手里捧一碗清水。","掌灯婆婆在最前头，念了四十七个名字——那是她当年点的灯。念完，她把水泼在地上。","四十碗水泼出去，地上湿了一片。","“这样，他们就知道有人记得了。”她说。"],"choices":[{"text":"把父亲的名字也念出来","eff":{"karma":12,"fame":6,"note":"善恶 +12 · 名望 +6"},"next":"ch9_token"},{"text":"跪下，把水泼了","eff":{"karma":8,"hp":8,"note":"善恶 +8 · 气血 +8"},"next":"ch9_token"},{"text":"站着看，一句话没说","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch9_token"}]},"ch17_ride":{"title":"第十七章 · 北行","art":"w_sc_mountain_pass","text":["往雁门去的路，你走过两回。","这一回没有追兵，也没有急事。你走得很慢，晚上投店，白天赶路，遇到卖热汤的就停下来喝一碗。","路过最后一个驿站时，驿丞认出你，非要留你住一晚。","“您是去雁门？”他问。","“是。”","“那儿的碑，去年就立起来了。”他说，“小是小了点，可字刻得深。”"],"choices":[{"text":"“刻的什么字？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"ch17_start"},{"text":"谢过他，第二天一早上路","eff":{"hp":10,"note":"气血 +10"},"next":"ch17_start"},{"text":"在他那儿多住一天，听听北边的事","eff":{"wuxing":6,"money":20,"note":"银两 +20"},"next":"ch17_start"}]},"ch17_wall":{"title":"第十七章 · 碑前","art":"w_sc_grave","text":["碑前摆着的不只是干花。","有新烧的纸钱，有一双旧布鞋，有一壶没开封的酒。还有一张纸，被石头压着，纸上歪歪扭扭写着几个字：","“爹，我来看你了。”","你把纸拿起来看，又放回去，压好。","风从关外吹进来，把纸吹得哗哗响。"],"choices":[{"text":"在碑前坐一会儿","eff":{"karma":10,"hp":10,"note":"善恶 +10 · 气血 +10"},"next":"ch17_stone"},{"text":"把那张纸收好，带回去","eff":{"karma":6,"wuxing":8,"note":"悟性 +8","items":["孩子留的字"]},"next":"ch17_stone"},{"text":"把酒坛打开，倒一碗在碑前","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"ch17_stone"}]},"ch17_veterans":{"title":"第十七章 · 老兵夜话","art":"w_sc_battlefield","text":["夜里，几个老兵围着火坐。","“当年我从这儿走的时候，是个千总。”一个姓何的说，“我带出去一百七十个人，回来十九个。”","“那十九个后来怎么样？”","“死了十六个。”他把手伸到火边烤，“一个病死，一个投了水，剩下的……不知道。没人记。”","他抬起头：“所以这碑立得好。立了，就有人知道我们不是白死的。”"],"choices":[{"text":"“你们不是白死的。”","eff":{"karma":12,"fame":6,"note":"善恶 +12 · 名望 +6"},"next":"ch17_after"},{"text":"给他们倒酒，一人一碗","eff":{"karma":10,"hp":8,"note":"善恶 +10 · 气血 +8"},"next":"ch17_after"},{"text":"问他还记不记得那些人的名字","eff":{"wuxing":10,"note":"悟性 +10","items":["老兵名册"]},"next":"ch17_after"}]},"ch17_morning":{"title":"第十七章 · 走的时候","art":"w_loc_yanmen","text":["你在雁门住了七天。","第七天早上，你把营里塌的几间屋子修好了，把碑周围的雪扫了，把哑巴石匠留下的凿子收进箱子里。","临走的时候，那几个老兵站在营门口送你。谁也没说话。","走了很远，你回头看了一眼。他们还在那儿站着，像几根插在雪里的桩子。"],"choices":[{"text":"回头朝他们拱了拱手","eff":{"fame":6,"karma":8,"note":"名望 +6 · 善恶 +8"},"next":"ch18_start"},{"text":"不回头，往前走","eff":{"wuxing":8,"hp":8,"note":"悟性 +8 · 气血 +8"},"next":"ch18_start"},{"text":"跑回去，再陪他们喝一顿","eff":{"karma":10,"hp":10,"note":"善恶 +10 · 气血 +10"},"next":"ch18_start"}]},"sect_shaolin_day":{"title":"门派日常 · 少林","art":"w_sect_shaolin","text":["少林的日子是从钟声开始的。","四更起来挑水，五更上早课，七更（也就是辰时）去木人巷外站着看。","木人巷的规矩是：站着看三个月，才许进去。你看的那些人，有的已经在巷里走了半年，出来时就换了一个人。","管巷的老僧问你：“你在看什么？”","“看他们怎么过第十八关。”","“第十八关没有关。”他说，“难的是你自己心里那道。”"],"choices":[{"text":"“那我心里那道，怎么过？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"sect_shaolin_day2"},{"text":"继续站着看","eff":{"neili":6,"hp":4,"note":"内力 +6"},"next":"sect_shaolin_day2"},{"text":"问老僧：您当年过了没有","eff":{"karma":4,"wuxing":6,"note":"悟性 +6"},"next":"sect_shaolin_day2"}]},"sect_shaolin_day2":{"title":"门派日常 · 木人巷","art":"w_sect_shaolin","text":["第七十二天，你进巷了。","木人是死物，但摆得极刁，一根横木从斜里扫出来，专挑你收势的空档。","前十八关不难，到第二十关时，你被一记横木扫中腰侧，疼得跪下去。","身后传来老僧的声音：“疼，说明还活着。爬起来。”","你爬起来，接着走。"],"choices":[{"text":"一步一步，走完剩下的十六关","eff":{"hp":-20,"neili":14,"fame":6,"note":"气血 -20 · 内力 +14 · 名望 +6"},"next":"sect_shaolin_feud"},{"text":"退回入口，明日再来","eff":{"wuxing":8,"hp":8,"note":"悟性 +8"},"next":"sect_after"},{"text":"索性闭着眼往前走","eff":{"wuxing":12,"neili":8,"hp":-12,"note":"悟性 +12 · 内力 +8"},"next":"sect_after"}]},"sect_wudang_day":{"title":"门派日常 · 武当","art":"w_sect_wudang","text":["武当的日子是从扫地开始的。","丹房的院子里有三棵老松，松针落一年，扫一年，天天扫，天天落。","道士姓李，管着丹房，早上扫完地就坐在蒲团上闭眼，一闭就是一整天。","“你说，扫地有什么道理？”他忽然问。","“扫了还会落。”","“对。”他点头，“所以你扫的不是地。”"],"choices":[{"text":"“那扫的是什么？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"sect_wudang_day2"},{"text":"继续扫，不说话","eff":{"neili":8,"wxu":0,"note":"内力 +8"},"next":"sect_wudang_day2"},{"text":"在松树下坐一天","eff":{"wuxing":8,"hp":10,"note":"悟性 +8 · 气血 +10"},"next":"sect_wudang_day2"}]},"sect_wudang_day2":{"title":"门派日常 · 炼丹","art":"w_sect_wudang","text":["丹房里有七个炉子，只有一个在用。","“为什么只烧一个？”","“因为一个就够了。”道士往炉里添了一块松木，“丹这东西，急不得。急出来的不是丹，是毒。”","炉火映在他脸上，很静。","“你也一样。”他忽然说，“你身上那股急气，再烧下去，早晚把自己炼成一炉毒。”"],"choices":[{"text":"“那我该怎么办？”","eff":{"wuxing":12,"note":"悟性 +12"},"next":"sect_wudang_feud"},{"text":"在炉边坐着，看一夜火","eff":{"neili":10,"hp":8,"note":"内力 +10 · 气血 +8"},"next":"sect_after"},{"text":"帮他添柴","eff":{"karma":6,"neili":6,"note":"善恶 +6 · 内力 +6"},"next":"sect_after"}]},"sect_emei_day":{"title":"门派日常 · 峨眉","art":"w_sect_emei","text":["峨眉的清晨有雾。","师太让你在潭边站桩，一站两个时辰，脚底下是青石，石面上有前人站出来的浅坑。","“剑在哪？”她问。","“在水里。”","“水里的剑，是死的。”她摇头，“你再想。”","你在潭边站了七天，第七天，一只白鹤从潭面掠过，翅膀扇起的水花落回水面。你忽然明白了。"],"choices":[{"text":"“剑在动与不动之间。”","eff":{"wuxing":12,"neili":6,"note":"悟性 +12 · 内力 +6"},"next":"sect_emei_feud"},{"text":"“剑在看着它的人眼里。”","eff":{"wuxing":10,"karma":4,"note":"悟性 +10 · 善恶 +4"},"next":"sect_after"},{"text":"不确定，继续站","eff":{"hp":-6,"neili":10,"note":"内力 +10"},"next":"sect_after"}]},"sect_blood_day":{"title":"门派日常 · 血刀门","art":"w_sect_blood","text":["血刀门的日常，是练刀，也是看人练刀。","演武场上两个人对砍，刀是真的，血也是真的。赢的人晚上有肉吃，输的人去挑水。","“为什么不用木刀？”","“木刀练不出手。”带你的师兄说，“你手上有过别人的血，才知道什么时候该收。”","他抬起自己的手给你看，虎口有一道很深的疤：“这是我还债的地方。”"],"choices":[{"text":"“债是什么？”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"sect_after"},{"text":"“那你收得住么？”","eff":{"wuxing":10,"karma":4,"note":"悟性 +10 · 善恶 +4"},"next":"sect_after"},{"text":"下场，和人真打一场","eff":{"hp":-18,"neili":10,"fame":8,"note":"气血 -18 · 内力 +10 · 名望 +8"},"next":"sect_blood_feud"}]},"romance_4":{"title":"情 · 旧事","art":"w_heroine","text":["苏凝的旧事，是在洛阳那间小铺里说的。","“我娘是教里的人。”她一边擦药柜一边说，“她死那年我七岁，我爹背着我走了三天三夜，走到玄阴教。”","“他为什么要带你入教？”","“因为外面没有别的地方收我们。”她顿了一下，“这世上的路，不是每个人都有得选。”","她把手中的药瓶放好：“你知道我为什么帮你就走了么？”","“为什么？”","“因为你让我想起，路是可以自己走的。”"],"choices":[{"text":"“那以后的路，一起走。”","eff":{"karma":12,"hp":10,"note":"善恶 +12 · 气血 +10","flags":{"stay_with_su":true}},"next":"romance_5"},{"text":"什么也不说，帮她把药瓶摆好","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"romance_5"},{"text":"“我的路，可能是死路。”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"romance_5"}]},"romance_5":{"title":"情 · 断桥","art":"w_loc_luoyang","text":["洛阳的断桥修好了一半，另一半还断着。","你们坐在修好的那一半上，看桥下的人来船往。","“你说，这桥为什么会断？”她问。","“年久失修。”","“我觉得是被人踩断的。”她把手伸到风里，“人太多了，又都急着过。”","你笑了一下。她也笑，笑得很轻。"],"choices":[{"text":"“那我们慢慢过。”","eff":{"karma":10,"hp":12,"note":"善恶 +10 · 气血 +12","flags":{"romance":3}},"next":"romance_6"},{"text":"把手伸过去，握住她的","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"romance_6"},{"text":"什么也没做，看夕阳","eff":{"hp":8,"wuxing":8,"note":"悟性 +8"},"next":"romance_6"}]},"romance_6":{"title":"情 · 一封信","art":"w_heroine","text":["后来，她给你写了一封信。","信很短，只有几行：“铺子还开着。药还有。灯我每晚都点着。”","最后一行是：“你什么时候回来，都行。”","你把信折好，放进怀里，和父亲的遗信放在一起。","两张纸贴在一起，一张很旧，一张很新。"],"choices":[{"text":"当日就动身回洛阳","eff":{"karma":12,"hp":20,"note":"善恶 +12 · 气血 +20","flags":{"returned_su":true}},"next":"ch18_start"},{"text":"先把手上的事办完，再回去","eff":{"wuxing":10,"fame":6,"note":"悟性 +10 · 名望 +6"},"next":"ch18_start"},{"text":"把信收进箱子最底下","eff":{"wuxing":8,"karma":-4,"note":"悟性 +8 · 善恶 -4"},"next":"ch18_start"}]},"manual_3":{"title":"秘 · 三卷","art":"w_sc_forest_path","text":["三卷东西摊在桌上：残帛心法、太极剑理、心剑诀。","字句互有出入，但翻到第三卷最后一页时，你发现一行极小的注：","“三卷同源，出自雁门守令营夜课。”","原来这不是谁家的绝学，是三千个兵在营里自己琢磨出来的东西。","你忽然明白，师父为什么把它藏在剑鞘里。"],"choices":[{"text":"把这句话补在抄本上","eff":{"wuxing":12,"karma":8,"note":"悟性 +12 · 善恶 +8","items":["雁门夜课抄本"]},"next":"ch4_final"},{"text":"把三卷合抄一遍，留给后人","eff":{"wuxing":10,"fame":8,"note":"悟性 +10 · 名望 +8"},"next":"ch4_final"},{"text":"把三卷还回雁门","eff":{"karma":14,"wuxing":6,"note":"善恶 +14 · 悟性 +6"},"next":"ch4_final"}]},"merchant_3":{"title":"商 · 船队","art":"w_sc_river_dock","text":["你的船队从三只变成了九只。","码头上的人开始叫你“沈东家”。你去码头，脚夫们会停下手里的活，朝你点头。","有个老船工跟你说：“东家，您这船队，跟我们不一样。”","“哪里不一样？”","“您不压价。”他咧嘴笑，“这年头，不压价的东家，比金子还稀罕。”"],"choices":[{"text":"“钱挣得够就行。”","eff":{"karma":10,"fame":8,"note":"善恶 +10 · 名望 +8"},"next":"merchant_4"},{"text":"给所有船工加一成工钱","eff":{"money":-100,"karma":14,"fame":10,"note":"善恶 +14 · 名望 +10"},"next":"merchant_4"},{"text":"“压价是规矩。”","eff":{"karma":-8,"money":150,"note":"善恶 -8 · 银两 +150"},"next":"merchant_4"}]},"merchant_4":{"title":"商 · 一封信","art":"w_sc_market","text":["商会送来一封信，请你出任会首。","信里写得很客气，说是\"众望所归\"。附了一张单子，列着会首要办的事：调停纠纷、平抑粮价、替船户出头。","最后一页写着：\"会首每年可支配漕银三万两。\"","你把信放在桌上，看了很久。"],"choices":[{"text":"接下会首之位","eff":{"fame":16,"money":300,"karma":4,"note":"名望 +16 · 银两 +300","flags":{"merchant":true}},"next":"ch4_final"},{"text":"推掉，只做自己的买卖","eff":{"karma":6,"money":100,"note":"善恶 +6 · 银两 +100"},"next":"ch4_final"},{"text":"把三万两的事说出去","eff":{"fame":20,"karma":10,"money":-50,"note":"名望 +20 · 善恶 +10"},"next":"ch4_final"}]},"daily_forge_visit":{"title":"日常 · 看人打铁","art":"w_sc_market","text":["铁匠铺的炉子整天不熄。","老铁匠打一把刀要三天，第一天打形，第二天开刃，第三天回火。","“人家一天打十把，你三天打一把。”","“他们打的是铁，我打的是刀。”他头也不抬，锤子落下去，火星四溅。","你站在门口看了很久，觉得那节奏像是某种别的东西。"],"choices":[{"text":"问他：这节奏是从哪学的","eff":{"wuxing":10,"note":"悟性 +10"},"next":"free_roam"},{"text":"花 50 两，请他打一把","eff":{"money":-50,"neili":6,"note":"内力 +6","items":["手打 steel 刀"]},"next":"free_roam"},{"text":"帮他把炉边的煤递过去","eff":{"karma":6,"hp":6,"note":"善恶 +6 · 气血 +6"},"next":"free_roam"}]},"daily_monk_chat":{"title":"日常 · 与僧闲话","art":"w_monk","text":["庙里的老僧在补一件旧僧衣。针脚很密，一看就是补了几十年。","“补了还破。”","“破了再补。”他把针在头皮上蹭了蹭，“人这一辈子，做的都是这种活。”","“不烦么？”","“烦。”他说，“烦也得补。总不能光着。”"],"choices":[{"text":"陪他补一会儿","eff":{"karma":8,"hp":8,"note":"善恶 +8 · 气血 +8"},"next":"free_roam"},{"text":"问他：补了这些年，补出什么道理没有","eff":{"wuxing":10,"note":"悟性 +10"},"next":"free_roam"},{"text":"给他留点米面","eff":{"money":-10,"karma":10,"note":"善恶 +10"},"next":"free_roam"}]},"daily_shaolin_court":{"title":"少林 · 禅房","art":"w_sect_shaolin","text":["禅房里只有一张矮榻、一只蒲团、一炉香。","老僧在打坐，你坐在门口，听他呼吸。那呼吸很轻，几乎听不见，但极稳。","过了很久，他睁眼：“你听出什么了？”","“什么都没听见。”","“那就对了。”他笑，“听不见自己，才听得见别人。”","香烧到了头，灰落下来，一点声音都没有。"],"choices":[{"text":"“怎么样才能听不见自己？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"free_roam"},{"text":"陪他再坐一炷香","eff":{"neili":6,"hp":8,"note":"内力 +6 · 气血 +8"},"next":"free_roam"},{"text":"悄悄退出去，不打扰","eff":{"karma":6,"note":"善恶 +6"},"next":"free_roam"}]},"daily_wudang_pill":{"title":"武当 · 丹房","art":"w_sect_wudang","text":["丹房的七个炉子，只有最东边那只还烧着。","道士说这一炉已经烧了四十九天，还差七天。","“炼什么？”","“炼一味不成的药。”他把炉盖打开一条缝，白气冒出来，“成了就没意思了。炼不成，才天天有盼头。”","“这不亏么？”","“亏。”他把盖子盖回去，“可人有盼头，就不亏。”"],"choices":[{"text":"帮他看火","eff":{"neili":8,"hp":4,"note":"内力 +8"},"next":"free_roam"},{"text":"问他：这药到底是什么","eff":{"wuxing":10,"note":"悟性 +10"},"next":"free_roam"},{"text":"在丹房里坐一会儿","eff":{"wuxing":6,"hp":10,"note":"气血 +10"},"next":"free_roam"}]},"daily_emei_pond":{"title":"峨眉 · 剑潭","art":"w_sect_emei","text":["剑潭的水很清，看得见底。","潭底沉着许多剑，有的是弟子失手掉下去的，有的是人死了以后被同伴扔下去的。","师太站在潭边：“你看这些剑，都锈了。”","“锈了还能用么？”","“不能。”她把手伸进水里，捞起一把，看了看又放回去，“但它们还在。在，就说明有人来过。”"],"choices":[{"text":"也把手伸进潭水里","eff":{"hp":-4,"wuxing":10,"note":"悟性 +10"},"next":"free_roam"},{"text":"问她：那些剑的主人，你都记得么","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"free_roam"},{"text":"在潭边坐到日落","eff":{"hp":10,"wuxing":6,"note":"气血 +10"},"next":"free_roam"}]},"daily_bloodgate_tomb":{"title":"血刀门 · 刀冢","art":"w_sect_blood","text":["刀冢在后山，风从崖口灌进来，呜呜地响。","一把把断刀插在土里，刀柄上刻着名字。有的名字被划掉了，有的加了一圈。","“划掉的是什么？”","“叛门的。”铁匠蹲下去，把一把歪了的刀扶正，“加圈的，是替门里死在外头的。”","“替门里死在外头，也算忠诚？”","“不算。”他站起来，“但总得有人记。”"],"choices":[{"text":"找一把刻着“沈”字的刀看看","eff":{"wuxing":10,"note":"悟性 +10"},"next":"free_roam"},{"text":"帮他把歪掉的刀都扶正","eff":{"karma":8,"hp":6,"note":"善恶 +8 · 气血 +6"},"next":"free_roam"},{"text":"问他：你自己的刀在哪","eff":{"wuxing":6,"karma":4,"note":"悟性 +6 · 善恶 +4"},"next":"free_roam"}]},"daily_mangshan_hut":{"title":"邙山 · 猎户家","art":"w_loc_mangshan","text":["山腰有一户猎户，土墙茅顶，门口挂着几张晒干的皮子。","猎人姓赵，四十来岁，话不多。他给你倒了一碗热水，水里漂着几片树叶。","“这山里，最近不安生。”他说，“夜里能听见马蹄。”","“什么人？”","“不知道。”他往火里添了根柴，“穿黑衣，蒙着脸。他们不进村，只在山道上过。”","火光照着他半张脸，另外半张在暗处。"],"choices":[{"text":"“他们往哪个方向去？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"free_roam"},{"text":"给他一些银两，换宿一晚","eff":{"money":-15,"hp":20,"note":"气血 +20"},"next":"free_roam"},{"text":"帮他劈柴","eff":{"karma":6,"hp":8,"note":"善恶 +6 · 气血 +8"},"next":"free_roam"}]},"daily_yanmen_vet":{"title":"雁门 · 关下人家","art":"w_loc_yanmen","text":["关下有一排土房，住的都是守关兵的家眷。","一个妇人正在门口晒咸菜，看见你，先问：“你是从关里来的？”","“算是。”","“我男人在关上。”她把咸菜翻了个面，“三个月回来一趟。回来就睡，睡醒了又走。”","“你不怨么？”","“怨什么。”她笑了一下，“他守关，我守家。都是一样的。”"],"choices":[{"text":"帮她把咸菜搬进去","eff":{"karma":8,"hp":6,"note":"善恶 +8 · 气血 +6"},"next":"free_roam"},{"text":"问她关上的日子苦不苦","eff":{"wuxing":8,"note":"悟性 +8"},"next":"free_roam"},{"text":"给她留一些银两","eff":{"money":-20,"karma":10,"note":"善恶 +10"},"next":"free_roam"}]},"daily_swordtomb_smith":{"title":"剑冢 · 铸剑人","art":"w_loc_swordtomb","text":["铸剑人的作坊在剑冢边上，一炉、一砧、一桶水。","“你铸剑，为什么自己不用？”","“铸剑的人不能用剑。”他敲着一块烧红的铁，“用一次，就舍不得了。舍不得，就打不好下一把。”","“那你打过最好的剑，是哪一把？”","“下一把。”他头也不抬。","铁在砧上响，一声一声，像是有人在很远的地方敲钟。"],"choices":[{"text":"请他打一把剑","eff":{"money":-80,"neili":8,"note":"银两 -80 · 内力 +8","items":["铸剑人的剑"]},"next":"free_roam"},{"text":"帮他拉风箱","eff":{"karma":6,"hp":6,"note":"善恶 +6 · 气血 +6"},"next":"free_roam"},{"text":"问他：这把剑要打多久","eff":{"wuxing":8,"note":"悟性 +8"},"next":"free_roam"}]},"sect_shaolin_feud":{"title":"门派事件 · 少林","art":"w_sect_shaolin","text":["少林也分派。","一脉主张闭门清修，一脉主张入世平乱。前者年老，后者年轻；前者掌着藏经阁，后者掌着罗汉堂。","“他们吵了三年。”管巷的老僧说，“吵到后来，连早课都要分两堂做。”","“你站哪边？”","“我扫地。”他笑，“扫地的时候，两边都得绕着我走。”","这几天寺里气氛不对，罗汉堂的人夜里在演武场加练，藏经阁的人把阁门上了三道锁。"],"choices":[{"text":"去问问方丈的意思","eff":{"wuxing":10,"note":"悟性 +10"},"next":"sect_shaolin_feud2"},{"text":"去罗汉堂看看他们练什么","eff":{"wuxing":6,"hp":-6,"note":"气血 -6"},"next":"sect_shaolin_feud2"},{"text":"站在两边都不管的角落","eff":{"wuxing":4,"karma":4,"note":"悟性 +4 · 善恶 +4"},"next":"sect_shaolin_feud2"}]},"sect_shaolin_feud2":{"title":"门派事件 · 分斋","art":"w_sect_shaolin","text":["事情闹到分斋。","早课的时候，罗汉堂的人没有来。方丈站在阶上，等了半炷香，然后自己敲了钟。","钟声一响，藏经阁的老僧们先动了，罗汉堂的人从廊下走出来，一个接一个进了殿。","没有人说话，也没有人看对方。","那天早课，念的是同一部经，声音却分成了两股。"],"choices":[{"text":"站在殿中间，跟着念","eff":{"neili":8,"karma":8,"note":"内力 +8 · 善恶 +8"},"next":"sect_after"},{"text":"退出去，不参与","eff":{"wuxing":8,"note":"悟性 +8"},"next":"sect_after"},{"text":"晚课后去找方丈，说几句实话","eff":{"wuxing":12,"fame":4,"note":"悟性 +12 · 名望 +4"},"next":"sect_after"}]},"sect_wudang_feud":{"title":"门派事件 · 武当","art":"w_sect_wudang","text":["武当的分歧，写在丹房的书架上。","一半的书讲\"守一\"，一半的书讲\"应变\"。守一的人说，山中就该清静；应变的人说，山中清静是因为有人在挡风。","道士把两摞书挪开，让它们离得远一点。","“你还小的时候，我师父也这么吵。”他说，“吵了三十年，吵到最后一死一伤，才算完。”","“那这一次呢？”","“这一次，看谁先忍不住。”"],"choices":[{"text":"“你站哪边？”","eff":{"wuxing":10,"note":"悟性 +10"},"next":"sect_wudang_feud2"},{"text":"把两摞书重新摆到一起","eff":{"karma":8,"wuxing":6,"note":"善恶 +8 · 悟性 +6"},"next":"sect_wudang_feud2"},{"text":"问他：清静和挡风，能不能都要","eff":{"wuxing":12,"note":"悟性 +12"},"next":"sect_wudang_feud2"}]},"sect_wudang_feud2":{"title":"门派事件 · 两股剑","art":"w_sect_wudang","text":["演武场上，两脉弟子对练，用的都是真剑。","守一的一脉，剑慢而稳；应变的一脉，剑快而险。三招之内分不出高下，十招之后，快的开始急，慢的也开始急。","教习喝止，没人听。","剑光撞在一起，火星迸出来，落在青石上。","你站在场边，忽然想起父亲在雁门那句\"带人走\"——两股人，都想保住这座山，只是方法不同。"],"choices":[{"text":"下场，把两把剑挑开","eff":{"neili":8,"fame":8,"hp":-10,"note":"内力 +8 · 名望 +8 · 气血 -10"},"next":"sect_after"},{"text":"喝一声，让他们停","eff":{"fame":6,"wuxing":6,"note":"名望 +6 · 悟性 +6"},"next":"sect_after"},{"text":"什么也不做，看着他们打完","eff":{"wuxing":10,"note":"悟性 +10"},"next":"sect_after"}]},"sect_emei_feud":{"title":"门派事件 · 峨眉","art":"w_sect_emei","text":["峨眉的争执，是从一封信开始的。","宫里送来一封信，请峨眉派人下山，去替朝廷\"看住\"六派之一。","师太把信放在香案上，没有拆。","“接了，我们就成了朝廷的刀。”一位师姐说。","“不接，朝廷就换别人。”另一位说，“别人去了，我们这山门还能清静么？”","香烧到一半，师太还是没拆那封信。"],"choices":[{"text":"“拆开看看吧。”","eff":{"wuxing":8,"note":"悟性 +8"},"next":"sect_emei_feud2"},{"text":"“不接。”","eff":{"karma":10,"fame":6,"note":"善恶 +10 · 名望 +6"},"next":"sect_emei_feud2"},{"text":"“接了，也让去的人自己看情况。”","eff":{"wuxing":12,"karma":4,"note":"悟性 +12 · 善恶 +4"},"next":"sect_emei_feud2"}]},"sect_emei_feud2":{"title":"门派事件 · 香案","art":"w_sect_emei","text":["最后，师太把信烧了。","烧的时候她一句话没说。灰落在香案上，她拿拂尘轻轻扫掉。","“不接？”师姐问。","“不接。”她说，“峨眉这几十年，靠的是剑，不是靠谁的印。”","屋里静了很久。有人松了一口气，也有人在暗处咬牙。"],"choices":[{"text":"向师太行一礼","eff":{"karma":10,"fame":4,"note":"善恶 +10 · 名望 +4"},"next":"sect_after"},{"text":"问师太：烧了信，朝廷会不会来","eff":{"wuxing":10,"note":"悟性 +10"},"next":"sect_after"},{"text":"记住那个在暗处咬牙的人","eff":{"wuxing":8,"note":"悟性 +8"},"next":"sect_after"}]},"sect_blood_feud":{"title":"门派事件 · 血刀门","art":"w_sect_blood","text":["血刀门的门主之争，从来不用嘴。","二门主死后，门里空出位置。按规矩，谁能连赢七场，谁坐那个位置。","演武场上排开了队。有人赢了五场，第六场被人砍断手；有人打穿了三把刀，还站着。","铁匠蹲在场边：\"咱们这门，换主的时候不流血，那才叫怪事。\""],"choices":[{"text":"问他：你想上去打么","eff":{"wuxing":8,"note":"悟性 +8"},"next":"sect_blood_feud2"},{"text":"下场试试","eff":{"hp":-20,"fame":10,"neili":8,"note":"气血 -20 · 名望 +10 · 内力 +8"},"next":"sect_blood_feud2"},{"text":"看着，把人一个个记下来","eff":{"wuxing":10,"note":"悟性 +10"},"next":"sect_blood_feud2"}]},"sect_blood_feud2":{"title":"门派事件 · 第七场","art":"w_sect_blood","text":["第七场打到最后，场上只剩两个人。","一个是那个断手的年轻人，另一个是个瘸腿的老弟子。两个人都站不稳了，刀也卷了刃。","“别打了。”有人喊。","没人听。","最后一刀，年轻人赢了。他站在场中央，血从额头流到下巴，忽然把刀扔了：\"这门，我不坐了。\"","说完，他走下台，走出了山门。没有人拦他。"],"choices":[{"text":"追出去看看","eff":{"wuxing":10,"hp":-6,"note":"悟性 +10 · 气血 -6"},"next":"sect_after"},{"text":"留在台上，看剩下的人怎么办","eff":{"wuxing":8,"fame":4,"note":"悟性 +8 · 名望 +4"},"next":"sect_after"},{"text":"让铁匠把那把刀收好","eff":{"karma":6,"wuxing":6,"note":"善恶 +6 · 悟性 +6"},"next":"sect_after"}]}},"jobs":{"swordsman":{"name":"剑客","desc":"招式轻灵，出手快，内力消耗低","atk":1.15,"hp":1,"nei":1,"skill":"疾风三连"},"blade":{"name":"刀客","desc":"大开大合，攻高血厚","atk":1.3,"hp":1.15,"nei":0.9,"skill":"裂山斩"},"fist":{"name":"拳师","desc":"外家硬功，防御极高","atk":0.95,"hp":1.35,"nei":1.1,"skill":"崩山拳"},"poison":{"name":"毒师","desc":"以毒攻心，附带持续伤害","atk":1.05,"hp":0.9,"nei":1.15,"skill":"七草散"},"assassin":{"name":"刺客","desc":"身法极快，暴击率高","atk":1.25,"hp":0.85,"nei":1,"skill":"影袭"},"monk":{"name":"僧人","desc":"内力深厚，可自愈","atk":1,"hp":1.2,"nei":1.3,"skill":"金刚掌"}},"arts":{"basic_sword":{"name":"基础剑法","job":"swordsman","mult":1.8,"cost":10,"desc":"一剑直取咽喉"},"liemei":{"name":"裂山斩","job":"blade","mult":2.2,"cost":14,"desc":"刀势如裂山"},"bengshan":{"name":"崩山拳","job":"fist","mult":1.9,"cost":12,"desc":"拳出如山崩"},"qicao":{"name":"七草散","job":"poison","mult":1.6,"cost":10,"desc":"以毒伤敌，气血持续流失"},"yingxi":{"name":"影袭","job":"assassin","mult":2.4,"cost":14,"desc":"从影中出手"},"jingang":{"name":"金刚掌","job":"monk","mult":1.7,"cost":12,"desc":"掌风沉猛"},"taiji":{"name":"太极剑理","job":"swordsman","mult":2,"cost":12,"desc":"以柔克刚，后发先至","need":"太极剑理"},"xinjian":{"name":"心剑诀","job":"swordsman","mult":2.3,"cost":16,"desc":"剑在心中，念动即至","need":"心剑诀"},"xuedao":{"name":"血刀刀法","job":"blade","mult":2.6,"cost":18,"desc":"伤人先伤己","need":"血刀"},"shenshi":{"name":"沈氏剑谱","job":"swordsman","mult":2.5,"cost":18,"desc":"师门最后一剑","need":"沈氏剑谱"}},"minds":{"hunyuan":{"name":"混元功","desc":"内力上限与恢复提升","hpMax":30,"atk":1,"need":null},"ziyang":{"name":"紫阳心法","desc":"气血精纯，攻击更稳","hpMax":60,"atk":1.1,"need":"残帛心法"},"taiji_m":{"name":"太极心法","desc":"以柔化力，减伤","hpMax":40,"atk":1.05,"need":"太极剑理"},"moqi":{"name":"魔气诀","desc":"攻击暴涨，反噬气血","hpMax":-30,"atk":1.35,"need":"魔气"}}};
const STORY=DATA.story, JOBS=DATA.jobs, ARTS=DATA.arts, MINDS=DATA.minds;
const SAVEKEY='wuxia_offline_v1';
function fresh(){return{scene:'birth_start',attrs:{hp:120,neili:24,wuxing:10,fame:0,money:40,karma:0},
  items:[],flags:{},job:'swordsman',artKey:'basic_sword',mind:'hunyuan',log:[],choices:0};}
let S=JSON.parse(localStorage.getItem(SAVEKEY)||'null')||fresh();
const $=id=>document.getElementById(id);
function condOk(c){
  if(!c) return true;
  for(const k of ['hp','neili','wuxing','fame','money','karma']) if(typeof c[k]==='number'&&S.attrs[k]<c[k]) return false;
  if(c.items&&c.items.some(i=>!S.items.includes(i))) return false;
  if(c.flags&&Object.keys(c.flags).some(f=>S.flags[f]!==c.flags[f])) return false;
  if(c.notItem&&S.items.includes(c.notItem)) return false;
  return true;
}
function applyEff(e){
  if(!e) return[];
  const out=[];
  const N={hp:'气血',neili:'内力',wuxing:'悟性',fame:'名望',money:'银两',karma:'善恶'};
  for(const k in N) if(typeof e[k]==='number'&&e[k]){ S.attrs[k]+=e[k]; if(k==='hp') S.attrs.hp=Math.max(1,Math.min(1999,S.attrs.hp)); out.push(N[k]+(e[k]>0?' +':' ')+e[k]); }
  if(e.items) e.items.forEach(i=>{ if(!S.items.includes(i)) S.items.push(i); out.push('得「'+i+'」'); });
  if(e.flags) Object.assign(S.flags,e.flags);
  return out;
}
function battle(g){
  const atk=8+S.attrs.neili*0.9+S.attrs.wuxing*0.4;
  const k=1+(S.attrs.neili||0)/1500;
  const myHp=Math.round(S.attrs.hp*(1+(S.attrs.neili||0)/1200));
  const foeHp=g.hp||80, foeAtk=g.atk||14;
  const myDps=atk*k, foeDps=foeAtk*(0.78+Math.min(8,Math.floor((S.attrs.neili||20)/12))*0.07);
  const rounds=Math.ceil(foeHp/myDps), take=Math.round(rounds*foeDps*0.45);
  S.attrs.hp=Math.max(1,S.attrs.hp-take);
  const win = S.attrs.hp>take*0.15 && rounds<=6 || Math.random()<0.75-rounds*0.05;
  if(win){ S.attrs.hp=Math.min(1999,S.attrs.hp+Math.round(S.attrs.hp*0.25)); return {win:true,log:'⚔ 与 '+(g.name||'对手')+'交手 '+rounds+' 回合，你胜了（气血 -'+take+'）'}; }
  S.attrs.hp=Math.max(20,Math.round(S.attrs.hp*0.5));
  return {win:false,log:'⚔ 你不敌 '+(g.name||'对手')+'，败退（气血 -'+take+'）'};
}
function render(){
  const sc=STORY[S.scene]||{title:'终章',text:['此局已了。']};
  $('seal').textContent=(S.flags.nick||'侠').slice(0,1);
  $('who').textContent=S.flags.nick||'无名侠客';
  const J=JOBS[S.job]||{}, A=ARTS[S.artKey]||{}, M=MINDS[S.mind]||{};
  $('sub').textContent='离线版 · '+(J.name||'')+' · '+(M.name||'');
  const N={hp:'气血',neili:'内力',wuxing:'悟性',fame:'名望',money:'银两',karma:'善恶'};
  $('stats').innerHTML=Object.keys(N).map(k=>'<div><i>'+N[k]+'</i><b>'+S.attrs[k]+'</b></div>').join('');
  $('title').textContent=sc.title||'';
  $('text').innerHTML=(sc.text||[]).map(t=>'<p>'+t+'</p>').join('');
  const chs=(sc.choices||[]).map((c,i)=>({c,i})).filter(x=>condOk(x.c.cond));
  const locked=(sc.choices||[]).map((c,i)=>({c,i})).filter(x=>!condOk(x.c.cond));
  $('choices').innerHTML=chs.map(x=>'<button class="ch" data-i="'+x.i+'">'+x.c.text+'</button>').join('')
    +locked.map(x=>'<button class="ch" disabled style="opacity:.35">'+x.c.text+'<small>条件不足</small></button>').join('');
  $('log').innerHTML=(S.log||[]).slice(-6).map(t=>'<div>· '+t+'</div>').join('');
  if(sc.ending||/^结局/.test(sc.title||'')){ $('over').style.display='flex'; $('overText').textContent=sc.title; }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.ch[data-i]'); if(!b) return;
  const sc=STORY[S.scene]; const c=(sc.choices||[])[Number(b.dataset.i)]; if(!c) return;
  const lines=applyEff(c.eff);
  if(c.battle){ const r=battle(c.battle); lines.push(r.log);
    const nxt=(r.win?c.battle.win:c.battle.lose)||c.next; if(nxt&&STORY[nxt]) S.scene=nxt;
  } else if(c.next&&STORY[c.next]) S.scene=c.next;
  S.choices++; S.log=S.log.concat(lines);
  localStorage.setItem(SAVEKEY,JSON.stringify(S));
  render(); window.scrollTo({top:0,behavior:'smooth'});
});
$('saveBtn').onclick=()=>{ localStorage.setItem(SAVEKEY,JSON.stringify(S));
  const blob=new Blob([JSON.stringify({v:1,player:S})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='jianghu-save.json'; a.click(); };
$('resetBtn').onclick=()=>{ if(!confirm('确定重新开始？当前进度会清空')) return;
  localStorage.removeItem(SAVEKEY); S=fresh(); render(); };
render();
</script>
