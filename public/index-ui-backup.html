<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>江湖行 · 武侠文字模拟器</title>
<style>
:root{
  --ink:#0f1216; --paper:#efe6d2; --paper2:#e3d6ba; --line:#c9b48a;
  --gold:#d4af68; --gold2:#a8842f; --red:#9e2b25; --txt:#2a241a; --dim:#8c7a5c;
  --jade:#4f8f6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Songti SC","Noto Serif CJK SC",serif;color:var(--txt);
  background:
    radial-gradient(120% 60% at 50% 0%,#1b2430 0%,#0f1216 60%,#080a0d 100%) fixed,#0f1216;
  min-height:100vh;max-width:640px;margin:0 auto;padding:0 0 24px;
}
.hidden{display:none!important}
/* 顶部 */
.hdr{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.seal{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font-size:15px;font-weight:900;
  color:#fff5e0;background:linear-gradient(180deg,#b3372f,#7d1f1a);border:1px solid #5c1512;
  box-shadow:0 3px 10px rgba(0,0,0,.5);font-family:system-ui}
.who{flex:1}
.who b{display:block;color:#f2e6cf;font-size:15px;letter-spacing:1px}
.who span{font-size:10.5px;color:#8f9aa8;font-family:system-ui}
.tools{display:flex;gap:6px}
.tbtn{background:rgba(20,26,34,.9);border:1px solid #3b4654;color:#cfd6df;font-size:11px;
  padding:5px 9px;border-radius:8px;font-family:system-ui}
/* 属性 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 14px 10px}
.st{border:1px solid #2b333d;border-radius:9px;padding:5px 6px;background:rgba(16,20,26,.85);text-align:center}
.st b{display:block;font-size:13.5px;color:#e8d9b5;font-family:system-ui}
.st span{font-size:9.5px;color:#7f8b99;font-family:system-ui}
.st.hp b{color:#ff9a8a}.st.ni b{color:#8fd0ff}.st.wu b{color:#c8a6ff}
.st.fa b{color:#ffd479}.st.mo b{color:#ffe08a}.st.ka b{color:#8fe0a8}
.st.ka.neg b{color:#ff8f8f}
/* 插图 */
.illust{position:relative;margin:0 14px 12px;border-radius:12px;overflow:hidden;border:1px solid #3a3226;
  box-shadow:0 10px 26px rgba(0,0,0,.55);aspect-ratio:16/10;background:#0b0d11}
.illust img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.02)}
.illust:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.05) 40%,rgba(8,10,14,.75))}
.illust .cap{position:absolute;left:12px;bottom:10px;z-index:2;font-size:12px;color:#f0e2c4;letter-spacing:1px;text-shadow:0 2px 6px #000}
/* 正文 */
.scene{margin:0 14px}
.title{font-size:17px;letter-spacing:3px;color:#f0dfb8;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.title:before{content:'— ';color:var(--gold2)}
.text{font-size:15px;line-height:1.95;color:#ddd2ba;letter-spacing:.4px}
.text p{margin:0 0 10px;text-indent:2em}
/* 选项 */
.choices{margin:14px 14px 0;display:flex;flex-direction:column;gap:9px}
.ch{position:relative;text-align:left;border:1px solid #4a3d2a;border-radius:10px;padding:12px 14px 12px 34px;
  font-size:14px;line-height:1.6;color:#ecdfc4;background:linear-gradient(180deg,rgba(38,34,26,.95),rgba(20,18,14,.95));
  font-family:"Songti SC",serif;box-shadow:0 3px 12px rgba(0,0,0,.4)}
.ch:before{content:'◆';position:absolute;left:12px;top:12px;font-size:10px;color:var(--gold)}
.ch:active{transform:translateY(1px);border-color:var(--gold)}
.ch small{display:block;color:#9a8a6e;font-size:11px;margin-top:3px;font-family:system-ui}
/* 结局 */
.ending{margin:16px 14px 0;border:1px solid #6b4a2a;border-radius:12px;padding:14px;text-align:center;
  background:linear-gradient(180deg,rgba(60,40,20,.5),rgba(24,16,10,.7))}
.ending .t{font-size:19px;letter-spacing:6px;color:#ffd88a;margin-bottom:8px}
.ending p{font-size:12px;color:#b9a884;margin:0 0 12px;line-height:1.8;font-family:system-ui}
/* 记录 / 登录 */
.sheet{position:fixed;left:0;right:0;bottom:0;top:0;z-index:50;background:rgba(6,8,11,.88);padding:40px 16px 20px;overflow:auto}
.sheet .box{background:linear-gradient(180deg,#1b1a16,#12110e);border:1px solid #4a3d2a;border-radius:14px;padding:16px;max-height:78vh;overflow:auto}
.sheet h3{margin:0 0 10px;color:#e8d9b5;font-size:15px;letter-spacing:2px}
.jrow{font-size:12.5px;line-height:1.8;color:#c3b696;border-bottom:1px dashed #2e2a22;padding:5px 0}
.authwrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px}
.authwrap .logo{text-align:center;margin-bottom:24px}
.authwrap .logo .big{font-size:36px;letter-spacing:12px;color:#f2e2bd;
  text-shadow:0 0 24px rgba(212,175,104,.35),0 2px 0 #000}
.authwrap .logo .en{font-size:10px;letter-spacing:6px;color:#7d8794;margin-top:8px;font-family:system-ui}
.authwrap .card{background:linear-gradient(180deg,#1b1a16,#12110e);border:1px solid #4a3d2a;border-radius:14px;padding:16px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tabs2 .t{text-align:center;padding:8px;border:1px solid #3d3527;border-radius:9px;font-size:13px;color:#9c8f76;font-family:system-ui}
.tabs2 .t.on{color:#f0dfb8;border-color:var(--gold);background:rgba(212,175,104,.1)}
label{display:block;font-size:11px;color:#8f8676;margin:10px 0 4px;font-family:system-ui}
input{width:100%;padding:11px;border-radius:9px;border:1px solid #3d3527;background:#0c0b09;color:#e8dfc9;font-size:15px}
.btn{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:1px solid #6b5222;
  background:linear-gradient(180deg,#e0c07a,#b08a3c);color:#2a1e08;font-size:15px;font-weight:900;letter-spacing:2px}
.btn.dark{background:linear-gradient(180deg,#2a2620,#15130f);color:#d8cbb0;border-color:#4a3d2a}
.err{color:#e0796a;font-size:11.5px;min-height:16px;margin-top:8px;font-family:system-ui}

.mapcard{border:1px solid #4a3d2a;border-radius:11px;overflow:hidden;margin-bottom:10px;background:#12110e}
.mapcard img{width:100%;height:130px;object-fit:cover;display:block;filter:saturate(.95)}
.mapcard .d{padding:9px 11px}
.mapcard b{color:#f0dfb8;font-size:14px;letter-spacing:2px}
.mapcard p{margin:4px 0 0;font-size:11.5px;line-height:1.7;color:#a99a7e;font-family:system-ui}

#noticeBar{margin:0 14px 8px;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.6;
  background:linear-gradient(90deg,rgba(90,20,16,.55),rgba(40,16,10,.35));border:1px solid #6b3a2a;color:#ffd9c4}
#noticeBar b{color:#ffb98a;letter-spacing:1px}
.eventBar{margin:0 14px 8px;padding:7px 11px;border-radius:9px;font-size:11.5px;line-height:1.6;
  background:linear-gradient(90deg,rgba(30,50,40,.6),rgba(16,26,20,.4));border:1px solid #3a5a44;color:#b8e0c4}
#eventBar{margin:0 14px 8px;padding:7px 11px;border-radius:9px;font-size:11.5px;
  background:linear-gradient(90deg,rgba(30,50,40,.6),rgba(16,26,20,.4));border:1px solid #3a5a44;color:#b8e0c4}
.frozenTip{margin:10px 14px 0;padding:10px;border-radius:9px;background:rgba(60,20,20,.4);
  border:1px solid #6b3a2a;color:#ffb0a0;font-size:12.5px;text-align:center}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 14px 0}
.act{padding:9px 2px;border-radius:9px;border:1px solid #3d3527;background:linear-gradient(180deg,#232019,#14120e);
  color:#cbbd9e;font-size:11.5px;font-family:system-ui}
.act:active{border-color:var(--gold)}
.battle{margin:0 14px;border:1px solid #5a3a2a;border-radius:12px;padding:12px;background:linear-gradient(180deg,#1a1512,#0e0c0a)}
.bstage{position:relative;border-radius:10px;overflow:hidden;height:190px;border:1px solid #4a3226;margin-bottom:10px}
.bstage img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:saturate(.9) contrast(1.05)}
.bstage:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,8,6,.9))}
.bname{position:absolute;left:10px;bottom:34px;z-index:2;font-size:14px;color:#ffd8b8;letter-spacing:2px}
.bbar{position:absolute;left:10px;right:10px;bottom:24px;height:8px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid #5a3a2a;overflow:hidden;z-index:2}
.bbar i{display:block;height:100%;background:linear-gradient(90deg,#c8402f,#ff8a6a);transition:width .3s}
.bhp{position:absolute;right:10px;bottom:8px;z-index:2;font-size:10px;color:#e0b8a8;font-family:system-ui}
.blog{font-size:12.5px;line-height:1.8;color:#c8bca6;min-height:64px;max-height:120px;overflow:auto;font-family:system-ui}
.bmoves{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.mv{padding:10px 2px;border-radius:9px;border:1px solid #6b3a2a;background:linear-gradient(180deg,#3a2019,#1c100c);
  color:#ffd8c4;font-size:11.5px;font-family:system-ui}
.mv:active{border-color:#c8402f}

.actions{grid-template-columns:repeat(4,1fr)}
.pick{border:1px solid #4a3d2a;border-radius:9px;padding:9px 11px;margin-bottom:8px;background:#14120e}
.pick.on{border-color:var(--gold);background:rgba(212,175,104,.08)}
.pick b{color:#f0dfb8;font-size:13px}
.pick span{display:block;font-size:11px;color:#9c8f76;margin-top:2px;font-family:system-ui}
.pick .btn2{margin-top:6px;font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid #5c4c2c;
  background:#221d15;color:#d8c9a8;font-family:system-ui}

#dailyBar{margin:0 14px 8px;padding:7px 11px;border-radius:9px;font-size:11.5px;line-height:1.6;
  background:linear-gradient(90deg,rgba(60,44,20,.55),rgba(24,20,12,.4));border:1px solid #5a4a24;color:#e8d2a0}
#dailyBar b{color:#ffcf7a}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-58px) scale(1)}}
.dmgnum{position:absolute;left:50%;top:44%;z-index:6;font-size:20px;font-weight:900;color:#ffd479;
  text-shadow:0 2px 8px #000,0 0 14px rgba(255,120,60,.6);animation:floatUp .95s ease-out forwards;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.shake{animation:shake .32s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.scene,.choices,.actions{animation:fadeIn .28s ease-out}

#timeBar{margin:0 14px 8px;font-size:11px;color:#8a8f99;font-family:system-ui}
#timeBar b{color:#e8d2a0}
.taskrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #2e2a22;font-size:12.5px}
.taskrow .n{flex:1;color:#cbbd9e}
.taskrow .pg{font-size:10.5px;color:#8a8f99;font-family:system-ui}
</style></head>
<body>

<!-- 登录 -->
<div id="auth" class="authwrap">
  <div class="logo"><div class="big">江湖行</div><div class="en">A WUXIA TEXT SIMULATOR</div></div>
  <div class="card">
    <div class="tabs2"><div class="t on" id="tabLogin">登 录</div><div class="t" id="tabReg">注 册</div></div>
    <label>账号（3-16 位字母/数字/下划线）</label>
    <input id="u" autocapitalize="off" placeholder="例：xiake001">
    <div id="nickBox" class="hidden"><label>江湖名号</label><input id="n" maxlength="12" placeholder="例：沈孤鸿"></div>
    <label>密码（≥6 位）</label>
    <input id="p" type="password" placeholder="••••••">
    <div id="p2Box" class="hidden"><label>确认密码</label><input id="p2" type="password" placeholder="再输一次"></div>
    <div class="err" id="err"></div>
    <button class="btn" id="doAuth">登 录</button>
  </div>
</div>

<!-- 游戏 -->
<div id="game" class="hidden">
  <div class="hdr">
    <div class="seal" id="seal">侠</div>
    <div class="who"><b id="pname">无名侠客</b><span id="puid">UID —</span></div>
    <div class="tools">
      <div class="tbtn" id="btnWorld">世界</div>
      <div class="tbtn" id="btnMap">地图</div>
      <div class="tbtn" id="btnLog">记录</div>
      <div class="tbtn" id="btnReset">重开</div>
      <div class="tbtn" id="btnOut">退出</div>
    </div>
  </div>
  <div id="noticeBar" class="hidden"></div>
  <div id="eventBar" class="hidden"></div>
  <div id="dailyBar"></div>
  <div id="timeBar"></div>
  <div class="stats" id="stats"></div>
  <div class="illust"><img id="art" src="art/scene-ai.jpg" alt=""><div class="cap" id="artCap"></div></div>
  <div class="scene">
    <div class="title" id="stTitle"></div>
    <div class="text" id="stText"></div>
  </div>
  <div class="choices" id="choices"></div>

  <div class="actions" id="actions">
    <button class="act" data-act="arts">📜 武学</button>
    <button class="act" data-act="online">🌏 名录</button>
    <button class="act" data-act="meet">👤 遇见</button>
    <button class="act" data-act="rank">🏆 榜单</button>
    <button class="act" data-act="guild">🏯 帮派</button>
    <button class="act" data-act="daily">🌙 日常</button>
    <button class="act" data-act="board">📋 委托</button>
    <button class="act" data-act="train">🧘 修炼</button>
    <button class="act" data-act="heal">💊 疗伤</button>
    <button class="act" data-act="scout">👂 打听</button>
  </div>
  <div id="endingBox"></div>
</div>

<!-- 记录 -->
<div id="battle" class="battle hidden">
  <div class="bstage">
    <img id="bArt" src="art/png/w_villain.png" alt="">
    <div class="bname" id="bName"></div>
    <div class="bbar"><i id="bHp"></i></div>
    <div class="bhp" id="bHpTxt"></div>
    <div id="bCombo" style="position:absolute;right:10px;bottom:48px;z-index:2;font-size:13px;font-weight:900;color:#ffd479;text-shadow:0 0 8px #000"></div>
  </div>
  <div class="blog" id="bLog"></div>
  <div class="bmoves">
    <button class="mv" data-move="attack">🗡 攻击</button>
    <button class="mv" data-move="skill">⚡ 内力击（-10）</button>
    <button class="mv" data-move="guard">🛡 格挡</button>
    <button class="mv" data-move="flee">🏃 逃走</button>
  </div>
</div>

<div id="artsSheet" class="sheet hidden">
  <div class="box">
    <h3>武学 · 职业 · 心法</h3>
    <div class="tabs2" style="margin-bottom:12px">
      <div class="t " id="tabJob">职业</div>
      <div class="t" id="tabArt">武学</div>
      <div class="t" id="tabMind">心法</div>
    </div>
    <div id="artsBody"></div>
    <button class="btn dark" id="artsClose" style="margin-top:14px">收起</button>
  </div>
</div>

<div id="boardSheet" class="sheet hidden">
  <div class="box">
    <h3>今日委托 <span id="timeTxt" style="font-size:10px;color:#8a8f99"></span></h3>
    <div id="taskList"></div>
    <div style="font-size:11px;color:#8a8f99;margin:14px 0 6px;font-family:system-ui">生计（赚银两，会花时间）</div>
    <div class="grid2" id="jobBtns">
      <button class="btn2" data-work="escort">押镖 40两（晨）</button>
      <button class="btn2" data-work="serve">跑堂 15两（午）</button>
      <button class="btn2" data-work="herb">抓药 20两（晨）</button>
      <button class="btn2" data-work="teach">代馆 30两（午）</button>
      <button class="btn2" data-work="watch">巡夜 25两（夜）</button>
    </div>
    <div id="lifeBox"></div>
    <button class="btn dark" id="boardClose" style="margin-top:14px">收起</button>
  </div>
</div>

<div id="guildSheet" class="sheet hidden">
  <div class="box">
    <h3>帮派</h3>
    <div id="guildBody"></div>
    <button class="btn dark" id="guildClose" style="margin-top:14px">收起</button>
  </div>
</div>

<div id="rankSheet" class="sheet hidden">
  <div class="box">
    <h3>切磋榜 · 江湖名次</h3>
    <div id="rankList"></div>
    <button class="btn dark" id="rankClose" style="margin-top:14px">收起</button>
  </div>
</div>

<div id="onlineSheet" class="sheet hidden">
  <div class="box">
    <h3>江湖名录 <span style="font-size:10px;color:#8a8f99">（10 分钟内活跃）</span></h3>
    <div id="onlineList"></div>
    <button class="btn dark" id="onlineClose" style="margin-top:14px">收起</button>
  </div>
</div>

<div id="bagSheet" class="sheet hidden">
  <div class="box">
    <h3>行囊</h3>
    <div id="bagList"></div>
    <button class="btn dark" id="bagClose" style="margin-top:14px">收起</button>
  </div>
</div>

<div id="injectSheet" class="sheet hidden">
  <div class="box">
    <h3 id="injTitle">插曲</h3>
    <div id="injText" style="font-size:14px;line-height:1.9;color:#ddd2ba"></div>
    <div id="injOpts" style="margin-top:14px;display:flex;flex-direction:column;gap:9px"></div>
  </div>
</div>

<div id="worldSheet" class="sheet hidden">
  <div class="box">
    <h3>世界观 · 天下九洲</h3>
    <div id="worldBody" style="font-size:13px;line-height:1.95;color:#cbbd9e"></div>
    <button class="btn dark" id="worldClose" style="margin-top:14px">收起</button>
  </div>
</div>

<div id="mapSheet" class="sheet hidden">
  <div class="box">
    <h3>江湖地图 · 四派</h3>
    <div id="mapList"></div>
    <button class="btn dark" id="mapClose" style="margin-top:14px">收起</button>
  </div>
</div>

<div id="logSheet" class="sheet hidden">
  <div class="box">
    <h3>江湖记录</h3>
    <div id="logList"></div>
    <button class="btn dark" id="logClose" style="margin-top:14px">合上</button>
  </div>
</div>

<script>
const $=(id)=>document.getElementById(id);
let token=localStorage.getItem('wuxia_token')||'', S=null, mode='login';

async function api(p,b){
  const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});
  return r.json();
}
function setMode(m){
  mode=m; const reg=m==='reg';
  $('tabLogin').classList.toggle('on',!reg); $('tabReg').classList.toggle('on',reg);
  $('nickBox').classList.toggle('hidden',!reg); $('p2Box').classList.toggle('hidden',!reg);
  $('doAuth').textContent=reg?'注 册':'登 录'; $('err').textContent='';
}
async function doAuth(){
  const user=$('u').value.trim().toLowerCase(), pass=$('p').value, err=$('err');
  err.textContent='';
  if(!/^[a-z0-9_]{3,16}$/.test(user)) return err.textContent='账号需 3-16 位字母/数字/下划线';
  if(pass.length<6) return err.textContent='密码至少 6 位';
  let r;
  if(mode==='reg'){
    if($('p2').value!==pass) return err.textContent='两次密码不一致';
    r=await api('/api/register',{user,pass,nick:$('n').value.trim()});
  } else r=await api('/api/login',{user,pass});
  if(r.error) return err.textContent=r.error;
  token=r.token; localStorage.setItem('wuxia_token',token);
  S=r.state; showGame();
}
function showGame(){
  $('auth').classList.add('hidden'); $('game').classList.remove('hidden');
  render();
}
function render(){
  if(!S) return;
  const a=S.me.attrs;
  $('pname').textContent=S.me.nick; $('puid').textContent='UID '+S.me.uid;
  $('seal').textContent=S.me.nick.slice(0,1);
  const rows=[['hp','气血',a.hp],['ni','内力',a.neili],['wu','悟性',a.wuxing],
              ['fa','名望',a.fame],['mo','银两',a.money],['ka','善恶',a.karma]];

  const bd=S.battle;

    $('art').style.display='none'; $('choices').style.display='none'; $('actions').style.display='none';

    $('bArt').onerror=function(){this.onerror=null;this.src='art/png/w_villain.png';};
    $('bName').textContent=bd.name;
    const pct=Math.max(0,Math.round(bd.hp/bd.maxHp*100));
    $('bHp').style.width=pct+'%';

    $('bLog').innerHTML=(bd.log||[]).slice(-5).map(t=>'<div>'+t+'</div>').join('');
    const last=(bd.log||[]).slice(-1)[0]||'';
    const mnum=last.match(/造成 (\d+) 伤害/);
    if(mnum && mnum[1]!==String(window.__lastDmg||'')){
      window.__lastDmg=mnum[1];
      const d=document.createElement('div'); d.className='dmgnum'; d.textContent='-'+mnum[1];
      document.querySelector('.bstage').appendChild(d);
      setTimeout(()=>d.remove(),950);
      const bs=document.querySelector('.bstage'); if(bs){bs.classList.add('shake');setTimeout(()=>bs.classList.remove('shake'),340);}

    $('bCombo').textContent=(bd.combo>1?('连招 ×'+bd.combo):'');

    return;

  $('endingBox').innerHTML='';

  $('choices').innerHTML=frozenTip+(sc.choices||[]).map(c=>`<button class="ch" data-i="${c.i}" ${S.frozen?'disabled style="opacity:.4"':''}>${c.text}</button>`).join('')

  const m=e.target.dataset&&e.target.dataset.mind; if(m) return act('setMind',{key:m}).then(()=>{renderArts();});
});
$('btnReset').onclick=()=>{ if(confirm('重新开始？当前进度会清空')) act('restart'); };
$('btnOut').onclick=()=>{ localStorage.removeItem('wuxia_token'); token=''; $('game').classList.add('hidden'); $('auth').classList.remove('hidden'); setMode('login'); };

(async function boot(){
  try{
    if(!token){ $('auth').classList.remove('hidden'); setMode('login'); return; }
    const st=await api('/api/state?token='+token);
    if(st.error){ localStorage.removeItem('wuxia_token'); $('auth').classList.remove('hidden'); setMode('login'); return; }
    S=st; showGame();
  }catch(e){
    $('auth').classList.remove('hidden'); setMode('login'); $('err').textContent='加载失败，请刷新';
  }
})();
</script>
<script>
window.addEventListener('error',function(e){
  try{var d=document.createElement('div');
    d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:rgba(120,24,20,.96);color:#fff;font:12px/1.5 monospace;padding:8px;border-radius:8px;white-space:pre-wrap';
    d.textContent='脚本错误：'+(e.message||'未知')+' @'+(e.lineno||'');
    document.body.appendChild(d);}catch(x){}
});
setTimeout(function(){
  try{
    var a=document.getElementById('auth'), g=document.getElementById('game');
    if(a && g && a.classList.contains('hidden') && g.classList.contains('hidden')){
      a.classList.remove('hidden'); console.warn('failsafe');
    }
  }catch(e){}
},700);
</script>
