services:
  - type: web
    name: jianghuxing
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_FILE
        value: /var/data/data.json
    disk:
      name: save
      mountPath: /var/data
      sizeGB: 1
